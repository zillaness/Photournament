<!--
  The same trick for the perceptual hash. A Worker has no `window`, so
  20_phash.js cannot simply be importScripts'd; the ingest pool prepends a
  `window = self` shim and this source, so the worker computes a real pHash
  rather than falling back to its own inlined dHash.
-->
<script type="text/plain" id="phash-src">/**
 * @file 20_phash.js
 * @version 1.0
 * @author Samuel Cao
 * @created 2026-07-28
 * @lastUpdated 2026-07-28
 * @description Perceptual hashing, sharpness scoring, near-duplicate clustering and representative nomination for PRD 7.7.
 * @aiUpdate Update @lastUpdated and @version. Append changelog at bottom.
 */

/* eslint-disable no-bitwise */
(function (global) {
  'use strict';

  global.PT = global.PT || {};
  var PT = global.PT;

  // ---------------------------------------------------------------------------
  // Tuning constants — every number here is measured, see
  // tools/probes/04_phash/FINDINGS.md
  // ---------------------------------------------------------------------------

  /**
   * Recommended Hamming distance for "these are the same shot", calibrated for
   * phash() (see RECOMMENDED_HASH).
   *
   * Measured on a 122-frame corpus, 7,381 labelled pairs: pHash + strict at 14
   * scored precision 1.000 and recall 1.000 — every burst, expression variant,
   * re-encode and minor crop/rotation grouped, and not one unrelated pair did.
   * The first false positive appears at 16; the first false negative at 13.
   * Full sweep in tools/probes/04_phash/FINDINGS.md.
   *
   * dHash needs a different number. Its clean band is 8-10, and it has no
   * threshold that separates the two populations completely.
   */
  var DEFAULT_THRESHOLD = 14;

  /**
   * Useful span for the PRD 7.7 sensitivity slider. Below 4 only re-encodes of
   * the same file group; above 20 pHash precision falls under 0.75 and the user
   * spends more time splitting groups than the grouping saves.
   *
   * pHash is a constant-weight code (every hash has exactly 31 one-bits), so
   * every pHash distance is EVEN and odd thresholds behave identically to the
   * even one below. Step the slider by 2.
   */
  var THRESHOLD_RANGE = [4, 20];

  /** Default linkage for cluster(). See FINDINGS.md section 6. */
  var DEFAULT_MODE = 'strict';

  /**
   * Which hash to cluster on. pHash beat dHash on every measure that matters:
   * complete separation of positives from negatives, 27 non-transitive triples
   * against dHash's 356, and a precision curve that stays at 1.000 while recall
   * climbs monotonically, so the sensitivity slider behaves predictably.
   * dhash() stays exported: it is 1.2x cheaper and useful as a fast pre-filter.
   */
  var RECOMMENDED_HASH = 'phash';

  var DHASH_W = 9;   // 9x8 grey -> 8 rows x 8 horizontal comparisons = 64 bits
  var DHASH_H = 8;
  var PHASH_N = 32;  // DCT input edge
  var PHASH_K = 8;   // low-frequency block kept
  var SHARP_EDGE = 256; // grey plane long edge the sharpness metric works on

  /** Nomination weights. Sharpness dominates; resolution breaks near-ties. */
  var NOMINATE_SHARP_WEIGHT = 0.70;
  var NOMINATE_RES_WEIGHT = 0.30;

  // ---------------------------------------------------------------------------
  // Lookup tables
  // ---------------------------------------------------------------------------

  var HEXCHARS = '0123456789abcdef';

  /** hex char code -> nibble, -1 for anything else. */
  var HEXVAL = (function () {
    var t = new Int8Array(128);
    for (var i = 0; i < 128; i++) t[i] = -1;
    for (var d = 0; d < 10; d++) t[48 + d] = d;
    for (var a = 0; a < 6; a++) { t[97 + a] = 10 + a; t[65 + a] = 10 + a; }
    return t;
  })();

  /**
   * Separable DCT-II basis, orthonormally scaled:
   * DCT_COS[u*N + x] = s(u) * cos((2x+1) * u * PI / (2N))
   */
  var DCT_COS = (function (N) {
    var c = new Float64Array(N * N);
    var s0 = Math.sqrt(1 / N);
    var s = Math.sqrt(2 / N);
    for (var u = 0; u < N; u++) {
      var scale = u === 0 ? s0 : s;
      for (var x = 0; x < N; x++) {
        c[u * N + x] = scale * Math.cos(((2 * x + 1) * u * Math.PI) / (2 * N));
      }
    }
    return c;
  })(PHASH_N);

  // Scratch buffers. A worker is single threaded and the app hashes one image
  // at a time, so reusing these is safe and saves ~9KB of allocation per image.
  var _dctTmp = new Float64Array(PHASH_N * PHASH_N);
  var _dctLow = new Float64Array(PHASH_K * PHASH_K);
  var _medBuf = new Float64Array(PHASH_K * PHASH_K);

  // ---------------------------------------------------------------------------
  // Pixel helpers
  // ---------------------------------------------------------------------------

  function isImageData(img) {
    return !!img && typeof img.width === 'number' && typeof img.height === 'number' &&
      img.data && typeof img.data.length === 'number' &&
      img.data.length >= img.width * img.height * 4;
  }

  function assertImageData(img, who) {
    if (!isImageData(img)) throw new TypeError('PT.phash.' + who + ': expected an ImageData-like {width,height,data}');
    if (img.width < 1 || img.height < 1) throw new TypeError('PT.phash.' + who + ': empty ImageData');
  }

  /**
   * Rec.601 luma, 0..255, as Float32. Alpha is ignored on purpose: photos are
   * opaque, and compositing onto an assumed background would make the hash
   * depend on something the user never sees.
   * @param {ImageData} img
   * @returns {Float32Array}
   */
  function toGrey(img) {
    var d = img.data;
    var n = img.width * img.height;
    var out = new Float32Array(n);
    for (var i = 0, p = 0; i < n; i++, p += 4) {
      out[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
    }
    return out;
  }

  /**
   * Area-average (box) downsample of a greyscale plane.
   *
   * Box averaging rather than point sampling matters a lot here: point-sampling
   * a 1200px frame down to 32px aliases high-frequency texture into the hash,
   * and two frames of the same burst alias differently, which shows up directly
   * as burst-pair distance.
   *
   * Implemented as a scatter: one sequential pass over the source accumulating
   * into output buckets. The obvious gather form (walk the output, sum the
   * source box) is 3.5x slower at 9x8 output on a 1600px source, because each
   * output cell strides across ~1MB of source and the next cell walks the same
   * rows again. Measured, not assumed — see FINDINGS.md section 7.
   *
   * @param {Float32Array} src
   * @param {number} w source width
   * @param {number} h source height
   * @param {number} ow target width
   * @param {number} oh target height
   * @returns {Float32Array}
   */
  function downsampleGrey(src, w, h, ow, oh) {
    var out = new Float32Array(ow * oh);
    var x, y;

    // Upsampling has no box to average, so fall back to nearest-neighbour.
    if (ow > w || oh > h) {
      for (y = 0; y < oh; y++) {
        var sy = Math.min(h - 1, Math.floor((y * h) / oh));
        for (x = 0; x < ow; x++) {
          out[y * ow + x] = src[sy * w + Math.min(w - 1, Math.floor((x * w) / ow))];
        }
      }
      return out;
    }

    // Column and row bucket maps, plus how many source pixels land in each.
    // Both maps are monotonically non-decreasing, which is what lets the inner
    // loop accumulate in a register and only touch memory at a bucket boundary.
    var colBucket = new Int32Array(w);
    var colCount = new Int32Array(ow);
    for (x = 0; x < w; x++) {
      var cb = Math.min(ow - 1, Math.floor((x * ow) / w));
      colBucket[x] = cb;
      colCount[cb]++;
    }
    var rowCount = new Int32Array(oh);
    for (y = 0; y < h; y++) rowCount[Math.min(oh - 1, Math.floor((y * oh) / h))]++;

    for (y = 0; y < h; y++) {
      var orow = Math.min(oh - 1, Math.floor((y * oh) / h)) * ow;
      var srow = y * w;
      var sum = 0;
      var bucket = 0;
      for (x = 0; x < w; x++) {
        var b = colBucket[x];
        if (b !== bucket) { out[orow + bucket] += sum; sum = 0; bucket = b; }
        sum += src[srow + x];
      }
      out[orow + bucket] += sum;
    }

    for (var oy2 = 0; oy2 < oh; oy2++) {
      for (var ox2 = 0; ox2 < ow; ox2++) {
        var n = colCount[ox2] * rowCount[oy2];
        if (n) out[oy2 * ow + ox2] /= n;
      }
    }
    return out;
  }

  function bytesToHex(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) {
      s += HEXCHARS[bytes[i] >> 4] + HEXCHARS[bytes[i] & 15];
    }
    return s;
  }

  // ---------------------------------------------------------------------------
  // dHash
  // ---------------------------------------------------------------------------

  /**
   * 64-bit difference hash. 9x8 greyscale box-downsample, one bit per
   * horizontal adjacent-pixel comparison. All 64 bits are informative.
   *
   * Cheap, and immune to any monotonic exposure change because it only ever
   * compares neighbours inside the same frame.
   *
   * @param {ImageData} imageData RGBA pixels
   * @returns {string} 16 lowercase hex chars
   */
  function dhash(imageData) {
    assertImageData(imageData, 'dhash');
    var g = downsampleGrey(toGrey(imageData), imageData.width, imageData.height, DHASH_W, DHASH_H);
    var bytes = new Uint8Array(8);
    var bit = 0;
    for (var y = 0; y < DHASH_H; y++) {
      var row = y * DHASH_W;
      for (var x = 0; x < DHASH_W - 1; x++, bit++) {
        if (g[row + x] > g[row + x + 1]) bytes[bit >> 3] |= 0x80 >> (bit & 7);
      }
    }
    return bytesToHex(bytes);
  }

  // ---------------------------------------------------------------------------
  // pHash
  // ---------------------------------------------------------------------------

  /**
   * 64-bit DCT hash. 32x32 greyscale box-downsample, separable 2-D DCT-II, the
   * top-left 8x8 low-frequency block thresholded at the median of its 63
   * non-DC coefficients.
   *
   * The DC bit is forced to 0: DC is always the largest coefficient, so its bit
   * would be a constant 1 and would carry no information while inflating every
   * distance by nothing. So the hash is 64 bits wide with 63 informative bits.
   *
   * @param {ImageData} imageData RGBA pixels
   * @returns {string} 16 lowercase hex chars
   */
  function phash(imageData) {
    assertImageData(imageData, 'phash');
    var g = downsampleGrey(toGrey(imageData), imageData.width, imageData.height, PHASH_N, PHASH_N);
    var N = PHASH_N, u, x, y, v, sum;

    // Rows: tmp[y][u] = sum_x g[y][x] * cos(u,x)
    for (y = 0; y < N; y++) {
      var gr = y * N;
      for (u = 0; u < N; u++) {
        sum = 0;
        var cu = u * N;
        for (x = 0; x < N; x++) sum += g[gr + x] * DCT_COS[cu + x];
        _dctTmp[gr + u] = sum;
      }
    }
    // Columns, but only the 8 rows that survive into the hash.
    for (v = 0; v < PHASH_K; v++) {
      var cv = v * N;
      for (u = 0; u < PHASH_K; u++) {
        sum = 0;
        for (y = 0; y < N; y++) sum += _dctTmp[y * N + u] * DCT_COS[cv + y];
        _dctLow[v * PHASH_K + u] = sum;
      }
    }

    var m = 0;
    for (v = 0; v < PHASH_K; v++) {
      for (u = 0; u < PHASH_K; u++) {
        if (v === 0 && u === 0) continue;
        _medBuf[m++] = _dctLow[v * PHASH_K + u];
      }
    }
    var med = medianOf(_medBuf, m);

    var bytes = new Uint8Array(8);
    var bit = 0;
    for (v = 0; v < PHASH_K; v++) {
      for (u = 0; u < PHASH_K; u++, bit++) {
        if (v === 0 && u === 0) continue;               // DC bit stays 0
        if (_dctLow[v * PHASH_K + u] > med) bytes[bit >> 3] |= 0x80 >> (bit & 7);
      }
    }
    return bytesToHex(bytes);
  }

  /** Median of the first n entries of buf. Copies; buf is untouched. */
  function medianOf(buf, n) {
    var a = new Array(n);
    for (var i = 0; i < n; i++) a[i] = buf[i];
    a.sort(function (p, q) { return p - q; });
    return (n & 1) ? a[(n - 1) >> 1] : 0.5 * (a[(n >> 1) - 1] + a[n >> 1]);
  }

  // ---------------------------------------------------------------------------
  // Hamming distance
  // ---------------------------------------------------------------------------

  /** Population count of a 32-bit word, no table lookup. */
  function popcnt32(x) {
    x = x - ((x >>> 1) & 0x55555555);
    x = (x & 0x33333333) + ((x >>> 2) & 0x33333333);
    x = (x + (x >>> 4)) & 0x0f0f0f0f;
    return (x * 0x01010101) >>> 24;
  }

  /** Parse 8 hex chars starting at off into an unsigned 32-bit word. */
  function hexWord(s, off) {
    var w = 0;
    for (var i = off; i < off + 8; i++) {
      var v = HEXVAL[s.charCodeAt(i) & 127];
      if (v < 0) throw new TypeError('PT.phash.hamming: not a hex hash: ' + s);
      w = (w << 4) | v;
    }
    return w >>> 0;
  }

  /**
   * Hamming distance between two 16-char hex hashes, 0..64.
   *
   * Called O(n^2) times by cluster(), so it does no allocation: two manual
   * 8-char hex parses and two branchless popcounts. Measured throughput is in
   * FINDINGS.md section 7.
   *
   * @param {string} hexA
   * @param {string} hexB
   * @returns {number} 0..64
   */
  function hamming(hexA, hexB) {
    if (typeof hexA !== 'string' || typeof hexB !== 'string') {
      throw new TypeError('PT.phash.hamming: expected two hex strings');
    }
    if (hexA.length !== 16 || hexB.length !== 16) {
      throw new TypeError('PT.phash.hamming: expected 16-char hashes, got ' + hexA.length + '/' + hexB.length);
    }
    return popcnt32(hexWord(hexA, 0) ^ hexWord(hexB, 0)) +
           popcnt32(hexWord(hexA, 8) ^ hexWord(hexB, 8));
  }

  // ---------------------------------------------------------------------------
  // Sharpness
  // ---------------------------------------------------------------------------

  /**
   * Contrast-normalised variance of the 4-neighbour Laplacian, measured on a
   * fixed 256px-long-edge greyscale plane. Higher is sharper.
   *
   * Raw variance-of-Laplacian is the textbook blur metric but it is not
   * comparable between the images that actually land in one near-duplicate
   * group. It scales with resolution (more pixels per edge means a smaller
   * per-pixel second derivative) and with scene contrast (a bright high-contrast
   * frame beats a flat one regardless of focus). A group routinely mixes a
   * 12MP original with a downscaled re-export, so both corrections are needed:
   *
   *   1. resample to a fixed long edge, so resolution does not set the scale
   *   2. divide by the variance of the grey plane, so contrast does not either
   *
   * What is left is edge energy per unit contrast. Resolution then re-enters
   * the decision deliberately and separately, as a weighted term in nominate().
   *
   * @param {ImageData} imageData RGBA pixels
   * @returns {number} >= 0, higher is sharper
   */
  function sharpness(imageData) {
    assertImageData(imageData, 'sharpness');
    var w = imageData.width, h = imageData.height;
    var grey = toGrey(imageData);

    var sw, sh;
    if (w >= h) { sw = Math.min(SHARP_EDGE, w); sh = Math.max(1, Math.round((h / w) * sw)); }
    else { sh = Math.min(SHARP_EDGE, h); sw = Math.max(1, Math.round((w / h) * sh)); }
    var g = (sw === w && sh === h) ? grey : downsampleGrey(grey, w, h, sw, sh);

    if (sw < 3 || sh < 3) return 0;

    var lapSum = 0, lapSq = 0, n = 0;
    for (var y = 1; y < sh - 1; y++) {
      var r = y * sw;
      for (var x = 1; x < sw - 1; x++) {
        var i = r + x;
        var lap = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - sw] - g[i + sw];
        lapSum += lap; lapSq += lap * lap; n++;
      }
    }
    if (n === 0) return 0;
    var lapMean = lapSum / n;
    var lapVar = lapSq / n - lapMean * lapMean;

    var gSum = 0, gSq = 0, m = sw * sh;
    for (var k = 0; k < m; k++) { gSum += g[k]; gSq += g[k] * g[k]; }
    var gMean = gSum / m;
    var gVar = gSq / m - gMean * gMean;

    var s = lapVar / Math.max(gVar, 1e-6);
    return s > 0 ? s : 0;
  }

  // ---------------------------------------------------------------------------
  // Clustering
  // ---------------------------------------------------------------------------

  function byId(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }

  /**
   * Group near-duplicates by Hamming distance.
   *
   * Perceptual hashes are not transitive: A~B and B~C does not imply A~C. The
   * linkage rule is therefore a product decision, not an implementation detail,
   * and it is exposed as `mode`:
   *
   *   "union"  single linkage / union-find. Any single edge merges two groups.
   *            Maximum recall, but chaining is not a corner case: at the
   *            default threshold of 14 the probe corpus produced a group whose
   *            own diameter was 26 — members nearly twice the threshold apart,
   *            in a group the user is told is a set of duplicates.
   *   "strict" complete linkage. A photo joins a group only if it is within
   *            `threshold` of EVERY current member, so a group's diameter can
   *            never exceed the threshold and the slider means exactly what it
   *            says. This is the default; see FINDINGS.md section 6.
   *
   * Determinism: items are processed in sorted-id order and a joining photo
   * picks the group whose worst-case distance is smallest, so the result never
   * depends on ingest order. Groups come back sorted by their smallest member
   * id, ids sorted within each group, singletons included.
   *
   * @param {Array<{id:string, hash:string, w?:number, h?:number, sharp?:number}>} items
   * @param {{threshold?:number, mode?:"union"|"strict"}} [opts]
   * @returns {Array<Array<string>>} groups of ids
   */
  function cluster(items, opts) {
    if (!items || !items.length) return [];
    opts = opts || {};
    var threshold = opts.threshold == null ? DEFAULT_THRESHOLD : opts.threshold;
    var mode = opts.mode || DEFAULT_MODE;
    if (mode !== 'union' && mode !== 'strict') {
      throw new TypeError('PT.phash.cluster: mode must be "union" or "strict", got ' + mode);
    }

    // Sorted-id order is what makes both modes order-independent.
    var order = items.slice().sort(function (a, b) { return byId(a.id, b.id); });
    var n = order.length;

    // Decode every hash once into two 32-bit words. This is the whole reason
    // cluster() at 500 items is cheap: the O(n^2) inner loop never touches a
    // string.
    var hi = new Int32Array(n), lo = new Int32Array(n);
    for (var i = 0; i < n; i++) {
      var hx = order[i].hash;
      if (typeof hx !== 'string' || hx.length !== 16) {
        throw new TypeError('PT.phash.cluster: item ' + order[i].id + ' has no 16-char hash');
      }
      hi[i] = hexWord(hx, 0) | 0;
      lo[i] = hexWord(hx, 8) | 0;
    }
    function dist(a, b) {
      return popcnt32(hi[a] ^ hi[b]) + popcnt32(lo[a] ^ lo[b]);
    }

    var groups;
    if (mode === 'union') {
      var parent = new Int32Array(n);
      for (var p = 0; p < n; p++) parent[p] = p;
      var find = function (a) {
        while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; }
        return a;
      };
      for (var a1 = 0; a1 < n; a1++) {
        for (var b1 = a1 + 1; b1 < n; b1++) {
          if (dist(a1, b1) <= threshold) {
            var ra = find(a1), rb = find(b1);
            if (ra !== rb) parent[rb] = ra;
          }
        }
      }
      var buckets = {};
      for (var k = 0; k < n; k++) {
        var root = find(k);
        (buckets[root] || (buckets[root] = [])).push(k);
      }
      groups = [];
      for (var key in buckets) if (Object.prototype.hasOwnProperty.call(buckets, key)) groups.push(buckets[key]);
    } else {
      // Complete linkage, greedy in sorted-id order, best-fit rather than
      // first-fit so the outcome does not depend on which group happened to be
      // created first.
      groups = [];
      for (var idx = 0; idx < n; idx++) {
        var bestG = -1, bestWorst = Infinity;
        for (var g = 0; g < groups.length; g++) {
          var worst = 0, ok = true;
          for (var m2 = 0; m2 < groups[g].length; m2++) {
            var d = dist(idx, groups[g][m2]);
            if (d > threshold) { ok = false; break; }
            if (d > worst) worst = d;
          }
          if (ok && worst < bestWorst) { bestWorst = worst; bestG = g; }
        }
        if (bestG >= 0) groups[bestG].push(idx);
        else groups.push([idx]);
      }
    }

    var out = groups.map(function (grp) {
      return grp.map(function (ix) { return order[ix].id; }).sort(byId);
    });
    out.sort(function (x, y) { return byId(x[0], y[0]); });
    return out;
  }

  // ---------------------------------------------------------------------------
  // Representative nomination (PRD 7.7)
  // ---------------------------------------------------------------------------

  /**
   * Pick the representative of a near-duplicate group, per PRD 7.7's
   * "sharpness and resolution heuristic". One click overrides this in the UI,
   * so the job is to be right most of the time, not to be right always.
   *
   * Both terms are normalised inside the group, so the score is a ranking
   * within that group and never compares absolute values across groups:
   *
   *   score = 0.70 * (sharp / maxSharp) + 0.30 * (pixels / maxPixels)
   *
   * Sharpness carries most of the weight because blur is what a human actually
   * notices. Resolution carries the rest for margin: sharpness() is deliberately
   * resolution-invariant, so a downscaled crisp re-export lands within 3-13% of
   * the full-size original it came from, and 3% is inside the noise of JPEG
   * quality and scene content. The resolution term turns that into a decisive
   * 0.25 gap. On one earlier corpus, weighting sharpness alone picked the
   * 480px copy over its 1200px source in 4 of 42 trials. FINDINGS.md section 8
   * has the numbers and the crossover table.
   *
   * Ties break on the smallest id, so the nomination is stable across runs.
   *
   * @param {Array<{id:string, w?:number, h?:number, sharp?:number}>} members
   * @returns {string} the winning id
   */
  function nominate(members) {
    if (!members || !members.length) throw new TypeError('PT.phash.nominate: empty group');
    if (members.length === 1) return members[0].id;

    var maxS = 0, maxP = 0, i, px;
    for (i = 0; i < members.length; i++) {
      var s = +members[i].sharp;
      if (isFinite(s) && s > maxS) maxS = s;
      px = (+members[i].w || 0) * (+members[i].h || 0);
      if (px > maxP) maxP = px;
    }
    if (!(maxS > 0)) maxS = 1;
    if (!(maxP > 0)) maxP = 1;

    var bestId = null, bestScore = -Infinity;
    for (i = 0; i < members.length; i++) {
      var sv = +members[i].sharp;
      if (!isFinite(sv) || sv < 0) sv = 0;
      px = (+members[i].w || 0) * (+members[i].h || 0);
      var score = NOMINATE_SHARP_WEIGHT * (sv / maxS) + NOMINATE_RES_WEIGHT * (px / maxP);
      if (score > bestScore || (score === bestScore && byId(members[i].id, bestId) < 0)) {
        bestScore = score;
        bestId = members[i].id;
      }
    }
    return bestId;
  }

  // ---------------------------------------------------------------------------

  PT.phash = {
    dhash: dhash,
    phash: phash,
    hamming: hamming,
    sharpness: sharpness,
    cluster: cluster,
    nominate: nominate,
    DEFAULT_THRESHOLD: DEFAULT_THRESHOLD,
    THRESHOLD_RANGE: THRESHOLD_RANGE,
    DEFAULT_MODE: DEFAULT_MODE,
    RECOMMENDED_HASH: RECOMMENDED_HASH,
    // internals, exposed for the probe harness and for anything that already
    // holds a greyscale plane
    _internal: {
      toGrey: toGrey,
      downsampleGrey: downsampleGrey,
      bytesToHex: bytesToHex,
      popcnt32: popcnt32,
      NOMINATE_SHARP_WEIGHT: NOMINATE_SHARP_WEIGHT,
      NOMINATE_RES_WEIGHT: NOMINATE_RES_WEIGHT,
      SHARP_EDGE: SHARP_EDGE
    }
  };

  if (typeof PT.log === 'function') PT.log('phash', 'ready, default threshold', DEFAULT_THRESHOLD, DEFAULT_MODE);
})(typeof window !== 'undefined' ? window : self);

/*
 * CHANGELOG
 * ---------
 * v1.0 (2026-07-28) — Initial release. dHash (9x8 difference) and pHash
 *   (32x32 DCT-II, 8x8 low-frequency block, median threshold, DC bit zeroed),
 *   allocation-free 32-bit Hamming distance, contrast-normalised
 *   variance-of-Laplacian sharpness at a fixed 256px long edge, union and
 *   strict linkage clustering with deterministic ordering, and weighted
 *   sharpness+resolution representative nomination. Thresholds and weights set
 *   from the measurements in tools/probes/04_phash/FINDINGS.md.
 */
</script>

<script>
/* ===== 00_core.js ===== */
/**
 * @file 00_core.js
 * @version 1.1
 * @author Samuel Cao
 * @created 2026-07-28
 * @lastUpdated 2026-07-28
 * @description Core runtime for Photournament: global namespace, event bus, observable store, IndexedDB wrapper, file fingerprinting, DOM helpers, and the screen router.
 * @aiUpdate Update @lastUpdated and @version. Append changelog at bottom.
 *
 * Loaded first. Every other module assumes PT, PT.bus, PT.store, PT.db and PT.dom exist.
 *
 * Runtime constraints this file is written against, all measured (see
 * tools/probes/01_capability_matrix/FINDINGS.md):
 *   - The page may be opened from file://, where window.origin is the opaque string "null".
 *   - fetch(), XHR, module scripts with src, and relative-URL Workers are ALL CORS-blocked there.
 *     Nothing in this file may load anything by URL.
 *   - IndexedDB works fully on file:// and survives a browser restart, so it carries all persistence.
 *   - Every file:// page in a Chrome profile shares ONE origin bucket named file__0. There is no
 *     per-file isolation and the quota is shared with every other local HTML tool the user has open,
 *     so the database name is explicitly namespaced.
 *   - storage.persist() returns false even on localhost in a fresh profile. The cache is therefore
 *     EVICTABLE: everything cached here must be re-derivable from the originals on disk.
 */

(function () {
  'use strict';

  var PT = (window.PT = window.PT || {});

  PT.VERSION = '0.2';

  /* ---------------------------------------------------------------- logging */

  var LOG_ON = true;
  PT.log = function (scope) {
    if (!LOG_ON) return;
    var rest = Array.prototype.slice.call(arguments, 1);
    console.log.apply(console, ['[' + scope + ']'].concat(rest));
  };
  PT.warn = function (scope) {
    var rest = Array.prototype.slice.call(arguments, 1);
    console.warn.apply(console, ['[' + scope + ']'].concat(rest));
  };
  PT.setLogging = function (on) { LOG_ON = !!on; };

  /* -------------------------------------------------------------- event bus */

  /**
   * Fire-and-forget pub/sub. Used for cross-module notifications that are not
   * state changes (progress ticks, screen transitions, toasts). Anything that
   * IS state belongs in the store instead, so it persists and replays.
   */
  var listeners = Object.create(null);

  PT.bus = {
    /** @returns {function():void} unsubscribe */
    on: function (name, fn) {
      (listeners[name] || (listeners[name] = [])).push(fn);
      return function () { PT.bus.off(name, fn); };
    },
    once: function (name, fn) {
      var un = PT.bus.on(name, function (d) { un(); fn(d); });
      return un;
    },
    off: function (name, fn) {
      var a = listeners[name];
      if (!a) return;
      var i = a.indexOf(fn);
      if (i >= 0) a.splice(i, 1);
    },
    emit: function (name, detail) {
      var a = listeners[name];
      if (!a) return;
      // Copy: a handler may unsubscribe during dispatch.
      a.slice().forEach(function (fn) {
        try { fn(detail); } catch (e) { PT.warn('bus', 'handler for "' + name + '" threw', e); }
      });
    }
  };

  /* ------------------------------------------------------------------ store */

  /**
   * Single source of truth. Mutations go through dispatch(name, mutatorFn) so that
   * every change has a name, subscribers fire once, and persistence is automatic
   * rather than something each screen has to remember.
   *
   * The decision JSON of PRD 7.8 falls out of the action log rather than being
   * assembled separately at export time.
   */
  var state = null;
  var subs = [];
  var actionLog = [];
  var saveTimer = null;
  var SAVE_DEBOUNCE_MS = 400;

  PT.store = {
    get: function () { return state; },

    init: function (initial) {
      state = initial;
      actionLog = [];
      subs.slice().forEach(function (fn) { fn(state, '@init'); });
    },

    /**
     * @param {string} name  action name, recorded in the log
     * @param {function(object):void} fn  mutates state in place
     * @param {{silent?:boolean, transient?:boolean}} [opts]
     *        silent    - do not notify subscribers (batching)
     *        transient - do not record in the action log or trigger a save
     *                    (use for high-frequency UI-only changes like hover)
     */
    dispatch: function (name, fn, opts) {
      opts = opts || {};
      if (!state) throw new Error('PT.store.dispatch before init');
      fn(state);
      if (!opts.transient) {
        actionLog.push({ t: Date.now(), a: name });
        scheduleSave();
      }
      if (!opts.silent) {
        subs.slice().forEach(function (s) {
          try { s(state, name); } catch (e) { PT.warn('store', 'subscriber threw on "' + name + '"', e); }
        });
      }
    },

    subscribe: function (fn) {
      subs.push(fn);
      return function () {
        var i = subs.indexOf(fn);
        if (i >= 0) subs.splice(i, 1);
      };
    },

    actionLog: function () { return actionLog.slice(); },

    /** Force an immediate write, bypassing the debounce. Called before unload. */
    flush: function () {
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
      return persist();
    }
  };

  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { saveTimer = null; persist(); }, SAVE_DEBOUNCE_MS);
  }

  function persist() {
    if (!state || !state.session) return Promise.resolve();
    // Photo Blobs live in their own store keyed by id; the session record holds
    // only structured data, so a save stays small and fast even at 500 photos.
    var snapshot = PT.serializeSession ? PT.serializeSession(state) : state.session;
    return PT.db.put('sessions', snapshot).catch(function (e) {
      PT.warn('store', 'persist failed', e);
    });
  }

  /* --------------------------------------------------------------- indexeddb */

  /**
   * Namespaced because every file:// page shares the single file__0 origin bucket
   * with every other local tool the user has ever opened.
   */
  var DB_NAME = 'photournament/v1';
  var DB_VERSION = 1;

  var STORES = {
    sessions:    { keyPath: 'id' },
    photos:      { keyPath: 'id' },   // photo records minus Blobs
    derivatives: { keyPath: 'id' },   // {id, thumb: Blob, preview: Blob, sidecar: Blob|null}
    handles:     { keyPath: 'key' }   // {key, handle} — FileSystemDirectoryHandle, structured-cloneable
  };

  var dbPromise = null;

  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        Object.keys(STORES).forEach(function (name) {
          if (!db.objectStoreNames.contains(name)) {
            db.createObjectStore(name, STORES[name]);
          }
        });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { PT.warn('db', 'open blocked by another tab'); };
    });
    return dbPromise;
  }

  function tx(storeName, mode, fn) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(storeName, mode);
        var store = t.objectStore(storeName);
        var out;
        try { out = fn(store); } catch (e) { reject(e); return; }
        t.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
        t.onerror = function () { reject(t.error); };
        t.onabort = function () { reject(t.error || new Error('transaction aborted')); };
      });
    });
  }

  PT.db = {
    name: DB_NAME,

    get: function (store, key) {
      return tx(store, 'readonly', function (s) { return s.get(key); });
    },
    put: function (store, value) {
      return tx(store, 'readwrite', function (s) { return s.put(value); });
    },
    /** Writes many records in ONE transaction — materially faster at 500 photos. */
    putAll: function (store, values) {
      return tx(store, 'readwrite', function (s) {
        values.forEach(function (v) { s.put(v); });
        return values.length;
      });
    },
    del: function (store, key) {
      return tx(store, 'readwrite', function (s) { return s.delete(key); });
    },
    clear: function (store) {
      return tx(store, 'readwrite', function (s) { return s.clear(); });
    },
    all: function (store) {
      return tx(store, 'readonly', function (s) { return s.getAll(); });
    },
    keys: function (store) {
      return tx(store, 'readonly', function (s) { return s.getAllKeys(); });
    },

    /**
     * Cache size for PRD section 8's "show cache size, offer clear-cache" mitigation.
     * usageDetails.indexedDB is the honest number; quota tracks free disk.
     */
    usage: function () {
      if (!navigator.storage || !navigator.storage.estimate) {
        return Promise.resolve({ usage: 0, quota: 0, idb: 0, supported: false });
      }
      return navigator.storage.estimate().then(function (e) {
        return {
          usage: e.usage || 0,
          quota: e.quota || 0,
          idb: (e.usageDetails && e.usageDetails.indexedDB) || 0,
          supported: true
        };
      });
    },

    /**
     * Best-effort. Measured to return false even on localhost in a fresh profile,
     * so callers must treat a false result as normal, not as an error.

    return bytesToHex(bytes);

  /** Median of the first n entries of buf. Copies; buf is untouched. */

  // ---------------------------------------------------------------------------

   * 8-char hex parses and two branchless popcounts. Measured throughput is in

  // ---------------------------------------------------------------------------

  /**
   * Contrast-normalised variance of the 4-neighbour Laplacian, measured on a
   * fixed 256px-long-edge greyscale plane. Higher is sharper.
   *
   * Raw variance-of-Laplacian is the textbook blur metric but it is not
   * comparable between the images that actually land in one near-duplicate
   * group. It scales with resolution (more pixels per edge means a smaller
   * per-pixel second derivative) and with scene contrast (a bright high-contrast
   * frame beats a flat one regardless of focus). A group routinely mixes a
   * 12MP original with a downscaled re-export, so both corrections are needed:
   *

   *   2. divide by the variance of the grey plane, so contrast does not either
   *

   * the decision deliberately and separately, as a weighted term in nominate().

    if (w >= h) { sw = Math.min(SHARP_EDGE, w); sh = Math.max(1, Math.round((h / w) * sw)); }
    else { sh = Math.min(SHARP_EDGE, h); sw = Math.max(1, Math.round((w / h) * sh)); }
    var g = (sw === w && sh === h) ? grey : downsampleGrey(grey, w, h, sw, sh);

    if (sw < 3 || sh < 3) return 0;

    var lapSum = 0, lapSq = 0, n = 0;
    for (var y = 1; y < sh - 1; y++) {
      var r = y * sw;
      for (var x = 1; x < sw - 1; x++) {
        var i = r + x;
        var lap = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - sw] - g[i + sw];
        lapSum += lap; lapSq += lap * lap; n++;
      }
    }
    if (n === 0) return 0;
    var lapMean = lapSum / n;
    var lapVar = lapSq / n - lapMean * lapMean;

    var gSum = 0, gSq = 0, m = sw * sh;
    for (var k = 0; k < m; k++) { gSum += g[k]; gSq += g[k] * g[k]; }
    var gMean = gSum / m;
    var gVar = gSq / m - gMean * gMean;

    var s = lapVar / Math.max(gVar, 1e-6);

  }

  // ---------------------------------------------------------------------------
  // Clustering
  // ---------------------------------------------------------------------------

  function byId(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }

  /**
   * Group near-duplicates by Hamming distance.
   *
   * Perceptual hashes are not transitive: A~B and B~C does not imply A~C. The
   * linkage rule is therefore a product decision, not an implementation detail,
   * and it is exposed as `mode`:
   *
   *   "union"  single linkage / union-find. Any single edge merges two groups.
   *            Maximum recall, but chaining is not a corner case: at the
   *            default threshold of 14 the probe corpus produced a group whose
   *            own diameter was 26 — members nearly twice the threshold apart,
   *            in a group the user is told is a set of duplicates.
   *   "strict" complete linkage. A photo joins a group only if it is within
   *            `threshold` of EVERY current member, so a group's diameter can
   *            never exceed the threshold and the slider means exactly what it
   *            says. This is the default; see FINDINGS.md section 6.
   *
   * Determinism: items are processed in sorted-id order and a joining photo
   * picks the group whose worst-case distance is smallest, so the result never
   * depends on ingest order. Groups come back sorted by their smallest member
   * id, ids sorted within each group, singletons included.
   *
   * @param {Array<{id:string, hash:string, w?:number, h?:number, sharp?:number}>} items

    opts = opts || {};

    var mode = opts.mode || DEFAULT_MODE;
    if (mode !== 'union' && mode !== 'strict') {
      throw new TypeError('PT.phash.cluster: mode must be "union" or "strict", got ' + mode);
    }

    // Sorted-id order is what makes both modes order-independent.
    var order = items.slice().sort(function (a, b) { return byId(a.id, b.id); });
    var n = order.length;

    // Decode every hash once into two 32-bit words. This is the whole reason
    // cluster() at 500 items is cheap: the O(n^2) inner loop never touches a
    // string.
    var hi = new Int32Array(n), lo = new Int32Array(n);

      var hx = order[i].hash;

        throw new TypeError('PT.phash.cluster: item ' + order[i].id + ' has no 16-char hash');
      }
      hi[i] = hexWord(hx, 0) | 0;
      lo[i] = hexWord(hx, 8) | 0;
    }
    function dist(a, b) {
      return popcnt32(hi[a] ^ hi[b]) + popcnt32(lo[a] ^ lo[b]);
    }

    var groups;
    if (mode === 'union') {
      var parent = new Int32Array(n);
      for (var p = 0; p < n; p++) parent[p] = p;
      var find = function (a) {
        while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; }
        return a;
      };
      for (var a1 = 0; a1 < n; a1++) {
        for (var b1 = a1 + 1; b1 < n; b1++) {
          if (dist(a1, b1) <= threshold) {
            var ra = find(a1), rb = find(b1);
            if (ra !== rb) parent[rb] = ra;
          }
        }
      }
      var buckets = {};
      for (var k = 0; k < n; k++) {
        var root = find(k);
        (buckets[root] || (buckets[root] = [])).push(k);
      }
      groups = [];
      for (var key in buckets) if (Object.prototype.hasOwnProperty.call(buckets, key)) groups.push(buckets[key]);
    } else {
      // Complete linkage, greedy in sorted-id order, best-fit rather than
      // first-fit so the outcome does not depend on which group happened to be
      // created first.
      groups = [];
      for (var idx = 0; idx < n; idx++) {
        var bestG = -1, bestWorst = Infinity;
        for (var g = 0; g < groups.length; g++) {
          var worst = 0, ok = true;
          for (var m2 = 0; m2 < groups[g].length; m2++) {
            var d = dist(idx, groups[g][m2]);
            if (d > threshold) { ok = false; break; }
            if (d > worst) worst = d;
          }
          if (ok && worst < bestWorst) { bestWorst = worst; bestG = g; }
        }
        if (bestG >= 0) groups[bestG].push(idx);
        else groups.push([idx]);
      }
    }

    var out = groups.map(function (grp) {
      return grp.map(function (ix) { return order[ix].id; }).sort(byId);
    });
    out.sort(function (x, y) { return byId(x[0], y[0]); });
    return out;
  }

  // ---------------------------------------------------------------------------
  // Representative nomination (PRD 7.7)
  // ---------------------------------------------------------------------------

  /**
   * Pick the representative of a near-duplicate group, per PRD 7.7's
   * "sharpness and resolution heuristic". One click overrides this in the UI,
   * so the job is to be right most of the time, not to be right always.
   *
   * Both terms are normalised inside the group, so the score is a ranking
   * within that group and never compares absolute values across groups:
   *
   *   score = 0.70 * (sharp / maxSharp) + 0.30 * (pixels / maxPixels)
   *
   * Sharpness carries most of the weight because blur is what a human actually
   * notices. Resolution carries the rest for margin: sharpness() is deliberately
   * resolution-invariant, so a downscaled crisp re-export lands within 3-13% of
   * the full-size original it came from, and 3% is inside the noise of JPEG
   * quality and scene content. The resolution term turns that into a decisive
   * 0.25 gap. On one earlier corpus, weighting sharpness alone picked the
   * 480px copy over its 1200px source in 4 of 42 trials. FINDINGS.md section 8
   * has the numbers and the crossover table.
   *
   * Ties break on the smallest id, so the nomination is stable across runs.
   *
   * @param {Array<{id:string, w?:number, h?:number, sharp?:number}>} members
   * @returns {string} the winning id
   */
  function nominate(members) {
    if (!members || !members.length) throw new TypeError('PT.phash.nominate: empty group');
    if (members.length === 1) return members[0].id;

    var maxS = 0, maxP = 0, i, px;
    for (i = 0; i < members.length; i++) {
      var s = +members[i].sharp;
      if (isFinite(s) && s > maxS) maxS = s;
      px = (+members[i].w || 0) * (+members[i].h || 0);
      if (px > maxP) maxP = px;

    if (!(maxS > 0)) maxS = 1;
    if (!(maxP > 0)) maxP = 1;

    var bestId = null, bestScore = -Infinity;
    for (i = 0; i < members.length; i++) {

      px = (+members[i].w || 0) * (+members[i].h || 0);
      var score = NOMINATE_SHARP_WEIGHT * (sv / maxS) + NOMINATE_RES_WEIGHT * (px / maxP);
      if (score > bestScore || (score === bestScore && byId(members[i].id, bestId) < 0)) {
        bestScore = score;
        bestId = members[i].id;
      }

  }

  // ---------------------------------------------------------------------------

  PT.phash = {
    dhash: dhash,
    phash: phash,
    hamming: hamming,
    sharpness: sharpness,
    cluster: cluster,
    nominate: nominate,
    DEFAULT_THRESHOLD: DEFAULT_THRESHOLD,
    THRESHOLD_RANGE: THRESHOLD_RANGE,
    DEFAULT_MODE: DEFAULT_MODE,

<script>
/* ===== 30_tree.js ===== */
/**
 * @file 30_tree.js
 * @version 1.0
 * @author Samuel Cao
 * @created 2026-07-28
 * @lastUpdated 2026-07-28
 * @description Folder tree model and finalist allocation math for PRD section 4: four allocation states, both math directions, clamping, dead-state detection, and tournament unit derivation.
 * @aiUpdate Update @lastUpdated and @version. Append changelog at bottom.
 *
 * This module is pure. It reads photo records and an allocation map and returns a
 * resolution; it never touches the DOM and never mutates its inputs. That is
 * deliberate — the allocation rules are the easiest thing in the PRD to get subtly
 * wrong, and keeping them pure makes them directly testable.
 *
 * THE FOUR STATES (PRD 4.2)
 *   fixed     a number >= 1   parent: children must sum to this   leaf: exactly this many
 *   excluded  0               entire subtree skipped everywhere
 *   pooled    blank           competes with blank siblings for the parent's remainder
 *   uncapped  "*" or Infinity parent: total floats to sum of children   leaf: cull until satisfied
 *
 * 0 means EXCLUDED, not unlimited (PRD section 10). Every other value counts survivors.
 *
 * DESIGN DECISION NOT IN THE PRD: a folder may hold photos directly AND have
 * subfolders. The PRD's worked example (4.3) only shows leaf folders holding photos.
 * Loose photos in a parent are modelled as a synthetic child node with path
 * "<parent>/loose" so they can carry their own allocation state and compete
 * as an ordinary sibling. Without this they would either be silently unallocatable
 * or would force the parent to be both authoritative and a competitor at once.
 */

(function () {
  'use strict';

  var PT = (window.PT = window.PT || {});

  var LOOSE = '__loose__';
  var LOOSE_LABEL = '(loose files)';

  var MODE = { FIXED: 'fixed', EXCLUDED: 'excluded', POOLED: 'pooled', UNCAPPED: 'uncapped' };

  /* ------------------------------------------------------------------ build */

  /**
   * @param {Array<object>} photos  photo records with .path and .dir
   * @returns {{nodes:Object, rootPath:string, order:Array<string>}}
   */
  function build(photos) {
    var nodes = Object.create(null);

    function ensure(path) {
      if (nodes[path]) return nodes[path];
      var name = path === '' ? '/' : path.slice(path.lastIndexOf('/') + 1);
      var parentPath = path === '' ? null : path.slice(0, Math.max(0, path.lastIndexOf('/')));
      var n = {
        path: path,
        name: name === LOOSE ? LOOSE_LABEL : name,
        parentPath: path === '' ? null : parentPath,
        childPaths: [],
        photoIds: [],
        synthetic: name === LOOSE
      };
      nodes[path] = n;
      if (path !== '') {
        var p = ensure(parentPath);
        if (p.childPaths.indexOf(path) < 0) p.childPaths.push(path);
      }
      return n;
    }

    ensure('');
    photos.forEach(function (p) {
      ensure(p.dir).photoIds.push(p.id);
    });

    // Any node holding both direct photos and subfolders gets its loose photos
    // moved into a synthetic child so every competitor in a pool is a node.
    Object.keys(nodes).forEach(function (path) {
      var n = nodes[path];
      if (n.photoIds.length && n.childPaths.length && !n.synthetic) {
        var lp = (path === '' ? '' : path) + '/' + LOOSE;
        var loose = ensure(lp);
        loose.photoIds = n.photoIds;
        n.photoIds = [];
      }
    });

    var order = [];
    (function walk(path) {
      order.push(path);
      nodes[path].childPaths
        .slice()
        .sort(function (a, b) {
          // Synthetic loose nodes sort last so they read as an addendum.
          var as = nodes[a].synthetic, bs = nodes[b].synthetic;
          if (as !== bs) return as ? 1 : -1;
          return a.localeCompare(b, undefined, { numeric: true });
        })
        .forEach(walk);
    })('');

    Object.keys(nodes).forEach(function (path) {
      nodes[path].childPaths.sort(function (a, b) {
        var as = nodes[a].synthetic, bs = nodes[b].synthetic;
        if (as !== bs) return as ? 1 : -1;
        return a.localeCompare(b, undefined, { numeric: true });
      });
    });

    return { nodes: nodes, rootPath: '', order: order };
  }

  /* ------------------------------------------------------------ alloc input */

  /**
   * Parses what the user typed into an allocation state.
   * @param {string|number|null} raw
   * @returns {{mode:string, value:number|null}|null}  null means the input is invalid
   */
  function parseAlloc(raw) {
    if (raw === null || raw === undefined) return { mode: MODE.POOLED, value: null };
    var s = String(raw).trim();
    if (s === '') return { mode: MODE.POOLED, value: null };
    if (s === '*' || s === '∞' || s.toLowerCase() === 'inf') return { mode: MODE.UNCAPPED, value: null };
    if (!/^\d+$/.test(s)) return null;
    var n = parseInt(s, 10);
    if (n === 0) return { mode: MODE.EXCLUDED, value: 0 };
    return { mode: MODE.FIXED, value: n };
  }

  function allocToInput(alloc) {
    if (!alloc) return '';
    if (alloc.mode === MODE.UNCAPPED) return '*';
    if (alloc.mode === MODE.EXCLUDED) return '0';
    if (alloc.mode === MODE.FIXED) return String(alloc.value);
    return '';
  }

  /* ---------------------------------------------------------------- resolve */

  /**
   * The whole of PRD section 4 in one pass.
   *
   * @param {object} tree   from build()
   * @param {Object<string,{mode:string,value:number|null}>} allocs  path -> state
   * @returns {{
   *   nodes: Object,          per-path derived facts
   *   issues: Array<object>,  {path, level:'error'|'warn'|'note', code, message}
   *   units: Array<object>,   tournament units

   *   hasErrors: boolean

    allocs = allocs || {};
    var nodes = tree.nodes;
    var out = Object.create(null);
    var issues = [];

    function allocOf(path) {
      return allocs[path] || { mode: MODE.POOLED, value: null };
    }

    function isExcluded(path) {
      var a = allocOf(path);
      if (a.mode === MODE.EXCLUDED) return true;
      var p = nodes[path].parentPath;
      return p === null ? false : isExcluded(p);
    }

    /**
     * A blank node is only genuinely pooled if it is competing for something.
     * A blank node that merely sits between an allocated ancestor and allocated
     * descendants is a PASS-THROUGH container, not a competitor.
     *
     * Without this distinction, PRD 4.1's "no depth cap" collides with PRD 4.5's
     * dead-state rule: on a tree like a/b/c/d/e/f, allocating the root and the leaf
     * would light up every intermediate folder as a dead pool, which is noise
     * rather than a real problem the user needs to fix.
     */
    function hasAllocatedDescendant(path) {
      var kids = nodes[path].childPaths;
      for (var i = 0; i < kids.length; i++) {
        var c = kids[i];
        if (out[c].excluded) continue;
        var m = out[c].alloc.mode;
        if (m === MODE.FIXED || m === MODE.UNCAPPED) return true;
        if (hasAllocatedDescendant(c)) return true;
      }
      return false;
    }

    // Pass 1, bottom-up: photo counts, ignoring excluded subtrees entirely
    // (PRD 4.5: not ingested, not hashed, not counted in totals).
    (function count(path) {
      var n = nodes[path];
      var self = allocOf(path).mode === MODE.EXCLUDED;
      var kids = n.childPaths.map(count);
      var total = self ? 0 : n.photoIds.length + kids.reduce(function (a, b) { return a + b; }, 0);
      out[path] = {
        path: path,
        name: n.name,
        alloc: allocOf(path),
        excluded: self || isExcluded(path),
        ownCount: self ? 0 : n.photoIds.length,
        subtreeCount: total,
        childPaths: n.childPaths,
        synthetic: n.synthetic,
        target: null,        // number | null (null = uncapped or no target)
        uncapped: false,
        clamped: false,
        pooledShare: null,   // set on pooled nodes that belong to a pool
        unitId: null
      };
      return total;
    })(tree.rootPath);

    // Pass 2, top-down: resolve targets. A node's meaning depends on its parent's
    // state (PRD 4.4), so this cannot be folded into the bottom-up pass.
    var units = [];

    (function assign(path) {
      var n = nodes[path];
      var o = out[path];
      var a = o.alloc;

      if (o.excluded) {
        o.target = 0;
        n.childPaths.forEach(assign);
        return;
      }

      var kids = n.childPaths.filter(function (c) { return !out[c].excluded; });

      // --- leaf ---------------------------------------------------------
      if (kids.length === 0) {
        if (a.mode === MODE.UNCAPPED) {
          o.uncapped = true;
          o.target = null;
          if (o.subtreeCount > 0) {
            units.push(makeUnit('uncapped', path, [path], null, o));
          }
        } else if (a.mode === MODE.FIXED) {
          o.target = Math.min(a.value, o.subtreeCount);
          if (a.value > o.subtreeCount) {
            o.clamped = true;
            issues.push({
              path: path, level: 'warn', code: 'clamped',
              message: 'Asked for ' + a.value + ' but the folder only has ' + o.subtreeCount +
                       '. Clamped to ' + o.target + '.'
            });
          }
          if (o.target > 0) units.push(makeUnit('fixed', path, [path], o.target, o));
        }
        // pooled leaves are claimed by their parent's pool below
        return;
      }

      // --- parent -------------------------------------------------------
      kids.forEach(assign);

      var fixedKids  = kids.filter(function (c) { return out[c].alloc.mode === MODE.FIXED; });
      var uncapKids  = kids.filter(function (c) { return out[c].alloc.mode === MODE.UNCAPPED; });
      var pooledKids = kids.filter(function (c) { return out[c].alloc.mode === MODE.POOLED; });

      var fixedSum = fixedKids.reduce(function (s, c) { return s + (out[c].target || 0); }, 0);

      if (a.mode === MODE.UNCAPPED) {
        // Children are authoritative; the parent total is computed and read-only.
        o.uncapped = true;
        o.target = null;
        // PRD 4.5: pooled under uncapped has no remainder to compete for. Dead
        // state — but only for genuine competitors, not pass-through containers.
        pooledKids.forEach(function (c) {
          if (hasAllocatedDescendant(c)) return;
          issues.push({
            path: c, level: 'error', code: 'dead-pool',
            message: 'Pooled under an uncapped parent, so there is no remainder to compete for. ' +
                     'Give it a count, or set ' + (nodes[path].name || 'the parent') + ' to a fixed number.'
          });
        });
        return;
      }

      if (a.mode === MODE.FIXED) {
        if (fixedSum > a.value) {
          issues.push({
            path: path, level: 'error', code: 'oversubscribed',
            message: 'Children are fixed at ' + fixedSum + ', which is more than this folder’s ' +
                     a.value + '. Lower a child, or set this folder to uncapped (*).'
          });
          o.target = a.value;
          return;
        }
        if (uncapKids.length) {
          issues.push({
            path: path, level: 'error', code: 'uncapped-under-fixed',
            message: 'An uncapped child has no target, so this folder’s fixed total of ' + a.value +
                     ' cannot be honoured. Set this folder to uncapped (*), or give the child a number.'
          });
        }

        var remainder = a.value - fixedSum;
        o.target = a.value;

        if (pooledKids.length) {
          var poolCount = pooledKids.reduce(function (s, c) { return s + out[c].subtreeCount; }, 0);
          var share = Math.min(remainder, poolCount);
          if (remainder > poolCount) {
            issues.push({
              path: path, level: 'warn', code: 'pool-clamped',
              message: 'The pooled folders hold ' + poolCount + ' photos but ' + remainder +
                       ' places are open. Only ' + poolCount + ' can survive.'
            });
          }
          if (share > 0) {
            var u = makeUnit('pooled', path, pooledKids.slice(), share, o);
            units.push(u);
            pooledKids.forEach(function (c) { out[c].pooledShare = u.id; out[c].unitId = u.id; });
          } else {
            pooledKids.forEach(function (c) {
              issues.push({
                path: c, level: 'warn', code: 'no-remainder',
                message: 'Nothing left to compete for — the fixed siblings already use all ' +
                         a.value + ' places.'
              });
            });
          }
        } else if (remainder > 0) {
          // PRD 4.5: every child fixed under a fixed parent leaves no pooled remainder.
          issues.push({
            path: path, level: 'note', code: 'unused-remainder',
            message: 'Every child has a fixed count summing to ' + fixedSum + ', so ' + remainder +
                     ' of this folder’s ' + a.value + ' places will go unused.'
          });
        }
        return;
      }

      // Pooled parent: it is itself a competitor in its own parent's pool, so its
      // target is decided one level up. Its pooled children have no independent
      // remainder, which the grandparent's pool already accounts for.
      o.target = null;
    })(tree.rootPath);

    // Root special case: a pooled root has no parent to allocate it, so treat it
    // as one pool over everything — PRD 4.2's "all children pooled: pure best-of".
    var rootOut = out[tree.rootPath];
    if (!rootOut.excluded && rootOut.alloc.mode === MODE.POOLED && !units.length && rootOut.subtreeCount > 0) {
      issues.push({
        path: tree.rootPath, level: 'note', code: 'root-unallocated',
        message: 'Nothing is allocated yet. Give the top folder a number, or a count to at least one subfolder.'
      });
    }

    var projected = units.some(function (u) { return u.target === null; })
      ? null
      : units.reduce(function (s, u) { return s + u.target; }, 0);

    return {
      nodes: out,
      issues: issues,
      units: units,
      projectedTotal: projected,
      hasErrors: issues.some(function (i) { return i.level === 'error'; })
    };

    function makeUnit(kind, ownerPath, memberPaths, target, o) {
      var ids = [];
      memberPaths.forEach(function (mp) { collectIds(mp, ids); });
      var u = {
        id: kind + ':' + (ownerPath || 'root'),
        kind: kind,
        ownerPath: ownerPath,
        memberPaths: memberPaths,
        label: kind === 'pooled'
          ? 'pooled under ' + (nodes[ownerPath].name || 'root')
          : (nodes[ownerPath].name || 'root'),
        target: target,
        photoIds: ids
      };
      if (kind !== 'pooled') o.unitId = u.id;
      return u;
    }

    function collectIds(path, acc) {
      if (out[path].excluded) return;
      nodes[path].photoIds.forEach(function (id) { acc.push(id); });
      nodes[path].childPaths.forEach(function (c) { collectIds(c, acc); });
    }
  }

  /* ------------------------------------------------------------- distribute */

  /**
   * Top-down suggestion for a fixed parent (PRD 4.4). Default is weighted by photo
   * count; even split is offered. The result is a suggestion the user may edit per
   * child, never an applied value.
   *
   * Largest-remainder apportionment, so the parts sum exactly to the total rather
   * than drifting by a photo or two after rounding.
   *
   * @returns {Object<string,number>} childPath -> suggested count
   */
  function distribute(tree, resolution, parentPath, total, mode) {
    var kids = tree.nodes[parentPath].childPaths.filter(function (c) {
      return !resolution.nodes[c].excluded && resolution.nodes[c].subtreeCount > 0;
    });
    if (!kids.length) return {};

    var caps = kids.map(function (c) { return resolution.nodes[c].subtreeCount; });
    var weights = mode === 'even' ? kids.map(function () { return 1; }) : caps.slice();
    var wsum = weights.reduce(function (a, b) { return a + b; }, 0) || 1;

    var exact = weights.map(function (w) { return (total * w) / wsum; });
    var base = exact.map(function (x) { return Math.floor(x); });
    var used = base.reduce(function (a, b) { return a + b; }, 0);

    var order = kids
      .map(function (c, i) { return { i: i, frac: exact[i] - base[i] }; })
      .sort(function (a, b) { return b.frac - a.frac; });

    var left = total - used;
    for (var k = 0; k < order.length && left > 0; k++) { base[order[k].i]++; left--; }

    // Never suggest more finalists than a folder has photos; push the excess to
    // folders that can still absorb it.
    var overflow = 0;
    base.forEach(function (v, i) {
      if (v > caps[i]) { overflow += v - caps[i]; base[i] = caps[i]; }
    });
    // Keep redistributing until the excess is placed or every folder is at
    // capacity. A bounded number of passes is not enough: pushing 8 surplus
    // places onto one folder needs 8 increments, not one per pass.
    while (overflow > 0) {
      var placed = 0;
      for (var i = 0; i < kids.length && overflow > 0; i++) {
        if (base[i] < caps[i]) { base[i]++; overflow--; placed++; }
      }
      if (!placed) break; // every folder is full; the total is simply unreachable
    }

    var res = {};
    kids.forEach(function (c, i) { res[c] = base[i]; });
    return res;
  }

  /* ------------------------------------------------------------------- api */

  PT.tree = {
    MODE: MODE,
    LOOSE: LOOSE,
    build: build,
    parseAlloc: parseAlloc,
    allocToInput: allocToInput,
    resolve: resolve,
    distribute: distribute
  };
})();

/** CHANGELOG
 * v1.0 (2026-07-28): Initial release. Tree construction with synthetic nodes for
 *   loose files, allocation parsing for all four states, two-pass resolution with
 *   clamping and dead-state detection, tournament unit derivation, and
 *   largest-remainder weighted distribution.
 */

<script>
/* ===== 35_session.js ===== */
/**
 * @file 35_session.js
 * @version 1.0
 * @author Samuel Cao
 * @created 2026-07-28
 * @lastUpdated 2026-07-28
 * @description Session model and stage flow for Photournament: settings defaults, tournament unit state, quota resolution, pass bookkeeping, and persistence shaping.
 * @aiUpdate Update @lastUpdated and @version. Append changelog at bottom.
 *
 * The single source of truth for where the user is and what they have decided.
 * Screens read from here and dispatch through here; they never hold stage state
 * of their own. That is what makes PRD 7.10's mid-pass resume possible — the
 * position within a Stage A pass lives in the store, not in a screen's closure.
 *
 * Blobs (thumbnails, previews) are deliberately NOT part of the persisted
 * session. They live in the `derivatives` object store keyed by photo id, so a
 * save stays small at 500 photos, and an evicted cache costs re-derivation
 * rather than lost decisions.
 */

(function () {
  'use strict';

  var PT = (window.PT = window.PT || {});

  /** PRD section 12 settings summary. Every default here is from that table. */
  var DEFAULTS = {
    gridSize: 9,                 // 6 | 9 | 12 | 16
    quotaMode: 'half',           // 'one' | 'half' | 'custom' | 'unlimited'
    quotaCustom: 4,
    shuffle: true,
    cullFloor: 0.25,             // 0 disables (PRD 7.2)
    stageD: false,               // cross-category final, off by default
    stageDTarget: 10,
    prefixes: true,              // ordered filename prefixes
    outputStructure: 'mirror',   // 'mirror' | 'flat'
    distribution: 'weighted',    // 'weighted' | 'even'
    sidecarLocation: 'subfolder',// '_sidecars' subfolder | 'alongside'
    exportHeicAs: 'ask',         // decided per export
    dupeThreshold: 14,           // measured in tools/probes/04_phash/FINDINGS.md
    dupeMode: 'strict'
  };

  var PHASES = ['gridA', 'rescue', 'dupes', 'bracket', 'runoff', 'done'];

  function newSession(rootName, sourceKind) {
    return {
      id: 'sess-' + Date.now().toString(36),
      createdAt: Date.now(),
      rootName: rootName || 'photos',
      sourceKind: sourceKind || 'files',   // 'handle' = can resume and write to disk
      settings: Object.assign({}, DEFAULTS),
      allocs: {},                          // path -> {mode, value}
      stage: 'ingest',                     // ingest | tree | unit | stageD | export | done
      activeUnitId: null,
      units: {},                           // unitId -> unit state
      stageDUnit: null,
      finished: false
    };
  }

  /**
   * Fresh per-unit state. `pool` is the live field; `cut` is everything Stage A
   * has rejected, which the rescue screen reads (PRD 7.5).
   */
  function newUnit(u) {
    return {
      id: u.id,
      kind: u.kind,                // fixed | pooled | uncapped
      label: u.label,
      target: u.target,            // null when uncapped
      allIds: u.photoIds.slice(),
      pool: u.photoIds.slice(),
      cut: [],
      rescued: [],
      phase: 'gridA',
      passes: [],                  // completed pass summaries
      currentPass: null,           // live pass, persisted so resume works mid-pass
      groups: null,                // near-duplicate groups once reviewed
      bracket: null,
      winners: [],
      startedAt: Date.now(),
      comparisons: 0
    };
  }

  /**
   * PRD 7.1 quota, resolved for a given screen size.
   * Returns Infinity for unlimited so callers can compare without special-casing.
   */
  function resolveQuota(settings, screenCount) {
    switch (settings.quotaMode) {
      case 'one':       return 1;
      case 'half':      return Math.max(1, Math.floor(screenCount / 2));
      case 'custom':    return Math.max(1, Math.min(settings.quotaCustom, screenCount));
      case 'unlimited': return Infinity;
      default:          return Math.max(1, Math.floor(screenCount / 2));
    }
  }

  function quotaLabel(settings) {
    switch (settings.quotaMode) {
      case 'one':       return 'Keep 1';
      case 'half':      return 'Keep up to half';
      case 'custom':    return 'Keep up to ' + settings.quotaCustom;
      case 'unlimited': return 'Unlimited';
      default:          return 'Keep up to half';
    }
  }

  /**
   * Deterministic shuffle so a resumed pass deals the same screens in the same
   * order. A Math.random() shuffle would reorder the remaining photos on reload
   * and silently show some twice and others never.
   */
  function seededShuffle(ids, seed) {
    var a = ids.slice();
    var s = seed >>> 0 || 1;
    for (var i = a.length - 1; i > 0; i--) {
      s = (s * 1664525 + 1013904223) >>> 0;
      var j = s % (i + 1);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /**
   * Begin a Stage A pass. Configuration locks here for the duration (PRD section 2):
   * the settings are COPIED into the pass, so changing a setting mid-pass cannot
   * loosen the quota the user committed to.
   */
  function startPass(unit, settings) {
    var seed = (Date.now() ^ (unit.passes.length * 2654435761)) >>> 0;
    return {
      n: unit.passes.length + 1,
      gridSize: settings.gridSize,
      quotaMode: settings.quotaMode,
      quotaCustom: settings.quotaCustom,
      shuffled: settings.shuffle,
      seed: seed,
      order: settings.shuffle ? seededShuffle(unit.pool, seed) : unit.pool.slice(),
      index: 0,               // screens completed
      kept: [],               // ids kept so far this pass
      startedAt: Date.now(),
      fieldAtStart: unit.pool.length
    };
  }

  function screenAt(pass, i) {
    var start = i * pass.gridSize;
    return pass.order.slice(start, start + pass.gridSize);
  }

  function screensTotal(pass) {
    return Math.ceil(pass.order.length / pass.gridSize);
  }

  /**
   * Fold a completed pass back into the unit and produce the summary PRD 7.2
   * reports on. Everything not kept is cut, which is the forcing function the
   * whole tool exists to provide.
   */
  function finishPass(unit, pass) {
    var keptSet = Object.create(null);
    pass.kept.forEach(function (id) { keptSet[id] = 1; });

    var cutNow = pass.order.filter(function (id) { return !keptSet[id]; });
    var before = pass.fieldAtStart;
    var after = pass.kept.length;

    var summary = {
      n: pass.n,
      gridSize: pass.gridSize,
      quotaMode: pass.quotaMode,
      quotaCustom: pass.quotaCustom,
      shuffled: pass.shuffled,
      before: before,
      after: after,
      cut: cutNow.length,
      cutPct: before ? cutNow.length / before : 0,
      screens: screensTotal(pass),
      ms: Date.now() - pass.startedAt
    };

    unit.pool = pass.kept.slice();
    unit.cut = unit.cut.concat(cutNow);
    unit.passes.push(summary);
    unit.currentPass = null;
    return summary;
  }

  /**
   * PRD 7.2: the low cull rate warning fires at the end of a completed pass, and
   * is unrelated to stopping early. A floor of 0 disables it.
   */
  function lowCullRate(summary, settings) {
    if (!settings.cullFloor) return false;
    return summary.cutPct < settings.cullFloor;
  }

  /**
   * PRD 7.1 handoff: for a fixed target, suggest moving to the bracket at roughly
   * 2 to 3 times the target. Uncapped units get no suggestion.
   */
  function bracketSuggestion(unit) {
    if (unit.target == null) return null;
    var lo = unit.target * 2, hi = unit.target * 3;
    if (unit.pool.length <= hi) {
      return {
        ready: true,
        message: unit.pool.length + ' left against a target of ' + unit.target +
                 '. That is small enough for a bracket.'
      };
    }
    return {
      ready: false,
      message: unit.pool.length + ' left. Another pass or two gets you toward ' + lo + '–' + hi + '.'
    };
  }

  /** The units still needing work, in a stable order. */
  function pendingUnits(session) {
    return Object.keys(session.units)
      .map(function (k) { return session.units[k]; })
      .filter(function (u) { return u.phase !== 'done'; });
  }

  function allUnitsDone(session) {
    var ks = Object.keys(session.units);
    return ks.length > 0 && ks.every(function (k) { return session.units[k].phase === 'done'; });
  }

  /** Union of every unit's winners — the field for the optional Stage D (PRD 7.6). */
  function allWinners(session) {
    var out = [];
    Object.keys(session.units).forEach(function (k) {
      session.units[k].winners.forEach(function (id) { if (out.indexOf(id) < 0) out.push(id); });
    });
    return out;
  }

  /**
   * What gets written to IndexedDB. Photo records are stripped of their Blobs;
   * derivatives live in their own store. PRD 7.10 needs decisions to survive even
   * when the evictable cache does not.
   */
  PT.serializeSession = function (state) {
    return state.session;
  };

  PT.session = {
    DEFAULTS: DEFAULTS,
    PHASES: PHASES,
    newSession: newSession,
    newUnit: newUnit,
    resolveQuota: resolveQuota,
    quotaLabel: quotaLabel,
    seededShuffle: seededShuffle,
    startPass: startPass,
    screenAt: screenAt,
    screensTotal: screensTotal,
    finishPass: finishPass,
    lowCullRate: lowCullRate,
    bracketSuggestion: bracketSuggestion,
    pendingUnits: pendingUnits,
    allUnitsDone: allUnitsDone,
    allWinners: allWinners
  };
})();

/** CHANGELOG
 * v1.0 (2026-07-28): Initial release. Settings defaults from PRD section 12,
 *   unit state, quota resolution, deterministic seeded shuffle so a resumed pass
 *   deals identically, pass lifecycle with locked configuration, low cull rate
 *   check, and bracket handoff suggestion.
 */

</script>
