/* ===== 40_screen_ingest.js ===== */
/**
 * @file 40_screen_ingest.js
 * @version 1.3
 * @author Samuel Cao
 * @created 2026-07-28
 * @lastUpdated 2026-07-28
 * @description PRD 7.9 ingest: folder entry by picker or drag, recursive scan, format triage, worker-pool derivative generation with progress, and cache reporting.
 * @aiUpdate Update @lastUpdated and @version. Append changelog at bottom.
 *
 * Registers two screens: 'welcome' (entry) and 'ingest' (scan + process).
 *
 * SIZING, from a real measured folder rather than the PRD's estimate: 746 stills
 * (601 JPEG, 137 HEIC, 3 PNG, 3 WebP, 2 GIF) alongside 175 video files. PRD 3
 * says "roughly 500 photos"; the real figure was 50% higher, and video — which
 * PRD 9 puts out of scope — accounted for 79% of the bytes. Both drive design
 * here: previews are capped at 1280px so the derivative cache stays near 190MB
 * rather than 400MB against a quota measured as low as 0.96GB, and video is a
 * named, counted category rather than an error.
 */

(function () {
  'use strict';

  var PT = (window.PT = window.PT || {});
  var el = PT.dom.el;

  /**
   * Runtime-only handle map, id -> File | FileSystemFileHandle. Never persisted:
   * File objects are not meaningfully revivable and handles are re-walked from
   * the stored directory handle on resume.
   */
  PT.sources = PT.sources || Object.create(null);

  var PREVIEW_PX = 1280;

  /** Nine cells with one marked. Purely decorative; drawn entirely in CSS. */
  function mark(live) {
    var cells = [];
    for (var i = 0; i < 9; i++) cells.push(el('i'));
    return el('div', { class: 'pt-mark' + (live ? ' pt-mark-live' : '') }, cells);
  }

  /* ------------------------------------------------------------- entry ---- */

  PT.router.register('welcome', {
    mount: function (root) {
      PT.dom.$('#topbar').hidden = true;

      root.appendChild(el('div', { class: 'card' }, [
        mark(false),
        el('h1', { text: 'Photournament' }),
        el('p', { class: 'muted', text:
          'Point it at a folder of photos. It cuts the field down with quota-enforced grid ' +
          'passes, then ranks what survives head to head.' })
      ]));

      // The webkitdirectory input is the workhorse. It preserves the folder tree,
      // works on every Chromium build and on a file:// origin, and needs no
      // permission grant. showDirectoryPicker is strictly an upgrade on top for
      // writing results back to disk — never a prerequisite for getting started.
      var dirInput = el('input', { type: 'file', id: 'dir-files', multiple: true, style: 'display:none' });
      dirInput.setAttribute('webkitdirectory', '');

      var looseInput = el('input', {
        type: 'file', id: 'loose-files', multiple: true, accept: 'image/*', style: 'display:none'
      });

      var drop = el('div', { class: 'dropzone', id: 'dropzone' }, [
        el('div', { class: 'dropzone-inner' }, [
          el('div', { class: 'drop-title', text: 'Drop a folder here' }),
          el('div', { class: 'muted small', text: 'or' }),
          el('button', { class: 'btn btn-primary', id: 'pick-folder', text: 'Choose a folder' }),
          el('div', { class: 'small dim', id: 'fallback-note' })
        ])
      ]);

      var extras = el('div', { class: 'row small' }, [
        dirInput, looseInput,
        el('button', {
          class: 'btn btn-quiet btn-sm', id: 'pick-files', text: 'Pick individual files instead',
          onclick: function () { looseInput.click(); }
        })
      ]);

      root.appendChild(drop);
      root.appendChild(extras);
      root.appendChild(el('div', { id: 'entry-msg' }));
      root.appendChild(el('div', { class: 'small dim', id: 'entry-diag', style: 'margin-top:14px' }));

      /**
       * One button that always works. It reaches for the File System Access API
       * first because that is what unlocks writing finalists back to disk, but
       * ANY failure other than the user cancelling falls straight through to the
       * directory input rather than dead-ending on an error message.
       */
      PT.dom.$('#pick-folder').addEventListener('click', function () {
        if (!PT.env.hasFSA || typeof window.showDirectoryPicker !== 'function') {
          dirInput.click();
          return;
        }
        var p;
        try {
          p = window.showDirectoryPicker({ mode: 'readwrite' });
        } catch (e) {
          fallbackToInput(e);
          return;
        }
        Promise.resolve(p)
          .then(function (handle) { beginFromHandle(handle); })
          .catch(function (e) {
            // A cancelled dialog is an ordinary outcome, not a failure.
            if (e && e.name === 'AbortError') return;
            fallbackToInput(e);
          });
      });

      function fallbackToInput(e) {
        var name = (e && e.name) || 'Error';
        var msg = (e && e.message) || String(e);
        PT.dom.clear(PT.dom.$('#entry-msg')).appendChild(
          el('div', { class: 'notice notice-warn small', html:
            '<b>This browser would not open its folder picker here (' + name + ').</b><br>' +
            'Opening the ordinary folder chooser instead. Everything works the same, except ' +
            'finalists have to be downloaded rather than written back into the folder.' +
            '<br><span class="dim">' + escapeHtml(msg) + '</span>' })
        );
        PT.env.fsaBlocked = true;
        renderDiag();
        dirInput.click();
      }

      looseInput.addEventListener('change', function (ev) {
        var files = Array.prototype.slice.call(ev.target.files || []);
        if (files.length) beginFromFiles(files);
      });

      dirInput.addEventListener('change', function (ev) {
        var files = Array.prototype.slice.call(ev.target.files || []);
        if (!files.length) return;
        // webkitRelativePath is "<chosen folder>/a/b/file.jpg", so the first
        // segment names the root the user picked.
        var first = files[0].webkitRelativePath || '';
        beginFromFiles(files, first.split('/')[0] || 'photos');
      });

      renderDiag();
      wireDragDrop(drop);

      /** Visible environment readout, so a failure here is diagnosable rather than mysterious. */
      function renderDiag() {
        var host = PT.dom.$('#entry-diag');
        if (!host) return;
        var bits = [
          'opened from ' + location.protocol.replace(':', ''),
          (PT.env.hasFSA ? 'folder picker available' : 'no folder picker in this browser'),
          (PT.env.fsaBlocked ? 'picker blocked here — using the fallback' : null),
          navigator.hardwareConcurrency ? navigator.hardwareConcurrency + ' cores' : null
        ].filter(Boolean);
        host.textContent = bits.join('  ·  ');
      }
    },

    unmount: function () {
      window.removeEventListener('dragover', swallow);
      window.removeEventListener('drop', swallow);
    }
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;';
    });
  }

  function swallow(e) { e.preventDefault(); }

  function wireDragDrop(drop) {
    // Without these, dropping anywhere navigates the tab to the dropped file.
    window.addEventListener('dragover', swallow);
    window.addEventListener('drop', swallow);

    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });

    drop.addEventListener('drop', function (e) {
      e.preventDefault();
      drop.classList.remove('over');

      // DataTransfer is only valid synchronously during the event, so everything
      // needed later has to be pulled out of it right now.
      var dt = e.dataTransfer;
      var items = Array.prototype.slice.call(dt.items || []);
      var files = Array.prototype.slice.call(dt.files || []);

      var handlePromises = items.map(function (it) {
        return typeof it.getAsFileSystemHandle === 'function'
          ? it.getAsFileSystemHandle().catch(function () { return null; })
          : Promise.resolve(null);
      });
      var entries = items.map(function (it) {
        return typeof it.webkitGetAsEntry === 'function' ? it.webkitGetAsEntry() : null;
      }).filter(Boolean);

      PT.dom.clear(PT.dom.$('#entry-msg'));

      Promise.all(handlePromises).then(function (handles) {
        var dir = handles.filter(Boolean).filter(function (h) { return h.kind === 'directory'; })[0];
        if (dir) return beginFromHandle(dir);

        // THE FALLBACK THAT MATTERS. When the File System Access API is missing
        // or blocked, dataTransfer.files is EMPTY for a dropped folder, so
        // falling back to it can never work — which is exactly why dropping a
        // folder appeared to do nothing. webkitGetAsEntry is the older Chrome
        // API that does expose a dropped directory.
        var dirEntry = entries.filter(function (en) { return en && en.isDirectory; })[0];
        if (dirEntry) {
          var out = [];
          return walkEntry(dirEntry, out, 0).then(function () {
            if (!out.length) {
              showEntryError(new Error('That folder had no readable files in it.'));
              return;
            }
            beginFromEntries(out, dirEntry.name || 'photos');
          });
        }

        if (files.length) return beginFromFiles(files);

        showEntryError(new Error(
          'Nothing readable was dropped. Use the "Choose a folder" button instead — some ' +
          'browsers will not hand a dropped folder to a page that was opened from a file.'
        ));
      }).catch(showEntryError);
    });
  }

  /**
   * Recursively reads a dropped directory through the legacy entry API.

   * empty batch, so it must be drained in a loop rather than called once. An
   * unreadable entry resolves rather than rejecting: one bad file must never
   * stall the whole import.
   */
  function walkEntry(entry, out, depth) {
    depth = depth || 0;
    if (!entry || depth > 32) return Promise.resolve(out);

    if (entry.isFile) {
      return new Promise(function (resolve) {
        entry.file(function (f) {
          var rel = String(entry.fullPath || ('/' + f.name)).replace(/^\//, '');
          var i = rel.lastIndexOf('/');
          out.push({ name: f.name, path: rel, dir: i < 0 ? '' : rel.slice(0, i), file: f });
          resolve(out);
        }, function () { resolve(out); });
      });
    }

    if (entry.isDirectory) {
      // Never re-ingest our own output on a second run.
      if (/^_(finalists|sidecars)/.test(entry.name) || entry.name.charAt(0) === '.') {
        return Promise.resolve(out);

      var kids = [];
      return new Promise(function (resolve) {
        (function drain() {
          reader.readEntries(function (batch) {
            if (!batch || !batch.length) {

              kids.forEach(function (k) {
                chain = chain.then(function () { return walkEntry(k, out, depth + 1); });

              chain.then(function () { resolve(out); });
              return;
            }

      var count = el('div', { class: 'ingest-count nums' });

    });

    return chain.then(function () {
      status.textContent = 'Saving…';
      var failed = records.filter(function (r) { return r.err; });

      PT.store.dispatch('ingest:done', function (s) {
        records.forEach(function (r) { s.photos[r.id] = r; });
        derivatives.forEach(function (d) { s.derivatives[d.id] = d; });

      });

      if (failed.length) {
        PT.bus.emit('toast', failed.length + ' file' + (failed.length === 1 ? '' : 's') +
          ' could not be read and will be left out.');
      }

      return PT.db.putAll('photos', records)
        .then(function () { return PT.db.putAll('derivatives', derivatives); })
        .then(function () { return PT.db.requestPersistence(); });
    });
  }

  /** PRD 8 mitigation: show cache size, and say something useful if it is large. */
  function reportCache(host) {
    return PT.db.usage().then(function (u) {
      if (!u.supported) return;
      var line = el('div', { class: 'small dim', style: 'margin-top:8px', text:
        'Cached thumbnails and previews: ' + PT.fmt.bytes(u.idb || u.usage) +
        (u.quota ? ' of ' + PT.fmt.bytes(u.quota) + ' available' : '') });
      host.appendChild(line);

      if (u.quota && (u.idb || u.usage) / u.quota > 0.6) {
        host.appendChild(el('div', { class: 'notice notice-warn small', style: 'margin-top:6px', text:
          'That is a large share of this browser profile’s storage. Everything cached here can be ' +

      }

 * @file 45_screen_dupes.js

 * @author Samuel Cao

 * @lastUpdated 2026-07-28

 * WHAT THIS SCREEN IS FOR

 * screen puts the grouping in front of the user before any culling happens, so
 * a bad group is fixed once rather than worked around later.

 * ---------------------------------------------------------------------------
 * THE THREE MEASURED FACTS THIS SCREEN IS BUILT AROUND
 * ---------------------------------------------------------------------------
 * All from tools/probes/04_phash/FINDINGS.md, re-verified in this build by
 * tests/dupes_e2e.mjs rather than taken on trust.
 *
 * 1. pHash IS A CONSTANT-WEIGHT CODE. Every value PT.phash.phash() returns has

 *    Odd thresholds are therefore dead stops: 15 behaves exactly like 14.

 *    recall 1.000 over 7,381 labelled pairs. `strict` is complete linkage: a

 *    slider means exactly what it says. `union` (single linkage) reaches the
 *    same scores at 14 but degrades catastrophically two steps later — at 20 it

 * WHICH HASH THIS SCREEN CLUSTERS ON, AND WHY IT RECOMPUTES ONE

 * the constant-weight property the step-by-2 slider depends on. Threshold 14 is
 * also the wrong number for a dHash (its clean band is 8..10; at 14 its

 *
 * ---------------------------------------------------------------------------
 * HOW MANUAL EDITS SURVIVE A THRESHOLD CHANGE
 * ---------------------------------------------------------------------------
 * This is the design decision the feature lives or dies on. A user splits a
 * group by hand, then nudges the slider, and every hand edit must still be
 * there afterwards.
 *
 * The rejected approach is to store the edited groups as RESULTS — a list of
 * lists. Re-clustering then has nothing to reconcile against: either it
 * overwrites the edit, or it refuses to touch edited groups and the slider
 * silently stops working on half the screen. Both are worse than not shipping
 * the slider.
 *
 * So manual edits are stored as CONSTRAINTS OVER PHOTO PAIRS, never as groups:
 *

 *     link["<idA>|<idB>"] = -1   cannot-link — the user split these apart

 * re-clustering, re-sorting or threshold dragging — which is exactly what a
 * result-shaped store cannot do.
 *
 * Two consequences worth stating plainly:
 *   - A pair can only hold one constraint, so the LAST edit to a pair wins.
 *     Splitting a group first clears the must-links among its members and vice
 *     versa, so "split then merge then split" behaves the way it reads.
 *   - Merges are applied after splits, so when a must-link and a cannot-link

    var s = sess();
    if (!s || !s.units) return [];
    return Object.keys(s.units).sort().filter(function (k) {
      return k !== 'stageD' && k !== s.stageDUnit;
    }).map(function (k) { return s.units[k]; });
  }

  /**
   * Every photo eligible for grouping. Excluded folders are absent by
   * construction — see the header.
   */
  function eligibleIds() {
    var out = [], seen = Object.create(null);
    unitsList().forEach(function (u) {
      (u.allIds || []).forEach(function (id) {
        if (seen[id]) return;
        var p = photo(id);
        if (!p || p.err) return;
        seen[id] = 1;
        out.push(id);
      });
    });
    return out;
  }

  function evenClamp(v) {
    v = Math.round(Number(v) || 0);
    if (v < RANGE[0]) v = RANGE[0];
    if (v > RANGE[1]) v = RANGE[1];
    // Snap onto the slider's own stops so a value restored from an older
    // session cannot sit on a dead odd number.
    return RANGE[0] + Math.round((v - RANGE[0]) / STEP) * STEP;
  }

  /** Create s.session.groups if this session has never had a review. */
  function ensureState() {
    var s = sess();
    if (!s) return null;
    if (!s.groups) {
      PT.store.dispatch('dupes:init', function (ss) {
        var set = ss.session.settings || {};
        ss.session.groups = {
          v: 1,
          threshold: evenClamp(set.dupeThreshold == null ? 14 : set.dupeThreshold),
          mode: set.dupeMode === 'union' ? 'union' : 'strict',
          status: 'new',            // new | review | done
          nextUnitId: null,
          link: {},                 // "<idA>|<idB>" -> +1 must-link | -1 cannot-link
          reps: {},                 // photoId -> 1, user-pinned representative
          removed: {},              // photoId -> 1, pulled out of grouping
          confirmed: {},            // groupKey -> 1
          groups: []                // materialised result, for Stage C and reload
        };
      });
    }
    return sess().groups;
  }

  /* ====================================================================== */
  /* hashes                                                                 */
  /* ====================================================================== */

  /** id -> {hash, sharp, exact}. `exact` false means the ingest hash was used. */
  var HASH = Object.create(null);

  function blobFor(id) {
    var s = st();
    var d = s && s.derivatives ? s.derivatives[id] : null;
    return d ? (d.thumb || d.preview || null) : null;
  }

  function imageDataOf(blob) {
    return createImageBitmap(blob).then(function (bm) {
      var w = bm.width, h = bm.height;
      var c = (typeof OffscreenCanvas === 'function')
        ? new OffscreenCanvas(w, h)
        : (function () { var x = document.createElement('canvas'); x.width = w; x.height = h; return x; })();
      var cx = c.getContext('2d', { willReadFrequently: true });
      cx.drawImage(bm, 0, 0);
      bm.close();
      var data = cx.getImageData(0, 0, w, h);
      c.width = 0; c.height = 0;      // drop the backing store now, not at GC
      return data;
    });
  }

  /**
   * Fill HASH for every id, deriving a real pHash from the cached thumbnail
   * where the photo record does not already carry one. Sequential on purpose:
   * a parallel map over 500 blobs puts 500 decoded bitmaps in flight, which is
   * the bounded-memory rule this project is built around.
   */
  function prepare(ids, onProgress) {
    var pending = [];
    var fresh = [];

    ids.forEach(function (id) {
      var p = photo(id);
      if (!p) return;
      if (typeof p.ptPhash === 'string' && p.ptPhash.length === HASH_LEN) {
        HASH[id] = { hash: p.ptPhash, sharp: p.ptSharp, exact: true };
        return;
      }
      if (HASH[id]) return;
      pending.push(id);
    });

    var done = 0;
    var total = pending.length;
    if (onProgress) onProgress(0, total);

    var chain = Promise.resolve();
    pending.forEach(function (id) {
      chain = chain.then(function () {
        var blob = blobFor(id);
        var p = photo(id);
        if (!blob) {
          // Evicted cache. The ingest hash is a different family, so grouping
          // stays possible but the screen has to admit it is mixing them.
          if (p && typeof p.phash === 'string' && p.phash.length === HASH_LEN) {
            HASH[id] = { hash: p.phash, sharp: p.sharp, exact: false };
          }
          done++;
          if (onProgress && done % 8 === 0) onProgress(done, total);
          return null;
        }
        return imageDataOf(blob).then(function (img) {
          HASH[id] = {
            hash: PT.phash.phash(img),
            sharp: PT.phash.sharpness(img),
            exact: true
          };
          fresh.push(id);
        }).catch(function (e) {
          PT.warn('dupes', 'hash failed for ' + id, e);
          if (p && typeof p.phash === 'string' && p.phash.length === HASH_LEN) {
            HASH[id] = { hash: p.phash, sharp: p.sharp, exact: false };
          }
        }).then(function () {
          done++;
          if (onProgress && done % 8 === 0) onProgress(done, total);
        });
      });
    });

    return chain.then(function () {
      if (onProgress) onProgress(total, total);
      if (!fresh.length) return null;

      // Cache onto the photo records. These are derived and re-derivable, so
      // they belong with the photo rather than in the session snapshot; writing
      // them back to the photos store is what makes a reload cheap.
      PT.store.dispatch('dupes:hashes', function (s) {
        fresh.forEach(function (id) {
          var rec = s.photos[id];
          if (!rec) return;
          rec.ptPhash = HASH[id].hash;
          rec.ptSharp = HASH[id].sharp;
        });
      }, { transient: true, silent: true });

      var s = st();
      var recs = fresh.map(function (id) { return s.photos[id]; }).filter(Boolean);
      return PT.db.putAll('photos', recs).catch(function (e) {
        PT.warn('dupes', 'could not cache hashes', e);
      });
    });
  }

  function metaOf(id) {
    var p = photo(id) || {};
    var h = HASH[id];
    return {
      id: id,
      w: p.w,
      h: p.h,
      sharp: h && h.sharp != null ? h.sharp : p.sharp
    };
  }

  function anyFallback(ids) {
    for (var i = 0; i < ids.length; i++) {
      if (HASH[ids[i]] && !HASH[ids[i]].exact) return true;
    }
    return false;
  }

  /* ====================================================================== */
  /* constraints and clustering                                             */
  /* ====================================================================== */

  function byId(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }
  function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

  /** Partition one auto group so no cannot-link pair shares a bucket. */
  function splitByCantLink(ids, link) {
    var buckets = [];
    ids.forEach(function (id) {
      for (var i = 0; i < buckets.length; i++) {
        var ok = true;
        for (var j = 0; j < buckets[i].length; j++) {
          if (link[pairKey(id, buckets[i][j])] === -1) { ok = false; break; }
        }
        if (ok) { buckets[i].push(id); return; }
      }
      buckets.push([id]);
    });
    return buckets;
  }

  /** Union any groups joined by a must-link. Applied after splits; see header. */
  function mergeByMustLink(groups, link) {
    var where = Object.create(null);
    groups.forEach(function (g, i) { g.forEach(function (id) { where[id] = i; }); });

    var parent = groups.map(function (_, i) { return i; });
    function find(a) { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; }

    Object.keys(link).forEach(function (k) {
      if (link[k] !== 1) return;
      var ab = k.split('|');
      var a = where[ab[0]], b = where[ab[1]];
      if (a === undefined || b === undefined) return;
      var ra = find(a), rb = find(b);
      if (ra !== rb) parent[rb] = ra;
    });

    var bucket = Object.create(null), order = [];
    groups.forEach(function (g, i) {
      var r = find(i);
      if (!bucket[r]) { bucket[r] = []; order.push(r); }
      bucket[r] = bucket[r].concat(g);
    });
    return order.map(function (r) { return bucket[r].slice().sort(byId); });
  }

  function repOf(ids, g) {
    var pinned = ids.filter(function (id) { return g.reps[id]; }).sort(byId);
    if (pinned.length) return pinned[0];
    try { return PT.phash.nominate(ids.map(metaOf)); }
    catch (e) { return ids[0]; }
  }

  /** Widest distance inside a group. Under strict it can never exceed the slider. */
  function diameterOf(ids) {
    var d = 0;
    for (var i = 0; i < ids.length; i++) {
      for (var j = i + 1; j < ids.length; j++) {
        var a = HASH[ids[i]], b = HASH[ids[j]];
        if (!a || !b) continue;
        try { d = Math.max(d, PT.phash.hamming(a.hash, b.hash)); } catch (e) { /* mixed families */ }
      }
    }
    return d;
  }

  function groupKey(ids) { return ids[0]; }

  function isManual(ids, link) {
    for (var i = 0; i < ids.length; i++) {
      for (var j = i + 1; j < ids.length; j++) {
        if (link[pairKey(ids[i], ids[j])]) return true;
      }
    }
    return false;
  }

  /**
   * Cluster fresh, then replay the manual constraints. Clustering is per unit:
   * a duplicate that spans two tournaments is not something the user can act on,
   * and Stage C consumes groups per unit anyway.
   */
  function computeGroups() {
    var g = sess().groups;
    var out = [];

    unitsList().forEach(function (u) {
      var items = [];
      (u.allIds || []).forEach(function (id) {
        if (g.removed[id]) return;
        var h = HASH[id];
        if (!h || typeof h.hash !== 'string' || h.hash.length !== HASH_LEN) return;
        var p = photo(id) || {};
        items.push({ id: id, hash: h.hash, w: p.w, h: p.h, sharp: h.sharp });
      });
      if (items.length < 2) return;

      var auto;
      try {
        auto = PT.phash.cluster(items, { threshold: g.threshold, mode: g.mode });
      } catch (e) {
        PT.warn('dupes', 'cluster failed for ' + u.id, e);
        return;
      }

      var parts = [];
      auto.forEach(function (grp) {
        splitByCantLink(grp, g.link).forEach(function (b) { parts.push(b); });
      });

      mergeByMustLink(parts, g.link).forEach(function (ids) {
        if (ids.length < 2) return;                 // singletons are not a group
        out.push({
          unitId: u.id,
          unitLabel: u.label,
          ids: ids,
          rep: repOf(ids, g),
          manual: isManual(ids, g.link),
          confirmed: !!g.confirmed[groupKey(ids)],
          diameter: diameterOf(ids)
        });
      });
    });

    return out;
  }

  /**
   * Recompute and persist. Writes the materialised result into
   * s.session.groups.groups AND into each unit's `groups` field, which is what
   * Stage C reads (70_screen_bracket.js runoffGroups).
   */
  function recompute() {
    var groups = computeGroups();
    PT.store.dispatch('dupes:regroup', function (s) {
      s.session.groups.groups = groups.map(function (gr) {
        return {
          unitId: gr.unitId, ids: gr.ids.slice(), rep: gr.rep,
          manual: gr.manual, confirmed: gr.confirmed
        };
      });
      var byUnit = Object.create(null);
      groups.forEach(function (gr) {
        (byUnit[gr.unitId] || (byUnit[gr.unitId] = [])).push({ ids: gr.ids.slice(), rep: gr.rep });
      });
      Object.keys(s.session.units).forEach(function (k) {
        if (k === 'stageD' || k === s.session.stageDUnit) return;
        s.session.units[k].groups = byUnit[k] || null;
      });
    });
    return groups;
  }

  /* ====================================================================== */
  /* edits                                                                  */
  /* ====================================================================== */

  /** Drop every constraint between the given ids, so a new edit is authoritative. */
  function clearLinksAmong(link, ids) {
    for (var i = 0; i < ids.length; i++) {
      for (var j = i + 1; j < ids.length; j++) delete link[pairKey(ids[i], ids[j])];
    }
  }

  function edit(name, fn) {
    PT.store.dispatch(name, function (s) { fn(s.session.groups, s); });
    paintList();
  }

  /* ====================================================================== */
  /* screen                                                                 */
  /* ====================================================================== */

  var D = null;   // live screen state, null when unmounted

  function counts(groups) {
    var photos = 0;
    groups.forEach(function (g) { photos += g.ids.length; });
    return { groups: groups.length, photos: photos };
  }

  function setImgFor(img, id) {
    var b = blobFor(id);
    if (b) { PT.dom.setImg(img, b); return; }
    PT.db.get('derivatives', id).then(function (rec) {
      // The screen may have been unmounted while this was in flight.
      if (!D || !img.isConnected) return;
      if (rec && (rec.thumb || rec.preview)) PT.dom.setImg(img, rec.thumb || rec.preview);
    }).catch(function () { /* no thumbnail; the cell stays an empty well */ });
  }

  function mount(root, params) {
    var s = sess();
    PT.dom.$('#topbar').hidden = false;
    PT.dom.$('#topbar-context').textContent = (s && s.rootName ? s.rootName + ' · ' : '') + 'near-duplicates';

    if (!s || !s.units || !Object.keys(s.units).length) {
      root.appendChild(el('div', { class: 'error-box', text: 'No tournaments to group yet.' }));
      return;
    }

    ensureState();
    D = { root: root, sel: Object.create(null), groups: [], busy: true };

    if (params && params.unitId) {
      PT.store.dispatch('dupes:enter', function (ss) {
        ss.session.groups.status = 'review';
        ss.session.groups.nextUnitId = params.unitId;
      });
    }

    root.appendChild(el('h1', { text: 'Photos that look like duplicates' }));

    D.status = el('div', { class: 'notice notice-note', id: 'dupe-status',
      text: 'Looking for near-duplicates…' });
    root.appendChild(D.status);

    D.toolbar = el('div', { class: 'card', id: 'dupe-toolbar' });
    root.appendChild(D.toolbar);

    D.list = el('div', { class: 'bk-results dupe-list', id: 'dupe-list' });
    root.appendChild(D.list);

    D.footer = el('div', { class: 'card row', id: 'dupe-footer' });
    root.appendChild(D.footer);

    var ids = eligibleIds();
    prepare(ids, function (done, total) {
      if (!D || !total) return;
      D.status.textContent = 'Reading ' + done + ' of ' + total + ' photos…';
    }).then(function () {
      if (!D) return;
      D.busy = false;
      D.fallback = anyFallback(ids);
      buildToolbar();
      buildFooter();
      paintList();
    }).catch(function (e) {
      PT.warn('dupes', 'preparation failed', e);
      if (!D) return;
      D.busy = false;
      D.status.className = 'notice notice-error';
      D.status.textContent = 'Could not read the thumbnails to compare photos: ' + e.message;
      buildFooter();
    });
  }

  /**
   * Built ONCE and then updated in place. Re-creating the slider on every input
   * event would replace the element mid-drag and the drag would die on the
   * first step — the same class of bug the tree screen hit with focus and the
   * caret.
   */
  function buildToolbar() {
    var g = sess().groups;
    PT.dom.clear(D.toolbar);

    D.slider = el('input', {
      type: 'range', id: 'dupe-threshold',
      min: String(RANGE[0]), max: String(RANGE[1]), step: String(STEP),
      class: 'dupe-range',
      title: 'How different two photos may be and still count as duplicates, in bits'
    });
    D.slider.value = String(g.threshold);
    D.slider.addEventListener('input', function () {
      var v = evenClamp(D.slider.value);
      PT.store.dispatch('dupes:threshold', function (s) {
        s.session.groups.threshold = v;
        s.session.settings.dupeThreshold = v;
      });
      // Measured at 0.4 ms for 500 items, so there is no debounce here on
      // purpose. Anything slower than immediate would be a downgrade.
      paintList();
    });

    D.readout = el('b', { class: 'nums', id: 'dupe-readout', text: String(g.threshold) });

    D.mode = el('select', { id: 'dupe-mode', class: 'dupe-mode',
      title: 'strict: every photo in a group is within the distance of every other. ' +
             'union: one close pair is enough to join two groups.' });
    [['strict', 'strict — tighter groups'], ['union', 'union — looser groups']].forEach(function (o) {
      var opt = el('option', { value: o[0], text: o[1] });
      if (g.mode === o[0]) opt.selected = true;
      D.mode.appendChild(opt);
    });
    D.mode.addEventListener('change', function () {
      var v = D.mode.value === 'union' ? 'union' : 'strict';
      PT.store.dispatch('dupes:mode', function (s) {
        s.session.groups.mode = v;
        s.session.settings.dupeMode = v;
      });
      paintList();
    });

    D.count = el('span', { class: 'small dim nums', id: 'dupe-count' });

    D.toolbar.appendChild(el('div', { class: 'row' }, [
      el('label', { class: 'small muted', for: 'dupe-threshold', text: 'Sensitivity' }),
      D.slider,
      el('span', { class: 'small' }, [D.readout, el('span', { class: 'dim', text: ' bits apart' })]),
      D.mode,
      el('span', { class: 'spacer' }),
      D.count
    ]));

    // The one thing about this control a user could not possibly guess.
    D.toolbar.appendChild(el('div', { class: 'small dim', id: 'dupe-stephint', text:
      'Moves in steps of 2. Every perceptual-hash distance is an even number, so the odd ' +
      'values in between would do nothing at all.' }));

    D.actions = el('div', { class: 'row', id: 'dupe-actions', style: 'margin-top:10px' });
    D.toolbar.appendChild(D.actions);
  }

  function buildFooter() {
    PT.dom.clear(D.footer);
    D.footer.appendChild(el('span', { class: 'small dim', text:
      'Nothing here throws a photo away. Groups only decide what gets compared side by side later.' }));
    D.footer.appendChild(el('span', { class: 'spacer' }));
    D.footer.appendChild(el('button', {
      class: 'btn btn-quiet', id: 'dupe-skip', text: 'Skip this step',
      title: 'Use the automatic grouping as it stands and start culling',
      onclick: function () { finish('dupes:skip'); }
    }));
    D.footer.appendChild(el('button', {
      class: 'btn btn-primary', id: 'dupe-continue', text: 'Looks right — start culling →',
      onclick: function () { finish('dupes:confirm'); }
    }));
  }

  function finish(action) {
    if (!D) return;
    var next = sess().groups.nextUnitId;
    PT.store.dispatch(action, function (s) { s.session.groups.status = 'done'; });
    var s = sess();
    if (!next || !s.units[next] || s.units[next].phase === 'done') {
      var pending = PT.session.pendingUnits(s);
      next = pending.length ? pending[0].id : null;
    }
    if (next) {
      PT.store.dispatch('dupes:next', function (ss) { ss.session.activeUnitId = next; });
      PT.router.go('grid', { unitId: next });
    } else if (typeof PT.advance === 'function') {
      PT.advance();
    } else {
      PT.router.go('tree');
    }
  }

  /* ------------------------------------------------------------ selection */

  function selected() { return Object.keys(D.sel); }

  function spannedGroups() {
    var hit = [];
    D.groups.forEach(function (gr) {
      if (gr.ids.some(function (id) { return D.sel[id]; })) hit.push(gr);
    });
    return hit;
  }

  function paintActions() {
    var sel = selected();
    var span = spannedGroups();
    PT.dom.clear(D.actions);

    if (!sel.length) {
      D.actions.appendChild(el('span', { class: 'small dim', text:
        'Click a photo to make it the one you keep. Tick photos to split, merge or remove them.' }));
      return;
    }

    D.actions.appendChild(el('span', { class: 'small muted nums',
      text: sel.length + ' selected in ' + span.length + ' group' + (span.length === 1 ? '' : 's') }));

    var canMerge = span.length >= 2;
    var one = span.length === 1 ? span[0] : null;
    var canSplit = !!one && sel.length < one.ids.length;

    D.actions.appendChild(el('button', {
      class: 'btn btn-sm', id: 'dupe-merge', text: 'Merge into one group',
      disabled: !canMerge,
      title: canMerge ? 'Treat these groups as one' : 'Tick photos in two or more groups first',
      onclick: function () {
        // Merge by linking one anchor per group rather than every pair: the
        // minimum constraint that joins them, so a later split of an individual
        // member is not fighting a wall of must-links.
        var anchors = span.map(function (gr) {
          var s = gr.ids.filter(function (id) { return D.sel[id]; });
          return (s.length ? s : gr.ids)[0];
        });
        var all = [];
        span.forEach(function (gr) { all = all.concat(gr.ids); });
        // Clear the selection BEFORE the edit: edit() repaints, and a repaint
        // that still sees the old selection leaves ticked boxes behind on
        // groups that no longer exist.
        D.sel = Object.create(null);
        edit('dupes:merge', function (g) {
          clearLinksAmong(g.link, all);
          for (var i = 1; i < anchors.length; i++) g.link[pairKey(anchors[0], anchors[i])] = 1;
          span.forEach(function (gr) { delete g.confirmed[groupKey(gr.ids)]; });
        });
      }
    }));

    D.actions.appendChild(el('button', {
      class: 'btn btn-sm', id: 'dupe-split', text: 'Split off selected',
      disabled: !canSplit,
      title: canSplit ? 'Move these into a group of their own'
                      : 'Tick some but not all of one group first',
      onclick: function () {
        var picked = one.ids.filter(function (id) { return D.sel[id]; });
        var rest = one.ids.filter(function (id) { return !D.sel[id]; });
        D.sel = Object.create(null);
        edit('dupes:split', function (g) {
          clearLinksAmong(g.link, one.ids);
          picked.forEach(function (a) {
            rest.forEach(function (b) { g.link[pairKey(a, b)] = -1; });
          });
          delete g.confirmed[groupKey(one.ids)];
        });
      }
    }));

    D.actions.appendChild(el('button', {
      class: 'btn btn-sm btn-danger', id: 'dupe-remove', text: 'Remove from grouping',
      title: 'These are not duplicates of anything. They stay in the tournament.',
      onclick: function () {
        D.sel = Object.create(null);
        edit('dupes:remove', function (g) { sel.forEach(function (id) { g.removed[id] = 1; }); });
      }
    }));

    D.actions.appendChild(el('button', {
      class: 'btn btn-sm btn-quiet', id: 'dupe-clear', text: 'Clear selection',
      onclick: function () { D.sel = Object.create(null); paintList(); }
    }));
  }

  /* -------------------------------------------------------------- painting */

  function paintList() {
    if (!D || D.busy) return;

    var t0 = (window.performance && performance.now) ? performance.now() : 0;
    D.groups = recompute();
    var g = sess().groups;
    var c = counts(D.groups);

    if (D.readout) D.readout.textContent = String(g.threshold);
    if (D.slider && D.slider.value !== String(g.threshold)) D.slider.value = String(g.threshold);
    if (D.count) {
      D.count.textContent = c.groups
        ? c.groups + ' group' + (c.groups === 1 ? '' : 's') + ' · ' + c.photos + ' photos'
        : 'no groups at this setting';
    }

    var removedCount = Object.keys(g.removed).length;
    D.status.className = 'notice notice-note';
    if (!c.groups) {
      D.status.textContent = 'Nothing looks like a duplicate at ' + g.threshold +
        ' bits. Drag the slider right to group more loosely, or start culling.';
    } else if (D.fallback) {
      D.status.className = 'notice notice-warn';
      D.status.textContent = 'Some thumbnails were cleared by the browser, so a few photos ' +
        'are compared with the coarser hash recorded at import. Grouping still works, but ' +
        'those photos may group less accurately.';
    } else {
      D.status.textContent = c.photos + ' of these photos look like near-duplicates of ' +
        'something else, in ' + c.groups + ' group' + (c.groups === 1 ? '' : 's') +
        '. The one on a white mount is the one that carries the group forward; click another ' +
        'to change it. The rest stay attached, so you can still choose between them later.' +
        (removedCount ? ' ' + removedCount + ' photo' + (removedCount === 1 ? '' : 's') +
          ' removed from grouping by hand.' : '');
    }

    PT.dom.$$('img', D.list).forEach(function (img) { PT.dom.releaseImg(img); });
    PT.dom.clear(D.list);
    D.groups.forEach(function (gr) { D.list.appendChild(groupEl(gr, g)); });

    if (!D.groups.length && removedCount) {
      D.list.appendChild(el('div', { class: 'notice notice-note', id: 'dupe-empty' }, [
        el('span', { text: 'Every group has been taken apart or removed. ' }),
        el('button', {
          class: 'btn btn-sm btn-quiet', id: 'dupe-reset', text: 'Undo all my edits',
          onclick: function () {
            edit('dupes:reset', function (gg) {
              gg.link = {}; gg.reps = {}; gg.removed = {}; gg.confirmed = {};
            });
          }
        })
      ]));
    }

    paintActions();

    if (t0) PT.log('dupes', 'regrouped at', g.threshold, g.mode, 'in',
      (performance.now() - t0).toFixed(1) + 'ms', c.groups + ' groups');
  }

  function groupEl(gr, g) {
    var key = groupKey(gr.ids);
    var wrap = el('div', {
      class: 'ro-group dupe-group' + (gr.confirmed ? ' confirmed' : ''),
      dataset: { group: key, unit: gr.unitId, size: String(gr.ids.length) }
    });

    var repImg = el('img', { alt: '', class: 'dupe-rep-thumb' });
    setImgFor(repImg, gr.rep);

    var facts = gr.ids.length + ' photos · up to ' + gr.diameter + ' bits apart';
    if (gr.unitLabel) facts += ' · ' + gr.unitLabel;
    if (gr.manual) facts += ' · edited by hand';

    wrap.appendChild(el('div', { class: 'ro-head' }, [
      repImg,
      el('span', { class: 'bk-name' }, [
        el('div', { class: 'dupe-rep-name', text: nameOf(gr.rep) }),
        el('div', { class: 'small dim', text: facts })
      ]),
      el('button', {
        class: 'btn btn-sm' + (gr.confirmed ? ' btn-primary' : ''),
        dataset: { confirm: key },
        text: gr.confirmed ? 'Confirmed' : 'Confirm',
        title: gr.confirmed
          ? 'Pinned together. Click to unpin.'
          : 'Pin these together so moving the slider cannot take them apart',
        onclick: function () {
          edit('dupes:confirm-group', function (gg) {
            if (gg.confirmed[key]) {
              delete gg.confirmed[key];
              clearLinksAmong(gg.link, gr.ids);
            } else {
              gg.confirmed[key] = 1;
              // Confirming is what makes a group immune to the slider: it
              // writes the must-links, it does not just draw a tick.
              for (var i = 1; i < gr.ids.length; i++) {
                gg.link[pairKey(gr.ids[0], gr.ids[i])] = 1;
              }
            }
          });
        }
      }),
      el('button', {
        class: 'btn btn-sm btn-quiet', dataset: { splitall: key }, text: 'Split all apart',
        title: 'These are not duplicates of each other at all',
        onclick: function () {
          edit('dupes:split-all', function (gg) {
            clearLinksAmong(gg.link, gr.ids);
            for (var i = 0; i < gr.ids.length; i++) {
              for (var j = i + 1; j < gr.ids.length; j++) {
                gg.link[pairKey(gr.ids[i], gr.ids[j])] = -1;
              }
            }
            delete gg.confirmed[key];
          });
        }
      })
    ]));

    // A fixed track rather than the grid pass's grid-6/9/12/16: those size a
    // screen to fill a viewport, and this screen is a scrollable list where a
    // three-member group must not eat the whole window. Members stay a constant
    // size whatever the group holds, so groups are comparable down the page.
    var grid = el('div', { class: 'grid dupe-grid' });

    gr.ids.forEach(function (id) {
      var isRep = id === gr.rep;
      var cell = el('div', {
        class: 'photo-cell ro-cell dupe-cell' + (isRep ? ' kept' : '') + (D.sel[id] ? ' picked' : ''),
        dataset: { member: id, group: key },
        title: nameOf(id) + (isRep ? ' — kept as this group’s representative' : ' — click to keep this one instead'),
        onclick: function (ev) {
          if (ev.target && ev.target.classList && ev.target.classList.contains('dupe-pick')) return;
          // PRD 7.7: one click overrides the nomination. Everything else in the
          // group stays exactly where it is, ready for the Stage C runoff.
          edit('dupes:representative', function (gg) {
            gr.ids.forEach(function (m) { delete gg.reps[m]; });
            gg.reps[id] = 1;
          });
        }
      });

      var img = el('img', { class: 'thumb', alt: '' });
      cell.appendChild(img);

      var pick = el('input', { type: 'checkbox', class: 'dupe-pick', dataset: { pick: id },
        title: 'Select for split, merge or remove' });
      pick.checked = !!D.sel[id];
      pick.addEventListener('change', function () {
        if (pick.checked) D.sel[id] = 1; else delete D.sel[id];
        cell.classList.toggle('picked', pick.checked);
        paintActions();
      });
      cell.appendChild(pick);

      var tags = [];
      if (isRep) tags.push(sess().groups.reps[id] ? 'your pick' : 'sharpest');
      if (tags.length) cell.appendChild(el('span', { class: 'tag', text: tags.join(' · ') }));

      grid.appendChild(cell);
      setImgFor(img, id);
    });

    wrap.appendChild(el('div', { class: 'ro-body' }, [grid]));
    return wrap;
  }

  function unmount(root) {
    PT.dom.$$('img', root).forEach(function (img) { PT.dom.releaseImg(img); });
    var c = PT.dom.$('#topbar-counters');
    if (c) c.textContent = '';
    D = null;
  }

  PT.router.register('dupes', { mount: mount, unmount: unmount });

  /* ====================================================================== */
  /* entry point used by the tree screen                                    */
  /* ====================================================================== */

  /**
   * Does this session have anything worth reviewing? Synchronous, over the
   * hashes already in the store. See gateDistance() for why the gate is a
   * different, higher-precision test than the grouping itself.
   */
  function hasCandidates() {
    var found = false;
    unitsList().forEach(function (u) {
      if (found) return;
      var items = [];
      (u.allIds || []).forEach(function (id) {
        var p = photo(id);
        if (!p || p.err) return;
        // Deliberately the INGEST hash and only the ingest hash, which is now
        // the same pHash family the threshold was calibrated against.
        if (typeof p.phash === 'string' && p.phash.length === HASH_LEN) {
          items.push({ id: id, hash: p.phash });
        }
      });
      if (items.length < 2) return;
      try {
        found = PT.phash.cluster(items, { threshold: gateDistance(), mode: 'strict' })
          .some(function (grp) { return grp.length > 1; });
      } catch (e) { /* a malformed hash is not a reason to block the flow */ }
    });
    return found;
  }

  /**
   * Called from 50_screen_tree.js once the units exist. Routes into the review
   * only when there is something to review; otherwise the session goes straight
   * to the first grid pass exactly as it did before this screen existed.
   */
  function route(unitId) {
    var toGrid = function () {
      if (unitId) PT.router.go('grid', { unitId: unitId });
    };
    var s = sess();
    if (!s || !s.units || !Object.keys(s.units).length) return toGrid();

    var resuming = s.groups && s.groups.status === 'review';
    if (s.groups && s.groups.status === 'done') return toGrid();
    if (!resuming && !hasCandidates()) return toGrid();

    ensureState();
    PT.router.go('dupes', { unitId: unitId });
  }

  PT.dupes = {
    route: route,
    hasCandidates: hasCandidates,
    /** Open the review on demand — useful from the console and for tests. */
    open: function () {
      var s = sess();
      ensureState();
      var pending = s ? PT.session.pendingUnits(s) : [];
      PT.router.go('dupes', { unitId: pending.length ? pending[0].id : (s && s.activeUnitId) || null });
    },
    gateDistance: gateDistance,
    STEP: STEP,
    _internal: {
      computeGroups: computeGroups,
      splitByCantLink: splitByCantLink,
      mergeByMustLink: mergeByMustLink,
      pairKey: pairKey,
      evenClamp: evenClamp,
      hashes: function () { return HASH; }
    }
  };

  PT.log('dupes', 'screen registered');
})();

/** CHANGELOG
 * v1.0 (2026-07-28): Initial release. PRD 7.7 near-duplicate review: live
 *   sensitivity slider stepping by 2 with no debounce, per-unit clustering,
 *   scrollable review of every group with all members, manual split / merge /
 *   remove / confirm stored as PAIRWISE CONSTRAINTS rather than as results so
 *   hand edits survive any threshold change, one-click representative override
 *   with the rest of the group left attached for Stage C, and results written to
 *   both s.session.groups and each unit's `groups` field.
 *
 *   Also: the screen derives its own pHash from the cached thumbnails. The
 *   `phash` field written at ingest is the worker's inlined dHash — measured
 *   over the E2E corpus as 527 of 1,128 pairwise distances ODD and one-bit
 *   weights spread over 25..37 — so the constant-weight property the step-by-2
 *   slider depends on does not hold for it, and threshold 14 is calibrated for
 *   the wrong hash family. The derived hashes are cached back onto the photo
 *   records as ptPhash / ptSharp.
 */

</script>
<script>
/* ===== 50_screen_tree.js ===== */
/**
 * @file 50_screen_tree.js
 * @version 1.3
 * @author Samuel Cao
 * @created 2026-07-28
 * @lastUpdated 2026-07-28
 * @description PRD 4 allocation tree UI: four states per node, both math directions, live totals, weighted distribution, and the section 4.5 conflict, clamp and dead-state messages.
 * @aiUpdate Update @lastUpdated and @version. Append changelog at bottom.
 *
 * All the arithmetic lives in 30_tree.js, which is pure and unit-tested. This
 * file is only the surface over it: render, capture input, re-resolve, re-render.
 * Every keystroke re-resolves the whole tree, which at a few hundred nodes is far
 * cheaper than maintaining incremental state and getting it subtly wrong.
 */

(function () {
  'use strict';

  var PT = (window.PT = window.PT || {});
  var el = PT.dom.el;



  PT.router.register('tree', {
    mount: function (root) {
      var st = PT.store.get();
      PT.dom.$('#topbar').hidden = false;
      PT.dom.$('#topbar-context').textContent = st.session.rootName;

      if (!st.tree) {
        root.appendChild(el('div', { class: 'error-box', text: 'No photos loaded yet.' }));
        return;
      }

      root.appendChild(el('div', { class: 'row' }, [
        el('h1', { text: 'How many photos do you want to KEEP from each folder?' })
      ]));

      root.classList.add('screen-tree');

      root.appendChild(el('div', { class: 'tree-help', html:
        'The number is how many photos <b>survive</b> — the keepers, not the ones thrown away. ' +
        'Type <b>5</b> and you end up with 5 photos from that folder.' }));

      var help = el('details', { class: 'tree-help' }, [
        el('summary', { text: 'Blank, zero and no-limit' }),
        el('div', { html:
          'Use <b>0</b> to skip a folder entirely, <b>*</b> (or the ∞ button) to cull with no fixed ' +
          'target, or leave it blank to let a folder compete with its blank siblings for whatever ' +
          'its parent has left over.' })
      ]);
      root.appendChild(help);

      var treeHost = el('div', { class: 'card', id: 'tree-host' });
      var issuesHost = el('div', { class: 'tree-issues', id: 'tree-issues' });
      var footer = el('div', { class: 'card row', id: 'tree-footer' });

      root.appendChild(treeHost);
      root.appendChild(issuesHost);
      root.appendChild(footer);

      render();

      function render() {
        var s = PT.store.get();
        var res = PT.tree.resolve(s.tree, s.session.allocs);
        s.resolution = res;

        // Re-rendering destroys and recreates every input, which silently steals
        // focus and the caret from whichever field is being typed into. The
        // symptom is that only the first digit of a two-digit number ever lands.
        // Remember where the cursor was and put it back afterwards.
        var active = document.activeElement;
        var focusPath = active && active.classList && active.classList.contains('tree-alloc')
          ? active.dataset.path : null;
        var caret = focusPath ? active.selectionStart : null;

        PT.dom.clear(treeHost);
        treeHost.appendChild(headerRow());
        s.tree.order.forEach(function (path) {
          var node = res.nodes[path];
          if (!node) return;
          // A root wrapper with a single child adds a level of indent and no
          // information; skip it unless it holds photos of its own.
          if (path === '' && s.tree.nodes[''].childPaths.length === 1 && !node.ownCount) return;
          treeHost.appendChild(rowFor(s, res, path, node));
        });

        renderIssues(res);
        renderFooter(res);

        if (focusPath !== null) {
          var again = treeHost.querySelector('.tree-alloc[data-path="' + cssEscape(focusPath) + '"]');
          if (again) {
            again.focus();
            try { again.setSelectionRange(caret, caret); } catch (e) { /* not a text input */ }
          }
        }
      }

      function cssEscape(s) { return String(s).replace(/(["\\])/g, '\\$1'); }

      function headerRow() {
        // Must mirror rowFor()'s child order exactly or the columns drift.
        return el('div', { class: 'tree-row tree-head' }, [
          el('span', { class: 'tree-name', text: 'Folder' }),
          el('span', { class: 'tree-count', text: 'has' }),
          el('span', { class: 'tree-alloc', text: 'keep' }),
          el('span', {}), el('span', {}), el('span', {}), el('span', {})
        ]);
      }

      function rowFor(s, res, path, node) {
        var depth = path === '' ? 0 : path.split('/').length;
        var hasError = res.issues.some(function (i) { return i.path === path && i.level === 'error'; });

        var input = el('input', {
          type: 'text',
          inputmode: 'numeric',
          maxlength: '4',
          class: 'tree-alloc' + (hasError ? ' invalid' : ''),
          value: PT.tree.allocToInput(node.alloc),
          placeholder: '—',
          dataset: { path: path },
          title: 'How many photos from this folder you want to KEEP. ' +
                 '0 skips the folder, * means no limit, blank shares the parent\u2019s leftovers.'
        });

        input.addEventListener('input', function () {
          var parsed = PT.tree.parseAlloc(input.value);
          if (!parsed) { input.classList.add('invalid'); return; }
          input.classList.remove('invalid');
          setAlloc(path, parsed);
        });

        var infOn = node.alloc.mode === 'uncapped';
        var inf = el('button', {
          class: 'btn btn-sm tree-inf' + (infOn ? ' on' : ''),
          text: '∞',
          title: 'Cull until satisfied, with no target',
          onclick: function () {
            setAlloc(path, infOn ? { mode: 'pooled', value: null } : { mode: 'uncapped', value: null });
          }
        });

        var stateWord = node.excluded ? 'skipped'
          : node.alloc.mode === 'uncapped' ? 'uncapped'
          : node.alloc.mode === 'fixed' ? (node.clamped ? 'clamped ' + node.target : 'fixed')
          : node.unitId ? 'pooled' : 'pooled';

        // How brutal this cut is, as a fraction. Uncapped reads as full.
        var p = node.uncapped ? 1
          : (node.target != null && node.subtreeCount) ? node.target / node.subtreeCount
          : 0;
        var bar = el('span', { class: 'tree-bar', style: '--p:' + Math.max(0, Math.min(1, p)) },
                     [el('i')]);

        // A <label> so clicking anywhere on the row — the folder name especially —
        // lands in that row's keep field. Depth moves to a custom property so CSS
        // owns both the indent and the hierarchy rails.
        var row = el('label', {
          class: 'tree-row' + (node.excluded ? ' excluded' : '') + (hasError ? ' has-error' : ''),
          style: '--d:' + depth
        }, [
          el('span', { class: 'tree-name',
                       text: (path === '' ? s.session.rootName : node.name) }),
          el('span', { class: 'tree-count', text: node.subtreeCount + ' photo' + (node.subtreeCount === 1 ? '' : 's') }),
          input,
          inf,
          bar,
          el('span', { class: 'tree-state', text: stateWord })
        ]);

        // Offer top-down distribution only where it is meaningful (PRD 4.4).
        if (node.alloc.mode === 'fixed' && s.tree.nodes[path].childPaths.length) {
          row.appendChild(el('button', {
            class: 'btn btn-sm btn-quiet', text: 'split',
            title: 'Suggest a split of ' + node.alloc.value + ' across the subfolders',
            onclick: function () { offerSplit(path, node.alloc.value); }
          }));
        }
        return row;
      }

      function setAlloc(path, parsed) {
        PT.store.dispatch('tree:alloc', function (s) { s.session.allocs[path] = parsed; });
        render();
      }

      function offerSplit(path, total) {
        var s = PT.store.get();
        var mode = s.session.settings.distribution;
        var sug = PT.tree.distribute(s.tree, s.resolution, path, total, mode);
        var names = Object.keys(sug);
        if (!names.length) return;

        var body = PT.dom.$('#modal-body');
        PT.dom.clear(body);
        body.appendChild(el('h2', { text: 'Split ' + total + ' across ' + names.length + ' subfolders' }));

        var listHost = el('div', { style: 'margin:12px 0' });
        var draw = function (m) {
          var d = PT.tree.distribute(s.tree, s.resolution, path, total, m);
          PT.dom.clear(listHost);
          Object.keys(d).forEach(function (c) {
            listHost.appendChild(el('div', { class: 'row small' }, [
              el('span', { class: 'tree-name', text: s.tree.nodes[c].name }),
              el('span', { class: 'muted nums', text: s.resolution.nodes[c].subtreeCount + ' photos' }),
              el('b', { class: 'nums', text: String(d[c]) })
            ]));
          });
          return d;
        };
        var current = draw(mode);

        body.appendChild(listHost);
        body.appendChild(el('div', { class: 'row' }, [
          el('button', { class: 'btn btn-sm', text: 'Weighted by photo count',
            onclick: function () { current = draw('weighted'); } }),
          el('button', { class: 'btn btn-sm', text: 'Even split',
            onclick: function () { current = draw('even'); } }),
          el('span', { class: 'spacer' }),
          el('button', { class: 'btn btn-quiet', text: 'Cancel',
            onclick: function () { PT.dom.$('#modal').close(); } }),
          el('button', { class: 'btn btn-primary', text: 'Apply', onclick: function () {
            PT.store.dispatch('tree:distribute', function (ss) {
              Object.keys(current).forEach(function (c) {
                ss.session.allocs[c] = { mode: 'fixed', value: current[c] };
              });
            });
            PT.dom.$('#modal').close();
            render();
          } })
        ]));
        body.appendChild(el('p', { class: 'small dim', style: 'margin-top:10px',
          text: 'These are suggestions. Every one is editable afterwards.' }));
        PT.dom.$('#modal').showModal();
      }

      function renderIssues(res) {
        PT.dom.clear(issuesHost);
        var rank = { error: 0, warn: 1, note: 2 };
        res.issues.slice().sort(function (a, b) { return rank[a.level] - rank[b.level]; })
          .forEach(function (i) {
            var s = PT.store.get();
            var where = i.path === '' ? s.session.rootName : (s.tree.nodes[i.path] || {}).name || i.path;
            issuesHost.appendChild(el('div', { class: 'notice notice-' + i.level }, [
              el('b', { text: where + ': ' }),
              el('span', { text: i.message })
            ]));
          });
      }

      function renderFooter(res) {
        PT.dom.clear(footer);
        var s = PT.store.get();

        footer.appendChild(el('div', { class: 'totals' }, [
          el('span', { class: 'muted small', text: 'Photos you will keep' }),
          el('b', { text: res.projectedTotal === null ? '—' : String(res.projectedTotal) }),
          el('span', { class: 'muted small', text:
            res.projectedTotal === null
              ? 'no target: uncapped folders finish when you say so'
              : 'from ' + res.units.length + ' tournament' + (res.units.length === 1 ? '' : 's') })
        ]));

        footer.appendChild(el('span', { class: 'spacer' }));

        footer.appendChild(el('label', { class: 'check small' }, [
          (function () {
            var cb = el('input', { type: 'checkbox' });
            cb.checked = s.session.settings.stageD;
            cb.addEventListener('change', function () {
              PT.store.dispatch('settings:stageD', function (ss) { ss.session.settings.stageD = cb.checked; });
            });
            return cb;
          })(),
          el('span', { text: 'Also run a best-of-the-best round across all winners' })
        ]));

        var go = el('button', {
          class: 'btn btn-primary',
          text: 'Start culling →',
          onclick: function () { startUnits(res); }
        });
        if (res.hasErrors || !res.units.length) {
          go.disabled = true;
          go.title = res.hasErrors
            ? 'Resolve the problems above first'
            : 'Give at least one folder a finalist count';
        }
        footer.appendChild(go);
      }

      function startUnits(res) {
        PT.store.dispatch('units:create', function (s) {
          res.units.forEach(function (u) {
            if (!s.session.units[u.id]) s.session.units[u.id] = PT.session.newUnit(u);
          });
          s.session.stage = 'unit';
          var pending = PT.session.pendingUnits(s.session);
          s.session.activeUnitId = pending.length ? pending[0].id : null;
        });
        var id = PT.store.get().session.activeUnitId;
        if (!id) return;
        // PRD 7.7: review the near-duplicate grouping before the first grid
        // pass, but only when there is something to review. PT.dupes.route owns
        // that decision and falls through to the grid when there is not.
        if (PT.dupes && PT.dupes.route) PT.dupes.route(id);
        else PT.router.go('grid', { unitId: id });
      }
    },

    unmount: function () {
      PT.dom.$('#topbar-counters').textContent = '';
    }
  });
})();

/** CHANGELOG
 * v1.0 (2026-07-28): Initial release. Per-node allocation input with both the
 *   typed * and the toggle entry paths, live re-resolution on every keystroke,
 *   ranked issue list, weighted and even distribution with an editable preview,
 *   projected total, Stage D opt-in, and unit creation.
  * v1.1 (2026-07-28): Fixed two-digit entry. Re-rendering on every keystroke
 *   recreated the input and stole focus, so only the first digit of a number ever
 *   landed; focus and caret are now restored after render. Reworded throughout to
 *   say the number is how many photos you KEEP, and added a column header.
 * v1.2 (2026-07-28): Adopted photournament_ui_v2.0.css. Removed the injected
 *   style block. The row is now a <label> ordered name / count / keep / infinity /
 *   proportion bar / state, so it reads as the sentence the screen asks — "Trip
 *   has 36, keep 8" — instead of stranding the field at the far right. Depth moved
 *   to a --d custom property so CSS owns the indent and hierarchy rails, and the
 *   second paragraph of help became a disclosure.
 * v1.3 (2026-07-28): Routes into the PRD 7.7 duplicate review after the units
 *   are created, when there is anything to review.
*/

</script>
<script>
/* ===== 60_screen_grid.js ===== */
/**
 * @file 60_screen_grid.js
 * @version 1.1
 * @author Samuel Cao
 * @created 2026-07-28
 * @lastUpdated 2026-07-28
 * @description Stage A grid pass screen (PRD 7.1), the low cull rate offer (PRD 7.2), and the cut pile rescue screen (PRD 7.5). Registers the 'grid' and 'rescue' screens.
 * @aiUpdate Update @lastUpdated and @version. Append changelog at bottom.
 *
 * This is the forcing function of PRD section 2 made concrete. Three properties
 * are load-bearing and everything else here is in service of them:
 *
 *   1. The quota locks at pass start. PT.session.startPass COPIES the settings
 *      into the pass, and every quota decision on this screen reads the pass copy,
 *      never session.settings. Changing a setting mid-pass therefore cannot loosen
 *      the commitment even if some other screen writes to settings. The config
 *      controls are still rendered during a pass, disabled, next to a lock badge —
 *      PRD 7.1 asks for the constraint to be visible rather than silent.
 *
 *   2. All stage state lives in the store, never in a closure here. unit.currentPass
 *      holds order/index/kept/sel and is written on every toggle and every advance,
 *      so PRD 7.10's mid-pass resume is a consequence of the data model rather than
 *      a feature bolted on. A reload mid-pass re-enters on the same screen with the
 *      same selection.
 *
 *   3. Only the photos on screen hold object URLs. Every screen advance releases
 *      the previous cells, and the rescue pile — which can be hundreds of photos in
 *      one scroller — attaches and releases through an IntersectionObserver. At 500
 *      photos, holding every thumbnail URL defeats the bounded-memory strategy PRD
 *      section 8 depends on.
 *
 * Two fields are added to the unit record beyond PT.session.newUnit:
 *   unit.lastSummary        the finished pass summary being reported (PRD 7.2)
 *   unit.lastPassSnapshot   pool + cut as they were BEFORE that pass, so the
 *                           re-run offer can actually undo it. Persisted rather
 *                           than held in memory because the user may reload while
 *                           the offer is on screen.
 *   unit.rescueLimit        the pre-committed rescue cap (PRD 7.5), locked once set
 *   unit.rescueSel          in-progress rescue selection, so review survives reload
 */

(function () {
  'use strict';

  var PT = (window.PT = window.PT || {});
  var dom = PT.dom;
  var el = dom.el;
  var S = PT.session;


  /* ------------------------------------------------------------------ style */


  /* ---------------------------------------------------------------- helpers */

  function st() { return PT.store.get(); }

  function unitId(params) {
    var s = st();
    if (params && params.unitId) return params.unitId;
    return s && s.session ? s.session.activeUnitId : null;
  }

  function getUnit(id) {
    var s = st();
    if (!s || !s.session || !s.session.units) return null;
    return s.session.units[id] || null;
  }

  /** Mutate the unit through the store so the change persists and resume works. */
  function editUnit(id, name, fn) {
    PT.store.dispatch(name, function (state) {
      var u = state.session.units[id];
      if (u) fn(u, state);
    });
  }

  function photoName(id) {
    var s = st();
    var p = s && s.photos ? s.photos[id] : null;
    return (p && (p.name || p.path)) || id;
  }

  function thumbOf(id) {
    var s = st();
    var d = s && s.derivatives ? s.derivatives[id] : null;
    return d ? (d.thumb || d.preview || null) : null;
  }

  function toast(msg) {
    var host = document.getElementById('toasts');
    if (!host) return;
    var t = el('div', { class: 'toast', text: msg });
    host.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
  }

  /**
   * Navigate without exploding when a downstream screen is not in this build.
   * A half-built artifact should say so, not throw out of a click handler.
   */
  function goSafe(name, params) {
    try {
      PT.router.go(name, params);
      return true;
    } catch (e) {
      PT.warn('grid', 'navigation to "' + name + '" failed', e);
      toast('The ' + name + ' screen is not available in this build yet.');
      return false;
    }
  }

  function setTopbar(contextText, counterNodes) {
    var bar = document.getElementById('topbar');
    if (bar) bar.hidden = false;
    var ctx = document.getElementById('topbar-context');
    if (ctx) ctx.textContent = contextText || '';
    var cnt = document.getElementById('topbar-counters');
    if (cnt) {
      dom.clear(cnt);
      (counterNodes || []).forEach(function (n) { cnt.appendChild(n); });
    }
  }

  function clearTopbar() {
    var ctx = document.getElementById('topbar-context');
    if (ctx) ctx.textContent = '';
    var cnt = document.getElementById('topbar-counters');
    if (cnt) dom.clear(cnt);
  }

  function counter(label, value) {
    return el('span', {}, [label + ' ', el('b', { text: String(value) })]);
  }

  /* ------------------------------------------------------------ pure logic */

  /** The locked configuration of a live pass, shaped like a settings object. */
  function passSettings(pass) {
    return { quotaMode: pass.quotaMode, quotaCustom: pass.quotaCustom };
  }

  function quotaFor(pass, screenCount) {
    return S.resolveQuota(passSettings(pass), screenCount);
  }

  /**
   * PRD 7.1 counters. Pure so it can be unit tested and so the topbar and the
   * action row cannot disagree about what the numbers are.
   */
  function passCounters(unit, pass) {
    var total = pass.order.length;
    var screens = S.screensTotal(pass);
    var screen = S.screenAt(pass, pass.index);
    var sel = pass.sel || [];
    var shown = pass.index * pass.gridSize + screen.length;
    var keptLive = pass.kept.length + sel.length;
    var unseen = Math.max(0, total - shown);
    return {
      remaining: total - pass.index * pass.gridSize, // this screen included
      screensLeft: screens - pass.index,
      screensTotal: screens,
      screenNo: pass.index + 1,
      field: keptLive + unseen,                      // projected survivors
      target: unit.target,
      cutPct: shown ? (shown - keptLive) / shown : 0
    };
  }

  /**
   * PRD 7.2: the offer is to re-run "with a tighter quota", so the tool has to
   * propose one. One notch tighter each time, bottoming out at Keep 1 — which is
   * the tightest quota that still lets a pass make progress.
   */
  function tightenQuota(cfg, gridSize) {
    var size = gridSize || cfg.gridSize || 9;
    switch (cfg.quotaMode) {
      case 'unlimited':
        return { quotaMode: 'half', quotaCustom: cfg.quotaCustom };
      case 'half':
        return { quotaMode: 'custom', quotaCustom: Math.max(1, Math.floor(size / 2) - 1) };
      case 'custom':
        return cfg.quotaCustom > 1
          ? { quotaMode: 'custom', quotaCustom: cfg.quotaCustom - 1 }
          : { quotaMode: 'one', quotaCustom: 1 };
      default:
        return { quotaMode: 'one', quotaCustom: 1 };
    }
  }

  /** PRD 7.5: fixed number, percentage of the cut pile, or unlimited. */
  function rescueMax(limit, cutCount) {
    if (!limit) return 0;
    if (limit.mode === 'unlimited') return Infinity;
    if (limit.mode === 'pct') {
      var pct = Math.max(0, Math.min(100, Number(limit.value) || 0));
      if (!pct) return 0;
      return Math.min(cutCount, Math.max(1, Math.round((cutCount * pct) / 100)));
    }
    return Math.min(cutCount, Math.max(0, Math.floor(Number(limit.value) || 0)));
  }

  function rescueLimitLabel(limit, cutCount) {
    if (!limit) return 'not set';
    if (limit.mode === 'unlimited') return 'unlimited';
    if (limit.mode === 'pct') return limit.value + '% of ' + cutCount + ' = ' + rescueMax(limit, cutCount);
    return String(rescueMax(limit, cutCount));
  }

  function capLabel(quota) {
    return quota === Infinity ? 'no limit' : 'keep at most ' + quota;
  }

  /* ================================================================== GRID */

  var G = null; // live mount state; nulled by unmount

  function releaseCells() {
    if (!G) return;
    G.imgs.forEach(function (img) { dom.releaseImg(img); });
    G.imgs = [];
  }

  /**
   * A photo cell. `pos` is 1-based and drives the number-key mapping; the tenth
   * cell is labelled 0 because that is the key that selects it.
   */
  function photoCell(id, pos, onClick) {
    var img = el('img', { class: 'thumb', alt: '' });
    var blob = thumbOf(id);
    var body;
    if (blob) {
      dom.setImg(img, blob);
      body = img;
    } else {
      body = el('div', { class: 'pt-missing', text: 'no thumbnail' });
    }
    var cell = el('div', {
      class: 'photo-cell',
      dataset: { id: id, pos: String(pos), t: 'cell' },
      title: photoName(id),
      onclick: function () { onClick(id); }
    }, [
      body,
      el('span', { class: 'idx', text: pos <= 9 ? String(pos) : (pos === 10 ? '0' : String(pos)) }),
      el('span', { class: 'pt-cell-name', text: photoName(id) })
    ]);
    return { cell: cell, img: blob ? img : null };
  }

  /* --------------------------------------------------------- config card */

  /**
   * PRD 7.1's configuration table. Rendered in both views: live before a pass,
   * disabled with a lock badge during one. Disabling rather than hiding is
   * deliberate — the user needs to see what they committed to.
   */
  function configCard(unit, locked) {
    var s = st().session;
    var cfg = locked ? unit.currentPass : s.settings;
    var wrap = el('div', { class: 'card card-tight pt-config' + (locked ? ' locked' : ''), dataset: { t: 'config' } });

    function field(label, control) {
      return el('label', { class: 'f' }, [label, control]);
    }

    var gridSel = el('select', {
      dataset: { t: 'cfg-grid' },
      disabled: locked,
      onchange: function () {
        var v = parseInt(gridSel.value, 10);
        PT.store.dispatch('settings:gridSize', function (state) { state.session.settings.gridSize = v; });
        render();
      }
    }, [6, 9, 12, 16].map(function (n) {
      return el('option', { value: String(n), text: String(n) + ' per screen', selected: cfg.gridSize === n });
    }));

    var quotaSel = el('select', {
      dataset: { t: 'cfg-quota' },
      disabled: locked,
      onchange: function () {
        var v = quotaSel.value;
        PT.store.dispatch('settings:quotaMode', function (state) { state.session.settings.quotaMode = v; });
        render();
      }
    }, [
      ['one', 'Keep 1'],
      ['half', 'Keep up to half'],
      ['custom', 'Custom number'],
      ['unlimited', 'Unlimited']
    ].map(function (o) {
      return el('option', { value: o[0], text: o[1], selected: cfg.quotaMode === o[0] });
    }));

    var customIn = el('input', {
      type: 'number', min: '1', max: '64',
      value: String(cfg.quotaCustom || 1),
      dataset: { t: 'cfg-custom' },
      disabled: locked,
      onchange: function () {
        var v = Math.max(1, parseInt(customIn.value, 10) || 1);
        customIn.value = String(v);
        PT.store.dispatch('settings:quotaCustom', function (state) { state.session.settings.quotaCustom = v; });
        render();
      }
    });

    var shuffleIn = el('input', {
      type: 'checkbox',
      dataset: { t: 'cfg-shuffle' },
      disabled: locked,
      onchange: function () {
        var v = shuffleIn.checked;
        PT.store.dispatch('settings:shuffle', function (state) { state.session.settings.shuffle = v; });
      }
    });
    shuffleIn.checked = locked ? !!cfg.shuffled : !!s.settings.shuffle;

    var floorIn = el('input', {
      type: 'number', min: '0', max: '100',
      value: String(Math.round((s.settings.cullFloor || 0) * 100)),
      dataset: { t: 'cfg-floor' },
      disabled: locked,
      title: 'Low cull rate warning floor (PRD 7.2). 0 disables it.',
      onchange: function () {
        var v = Math.max(0, Math.min(100, parseInt(floorIn.value, 10) || 0));
        floorIn.value = String(v);
        PT.store.dispatch('settings:cullFloor', function (state) { state.session.settings.cullFloor = v / 100; });
      }
    });

    wrap.appendChild(field('Grid', gridSel));
    wrap.appendChild(field('Quota', quotaSel));
    if ((locked ? cfg.quotaMode : s.settings.quotaMode) === 'custom') wrap.appendChild(field('Keep up to', customIn));
    wrap.appendChild(field('Shuffle', shuffleIn));
    wrap.appendChild(field('Low cull floor %', floorIn));

    if (locked) {
      wrap.appendChild(el('span', { class: 'pt-lock', dataset: { t: 'lock-badge' },
        text: 'Locked for pass ' + cfg.n + ': ' + S.quotaLabel(passSettings(cfg)) }));
      wrap.appendChild(el('span', { class: 'small dim', dataset: { t: 'lock-note' },
        text: 'The quota is locked until this pass ends. Changes take effect on the next pass.' }));
    }
    return wrap;
  }

  /* -------------------------------------------------------- setup / between */

  function renderSetup(unit) {
    var s = st().session;
    var root = G.root;
    dom.clear(root);
    releaseCells();

    var wrap = el('div', { class: 'pt-wrap screen-narrow' });
    root.appendChild(wrap);

    setTopbar(unit.label + ' · Stage A', [
      counter('pool', unit.pool.length),
      counter('cut', unit.cut.length),
      counter('target', unit.target == null ? '—' : unit.target),
      counter('passes', unit.passes.length)
    ]);

    wrap.appendChild(el('div', { class: 'pt-title' }, [
      el('h1', { text: unit.label }),
      el('span', { class: 'muted small', dataset: { t: 'unit-line' },
        text: unit.pool.length + ' in the pool · ' + unit.cut.length + ' cut · ' +
              (unit.target == null ? 'uncapped' : 'target ' + unit.target) })
    ]));

    /* ---- PRD 7.2: report the last pass, and offer the re-run if it was thin */
    if (unit.lastSummary) {
      var sum = unit.lastSummary;
      var card = el('div', { class: 'card pt-sum', dataset: { t: 'summary' } }, [
        el('h2', { text: 'Pass ' + sum.n + ' complete' }),
        el('p', { class: 'muted small', dataset: { t: 'summary-line' } }, [
          'Cut ', el('b', { text: String(sum.cut) }), ' of ', el('b', { text: String(sum.before) }),
          ' (', el('b', { text: PT.fmt.pct(sum.cutPct) }), ' cut) across ',
          el('b', { text: String(sum.screens) }), ' screens. ',
          el('b', { text: String(sum.after) }), ' survive.'
        ])
      ]);
      wrap.appendChild(card);

      if (unit.lastPassSnapshot && S.lowCullRate(sum, s.settings)) {
        var tighter = tightenQuota(sum, sum.gridSize);
        var note = el('div', { class: 'notice notice-warn', dataset: { t: 'lowcull' } }, [
          el('p', {}, [
            'That pass cut only ', el('b', { text: PT.fmt.pct(sum.cutPct) }), ', below your ',
            el('b', { text: PT.fmt.pct(s.settings.cullFloor) }), ' floor. It cost ' + sum.screens +
            ' screens and left the pile largely intact.'
          ]),
          el('p', { class: 'small', text:
            'You can re-run pass ' + sum.n + ' with a tighter quota (' +
            S.quotaLabel(tighter) + '), which puts the ' + sum.cut +
            ' cut photos back first. Or keep the result as it stands.' }),
          el('div', { class: 'row' }, [
            el('button', { class: 'btn btn-primary', dataset: { t: 'rerun' },
              text: 'Re-run pass ' + sum.n + ' — ' + S.quotaLabel(tighter),
              onclick: function () { rerunPass(tighter); } }),
            el('button', { class: 'btn', dataset: { t: 'decline' }, text: 'Keep these results',
              onclick: function () {
                editUnit(G.unitId, 'grid:declineRerun', function (u) { u.lastPassSnapshot = null; });
                render();
              } })
          ])
        ]);
        card.appendChild(note);
      }
    }

    /* ---- PRD 7.1 handoff suggestion; uncapped units get none */
    if (unit.passes.length) {
      var sug = S.bracketSuggestion(unit);
      wrap.appendChild(el('div', {
        class: 'notice ' + (sug && sug.ready ? 'notice-note' : 'notice-note'),
        dataset: { t: 'suggestion' },
        text: sug ? sug.message
