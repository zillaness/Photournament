                  : unit.pool.length + ' left. This folder is uncapped, so there is no target — ' +
                    'run passes until you are happy with what is left.'
      }));
    }

    /* ---- configuration for the NEXT pass */
    if (unit.rerunOf) {
      wrap.appendChild(el('div', { class: 'notice notice-note', dataset: { t: 'rerun-note' },
        text: 'Re-running pass ' + unit.rerunOf + '. The quota below is one notch tighter — ' +
              'adjust it if you like, then start. It locks again when the pass begins.' }));
    }
    wrap.appendChild(configCard(unit, false));

    var canPass = unit.pool.length > 0;
    var startLabel = 'Start pass ' + (unit.passes.length + 1) +
      ' · ' + S.quotaLabel(s.settings) + ' · ' + s.settings.gridSize + ' per screen';

    var actions = el('div', { class: 'row' }, [
      el('button', {
        class: 'btn btn-primary', dataset: { t: 'start-pass' }, text: startLabel,
        disabled: !canPass, onclick: beginPass
      }),
      el('button', {
        class: 'btn', dataset: { t: 'cutpile' },
        text: 'Review cut pile (' + unit.cut.length + ')',
        disabled: unit.cut.length === 0,
        onclick: function () { goSafe('rescue', { unitId: G.unitId }); }
      }),
      el('button', {
        class: 'btn', dataset: { t: 'tobracket' }, text: 'Move on to the bracket',
        onclick: function () {
          editUnit(G.unitId, 'unit:toBracket', function (u) { u.phase = 'bracket'; });
          if (!goSafe('bracket', { unitId: G.unitId })) {
            editUnit(G.unitId, 'unit:toBracket:revert', function (u) { u.phase = 'gridA'; });
            render();
          }
        }
      })
    ]);
    wrap.appendChild(actions);

    if (!canPass) {
      wrap.appendChild(el('div', { class: 'notice notice-warn', dataset: { t: 'empty' },
        text: 'The pool is empty. Rescue something from the cut pile, or move on.' }));
    }
  }

  /* -------------------------------------------------------------- the pass */

  function beginPass() {
    var s = st().session;
    editUnit(G.unitId, 'grid:startPass', function (u) {
      u.currentPass = S.startPass(u, s.settings);
      u.currentPass.sel = [];
      // Starting a new pass forecloses re-running the previous one.
      u.lastPassSnapshot = null;
      u.lastSummary = null;
      u.rerunOf = null;
      u.phase = 'gridA';
    });
    render();
  }

  function renderPass(unit) {
    var root = G.root;
    dom.clear(root);
    releaseCells();

    var wrap = el('div', { class: 'pt-wrap' });
    root.appendChild(wrap);

    G.els = {};
    wrap.appendChild(configCard(unit, true));

    G.els.grid = el('div', { class: 'grid pt-grid', dataset: { t: 'grid' } });
    wrap.appendChild(G.els.grid);

    G.els.back = el('button', { class: 'btn', dataset: { t: 'back' }, text: 'Back', onclick: goBack });
    G.els.undo = el('button', { class: 'btn', dataset: { t: 'undo' }, text: 'Undo', onclick: undo });
    G.els.hint = el('span', { class: 'pt-hint', dataset: { t: 'hint' } });
    G.els.progress = el('span', { class: 'muted small nums', dataset: { t: 'progress' } });
    G.els.advance = el('button', {
      class: 'btn btn-primary', dataset: { t: 'advance' }, text: 'Continue', onclick: advance
    });

    wrap.appendChild(el('div', { class: 'row pt-actions' }, [
      G.els.back,
      G.els.undo,
      G.els.progress,
      G.els.hint,
      el('span', { class: 'spacer' }),
      el('span', { class: 'muted small' }, [
        el('kbd', { text: '1' }), '–', el('kbd', { text: '9' }), ' select · ',
        el('kbd', { text: '0' }), ' tenth · ',
        el('kbd', { text: 'Enter' }), ' advance · ',
        el('kbd', { text: 'U' }), ' undo · ',
        el('kbd', { text: '←' }), ' back'
      ]),
      G.els.advance
    ]));

    paintScreen();
  }

  /** Rebuild the cells for the current screen. Every previous URL is released. */
  function paintScreen() {
    var unit = getUnit(G.unitId);
    var pass = unit.currentPass;
    releaseCells();
    var host = G.els.grid;
    dom.clear(host);
    host.className = 'grid pt-grid grid-' + pass.gridSize;

    var ids = S.screenAt(pass, pass.index);
    G.screenIds = ids;
    G.cells = [];
    G.undoStack = [];
    ids.forEach(function (id, i) {
      var made = photoCell(id, i + 1, toggle);
      if (made.img) G.imgs.push(made.img);
      G.cells.push(made.cell);
      host.appendChild(made.cell);
    });
    paintState();
  }

  /** Cheap repaint: classes, counters, button state. No image churn. */
  function paintState() {
    var unit = getUnit(G.unitId);
    var pass = unit.currentPass;
    var sel = pass.sel || [];
    var quota = quotaFor(pass, G.screenIds.length);
    var over = sel.length - (quota === Infinity ? sel.length : quota);

    G.cells.forEach(function (c) {
      var on = sel.indexOf(c.dataset.id) >= 0;
      c.classList.toggle('kept', on);
    });

    var c = passCounters(unit, pass);
    var last = pass.index + 1 >= c.screensTotal;

    G.els.progress.textContent = 'screen ' + c.screenNo + ' of ' + c.screensTotal +
      ' · ' + sel.length + ' selected · ' + capLabel(quota);
    G.els.back.disabled = pass.index === 0;
    G.els.undo.disabled = G.undoStack.length === 0 && pass.index === 0;

    if (over > 0) {
      G.els.advance.disabled = true;
      G.els.advance.textContent = 'keep at most ' + quota;
      G.els.hint.textContent = 'keep at most ' + quota + ' — deselect ' + over;
    } else {
      G.els.advance.disabled = false;
      G.els.advance.textContent = last
        ? 'Finish pass ' + pass.n + ' and continue'
        : 'Keep ' + sel.length + ' · continue';
      G.els.hint.textContent = '';
    }

    setTopbar(unit.label + ' · pass ' + pass.n + ' · ' + S.quotaLabel(passSettings(pass)), [
      counter('remaining', c.remaining),
      counter('screens left', c.screensLeft),
      counter('field', c.field + (c.target == null ? ' (uncapped)' : ' / ' + c.target)),
      counter('cut this pass', PT.fmt.pct(c.cutPct))
    ]);
  }

  /**
   * PRD 7.1 is explicit that going over the quota must not silently reject the
   * click: the selection is allowed to exceed, and the advance button is what
   * refuses, with the reason on it.
   */
  function toggle(id) {
    editUnit(G.unitId, 'grid:toggle', function (u) {
      var p = u.currentPass;
      if (!p) return;
      p.sel = p.sel || [];
      var i = p.sel.indexOf(id);
      if (i >= 0) p.sel.splice(i, 1); else p.sel.push(id);
    });
    G.undoStack.push(id);
    paintState();
  }

  function undo() {
    if (G.undoStack.length) {
      var id = G.undoStack.pop();
      editUnit(G.unitId, 'grid:undo', function (u) {
        var p = u.currentPass;
        var i = p.sel.indexOf(id);
        if (i >= 0) p.sel.splice(i, 1); else p.sel.push(id);
      });
      paintState();
      return;
    }
    goBack();
  }

  /**
   * Back-navigation within the pass. The kept list is authoritative, so stepping
   * back means pulling this screen's ids out of it and back into the selection —
   * the user sees exactly what they had kept there.
   */
  function goBack() {
    var unit = getUnit(G.unitId);
    if (!unit.currentPass || unit.currentPass.index === 0) return;
    editUnit(G.unitId, 'grid:back', function (u) {
      var p = u.currentPass;
      p.index--;
      var ids = S.screenAt(p, p.index);
      var back = [];
      p.kept = p.kept.filter(function (id) {
        if (ids.indexOf(id) >= 0) { back.push(id); return false; }
        return true;
      });
      p.sel = back;
    });
    paintScreen();
  }

  function advance() {
    var unit = getUnit(G.unitId);
    var pass = unit.currentPass;
    var quota = quotaFor(pass, G.screenIds.length);
    if ((pass.sel || []).length > quota) return; // the button already says why
    var last = pass.index + 1 >= S.screensTotal(pass);

    if (!last) {
      editUnit(G.unitId, 'grid:advance', function (u) {
        var p = u.currentPass;
        p.kept = p.kept.concat(p.sel || []);
        p.sel = [];
        p.index++;
      });
      paintScreen();   // releases the previous screen's object URLs
      return;
    }

    editUnit(G.unitId, 'grid:finishPass', function (u) {
      var p = u.currentPass;
      p.kept = p.kept.concat(p.sel || []);
      p.sel = [];
      // Snapshot BEFORE folding the pass in, so the PRD 7.2 re-run can restore
      // the pool and the cut pile exactly as they were.
      u.lastPassSnapshot = { pool: u.pool.slice(), cut: u.cut.slice() };
      var summary = S.finishPass(u, p);
      u.lastSummary = summary;
      if (!S.lowCullRate(summary, st().session.settings)) u.lastPassSnapshot = null;
    });
    releaseCells();
    render();
  }

  /** PRD 7.2 re-run: restore the pre-pass state, then offer a tighter quota. */
  function rerunPass(tighter) {
    var unit = getUnit(G.unitId);
    if (!unit.lastPassSnapshot) return;
    var n = unit.lastSummary ? unit.lastSummary.n : unit.passes.length;
    PT.store.dispatch('grid:rerunPass', function (state) {
      var u = state.session.units[G.unitId];
      var snap = u.lastPassSnapshot;
      u.pool = snap.pool.slice();
      u.cut = snap.cut.slice();
      u.passes.pop();
      u.lastPassSnapshot = null;
      u.lastSummary = null;
      u.rerunOf = n;
      state.session.settings.quotaMode = tighter.quotaMode;
      if (tighter.quotaCustom != null) state.session.settings.quotaCustom = tighter.quotaCustom;
    });
    toast('Pass ' + n + ' rolled back. ' + getUnit(G.unitId).pool.length + ' photos back in the pool.');
    render();
  }

  /* ------------------------------------------------------------- keyboard */

  function onKey(e) {
    if (!G || !G.mode) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    var unit = getUnit(G.unitId);
    if (!unit || !unit.currentPass) return;

    if (e.key === 'Enter') {
      e.preventDefault();
      if (!G.els.advance.disabled) advance();
      return;
    }
    if (e.key === 'Backspace' || e.key === 'ArrowLeft') { e.preventDefault(); goBack(); return; }
    if (e.key === 'u' || e.key === 'U' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z')) {
      e.preventDefault(); undo(); return;
    }
    if (/^[0-9]$/.test(e.key)) {
      // 1..9 are positions 1..9; 0 is the tenth cell.
      var pos = e.key === '0' ? 10 : parseInt(e.key, 10);
      var id = G.screenIds[pos - 1];
      if (id) { e.preventDefault(); toggle(id); }
    }
  }

  /* ------------------------------------------------------------- lifecycle */

  function render() {
    var unit = getUnit(G.unitId);
    if (!unit) {
      dom.clear(G.root);
      G.root.appendChild(el('div', { class: 'error-box', text: 'No tournament unit to work on.' }));
      return;
    }
    G.mode = unit.currentPass ? 'pass' : 'setup';
    if (unit.currentPass) {
      // PRD 7.10: a pass restored from storage may predate the `sel` field.
      if (!unit.currentPass.sel) {
        editUnit(G.unitId, 'grid:resumeInit', function (u) { u.currentPass.sel = []; });
      }
      renderPass(getUnit(G.unitId));
    } else {
      renderSetup(unit);
    }
  }

  PT.router.register('grid', {
    mount: function (root, params) {
      var s = st();
      if (!s || !s.session) {
        root.appendChild(el('div', { class: 'error-box', text: 'No session loaded.' }));
        return;
      }
      G = { root: root, unitId: unitId(params), imgs: [], cells: [], screenIds: [], undoStack: [], els: {}, mode: null };
      var u = getUnit(G.unitId);
      if (u && s.session.activeUnitId !== G.unitId) {
        PT.store.dispatch('session:activeUnit', function (state) { state.session.activeUnitId = G.unitId; });
      }
      G.keyHandler = onKey;
      document.addEventListener('keydown', G.keyHandler);
      render();
      if (u && u.currentPass) PT.log('grid', 'resumed mid-pass', { pass: u.currentPass.n, screen: u.currentPass.index + 1 });
    },
    unmount: function () {
      if (!G) return;
      document.removeEventListener('keydown', G.keyHandler);
      releaseCells();
      clearTopbar();
      G = null;
    }
  });

  /* ================================================================ RESCUE */

  var R = null;

  function rescueRelease() {
    if (!R) return;
    R.imgs.forEach(function (img) { dom.releaseImg(img); });
    R.imgs = [];
  }

  function renderRescue() {
    var unit = getUnit(R.unitId);
    var root = R.root;
    dom.clear(root);
    rescueRelease();
    if (R.observer) { R.observer.disconnect(); R.observer = null; }

    if (!unit) {
      root.appendChild(el('div', { class: 'error-box', text: 'No tournament unit to review.' }));
      return;
    }

    var wrap = el('div', { class: 'pt-wrap' });
    root.appendChild(wrap);

    if (!unit.cut.length) {
      wrap.appendChild(el('h1', { text: 'Cut pile — ' + unit.label }));
      wrap.appendChild(el('div', { class: 'notice notice-note', dataset: { t: 'empty' },
        text: 'Nothing has been cut yet, so there is nothing to rescue.' }));
      wrap.appendChild(el('div', { class: 'row' }, [
        el('button', { class: 'btn', dataset: { t: 'rescue-back' }, text: 'Back to Stage A',
          onclick: function () { goSafe('grid', { unitId: R.unitId }); } })
      ]));
      return;
    }

    if (!unit.rescueLimit) renderRescueLimit(wrap, unit);
    else renderRescueReview(wrap, unit);
  }

  /**
   * PRD 7.5: the limit is pre-committed, before the user has seen a single photo
   * they might want back. Once locked it is never raised — that is the whole
   * mechanism, since an adjustable rescue cap voids every quota upstream.
   */
  function renderRescueLimit(wrap, unit) {
    var n = unit.cut.length;
    setTopbar(unit.label + ' · cut pile', [counter('cut', n)]);

    wrap.appendChild(el('h1', { text: 'Cut pile — ' + n + ' photos' }));
    wrap.appendChild(el('p', { class: 'muted', text:
      'Set your rescue limit before you look. It locks for the whole review: a nine-way ' +
      'screen can drop a strong photo that landed among stronger ones, but an adjustable ' +
      'rescue cap would void every quota you have held yourself to so far.' }));

    var mode = el('select', { dataset: { t: 'rescue-mode' } }, [
      el('option', { value: 'fixed', text: 'A fixed number' }),
      el('option', { value: 'pct', text: 'A percentage of the cut pile' }),
      el('option', { value: 'unlimited', text: 'Unlimited' })
    ]);
    var value = el('input', { type: 'number', min: '0', max: '999', value: '5', dataset: { t: 'rescue-value' } });
    var preview = el('span', { class: 'muted small', dataset: { t: 'rescue-preview' } });

    function refresh() {
      value.disabled = mode.value === 'unlimited';
      var lim = { mode: mode.value, value: Number(value.value) };
      var max = rescueMax(lim, n);
      preview.textContent = max === Infinity
        ? 'no limit — every cut photo may come back'
        : 'allows ' + max + ' of ' + n + ' back into the pool';
    }
    mode.addEventListener('change', refresh);
    value.addEventListener('input', refresh);

    var card = el('div', { class: 'card' }, [
      el('div', { class: 'row' }, [
        el('label', { class: 'f' }, ['Rescue limit ', mode]),
        value,
        preview
      ]),
      el('div', { class: 'row', style: 'margin-top:12px' }, [
        el('button', {
          class: 'btn btn-primary', dataset: { t: 'rescue-lock' }, text: 'Lock the limit and review',
          onclick: function () {
            var lim = { mode: mode.value, value: Number(value.value), committedAt: Date.now() };
            editUnit(R.unitId, 'rescue:lockLimit', function (u) {
              u.rescueLimit = lim;
              u.rescueSel = u.rescueSel || [];
              // The phase moves too, so a reload during the review comes back
              // into the review rather than to the pass setup (PRD 7.10).
              u.phase = 'rescue';
            });
            renderRescue();
          }
        }),
        el('button', { class: 'btn btn-quiet', dataset: { t: 'rescue-skip' }, text: 'Skip the cut pile',
          onclick: function () { goSafe('grid', { unitId: R.unitId }); } })
      ])
    ]);
    refresh();
    wrap.appendChild(card);
  }

  function renderRescueReview(wrap, unit) {
    var n = unit.cut.length;
    var max = rescueMax(unit.rescueLimit, n);

    wrap.appendChild(el('div', { class: 'pt-title' }, [
      el('h1', { text: 'Cut pile — ' + n + ' photos' }),
      el('span', { class: 'pt-lock', dataset: { t: 'rescue-locked' },
        text: 'Rescue limit locked: ' + rescueLimitLabel(unit.rescueLimit, n) })
    ]));
    wrap.appendChild(el('p', { class: 'muted small', text:
      'Click anything worth another look. Rescued photos go back into the pool and ' +
      'into the bracket. The limit was set before you looked and cannot be raised now.' }));

    var pile = el('div', { class: 'grid pt-pile grid-' + (st().session.settings.gridSize || 9), dataset: { t: 'pile' } });
    wrap.appendChild(pile);
    R.els = {};
    R.cells = [];

    // Only what is near the viewport holds an object URL. The cut pile can be
    // several hundred photos in one scroller; attaching them all would undo the
    // bounded-memory guarantee the grid pass works so hard to keep.
    R.observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var img = en.target;
        if (en.isIntersecting) {
          if (!img._ptUrl) {
            var b = thumbOf(img.dataset.id);
            if (b) { dom.setImg(img, b); if (R.imgs.indexOf(img) < 0) R.imgs.push(img); }
          }
        } else if (img._ptUrl) {
          dom.releaseImg(img);
          img.removeAttribute('src');
        }
      });
    }, { root: pile, rootMargin: '300px 0px' });

    unit.cut.forEach(function (id, i) {
      var img = el('img', { class: 'thumb', alt: '', dataset: { id: id } });
      var cell = el('div', {
        class: 'photo-cell', dataset: { id: id, t: 'pile-cell' }, title: photoName(id),
        onclick: function () { toggleRescue(id); }
      }, [
        img,
        el('span', { class: 'idx', text: String(i + 1) }),
        el('span', { class: 'pt-cell-name', text: photoName(id) })
      ]);
      R.cells.push(cell);
      pile.appendChild(cell);
      R.observer.observe(img);
    });

    R.els.hint = el('span', { class: 'pt-hint', dataset: { t: 'rescue-hint' } });
    R.els.count = el('span', { class: 'muted small nums', dataset: { t: 'rescue-count' } });
    R.els.done = el('button', { class: 'btn btn-primary', dataset: { t: 'rescue-done' },
      text: 'Done', onclick: commitRescue });

    wrap.appendChild(el('div', { class: 'row pt-actions' }, [
      el('button', { class: 'btn', dataset: { t: 'rescue-clear' }, text: 'Clear selection',
        onclick: function () {
          editUnit(R.unitId, 'rescue:clear', function (u) { u.rescueSel = []; });
          paintRescue();
        } }),
      R.els.count,
      R.els.hint,
      el('span', { class: 'spacer' }),
      R.els.done
    ]));

    R.max = max;
    paintRescue();
  }

  function toggleRescue(id) {
    editUnit(R.unitId, 'rescue:toggle', function (u) {
      u.rescueSel = u.rescueSel || [];
      var i = u.rescueSel.indexOf(id);
      if (i >= 0) u.rescueSel.splice(i, 1); else u.rescueSel.push(id);
    });
    paintRescue();
  }

  function paintRescue() {
    var unit = getUnit(R.unitId);
    var sel = unit.rescueSel || [];
    var max = R.max;
    R.cells.forEach(function (c) { c.classList.toggle('kept', sel.indexOf(c.dataset.id) >= 0); });

    var over = max === Infinity ? 0 : sel.length - max;
    R.els.count.textContent = 'rescuing ' + sel.length + ' of ' +
      (max === Infinity ? unit.cut.length + ' (no limit)' : max + ' allowed');
    if (over > 0) {
      R.els.done.disabled = true;
      R.els.done.textContent = 'rescue at most ' + max;
      R.els.hint.textContent = 'rescue at most ' + max + ' — deselect ' + over;
    } else {
      R.els.done.disabled = false;
      R.els.done.textContent = sel.length
        ? 'Return ' + sel.length + ' to the pool'
        : 'Rescue nothing and continue';
      R.els.hint.textContent = '';
    }

    setTopbar(unit.label + ' · cut pile', [
      counter('cut', unit.cut.length),
      counter('rescuing', sel.length),
      counter('limit', max === Infinity ? '∞' : max)
    ]);
  }

  function commitRescue() {
    var unit = getUnit(R.unitId);
    var sel = (unit.rescueSel || []).slice();
    var max = R.max;
    if (max !== Infinity && sel.length > max) return;
    editUnit(R.unitId, 'rescue:commit', function (u) {
      var keep = {};
      sel.forEach(function (id) { keep[id] = 1; });
      u.cut = u.cut.filter(function (id) { return !keep[id]; });
      u.pool = u.pool.concat(sel);
      u.rescued = (u.rescued || []).concat(sel);
      u.rescueSel = [];
      u.rescueDone = true;
      u.phase = 'gridA';
    });
    if (sel.length) toast(sel.length + ' photo' + (sel.length === 1 ? '' : 's') + ' back in the pool.');
    goSafe('grid', { unitId: R.unitId });
  }

  PT.router.register('rescue', {
    mount: function (root, params) {
      var s = st();
      if (!s || !s.session) {
        root.appendChild(el('div', { class: 'error-box', text: 'No session loaded.' }));
        return;
      }
      R = { root: root, unitId: unitId(params), imgs: [], cells: [], els: {}, observer: null, max: 0 };
      renderRescue();
    },
    unmount: function () {
      if (!R) return;
      if (R.observer) { R.observer.disconnect(); R.observer = null; }
      rescueRelease();
      clearTopbar();
      R = null;
    }
  });

  /* ------------------------------------------------------------------- api */

  // Exposed for tests and for any screen that needs the same arithmetic.
  PT.gridScreen = {
    passCounters: passCounters,
    tightenQuota: tightenQuota,
    rescueMax: rescueMax,
    rescueLimitLabel: rescueLimitLabel,
    quotaFor: quotaFor,
    capLabel: capLabel
  };

  if (typeof PT.log === 'function') PT.log('grid', 'screens registered: grid, rescue');
})();

/** CHANGELOG
 * v1.0 (2026-07-28): Initial release. Stage A grid pass with locked per-pass
 *   configuration, click and number-key selection, quota-disabled advance carrying
 *   its own reason, undo, in-pass back-navigation that restores the previous
 *   screen's keeps, PRD 7.1 counters in the topbar, mid-pass resume from the
 *   persisted currentPass, the PRD 7.2 low cull rate offer with a true pool and
 *   cut-pile rollback, and the PRD 7.5 cut pile rescue screen with a pre-committed
 *   locked limit and viewport-bounded thumbnail attachment.
  * v1.1 (2026-07-28): Adopted photournament_ui_v2.0.css; removed the injected
 *   style block.
*/

</script>
<script>
/* ===== 70_screen_bracket.js ===== */
/**
 * @file 70_screen_bracket.js
 * @version 1.3
 * @author Samuel Cao
 * @created 2026-07-28
 * @lastUpdated 2026-07-28
 * @description Stage B bracket with the second-chance (repechage) round and Stage C burst runoff. Registers the 'bracket' and 'runoff' screens plus the pure PT.bracket ranking engine.
 * @aiUpdate Update @lastUpdated and @version. Append changelog at bottom.
 *
 * ============================================================================
 * PRD 7.3 — Stage B: bracket with a second-chance round
 * ============================================================================
 *
 * THE STATE IS AN OPS LOG, NOT A TREE
 * -----------------------------------
 * Nothing about the bracket's shape is persisted. What persists is
 *
 *     unit.bracket = { pool, target, seed, ops: [ {t:'pick',m,w} | {t:'defer',m} ] }
 *
 * and the entire bracket — every pairing, every elimination edge, every
 * placement — is REBUILT by replaying that log through a pure function. This is
 * the single decision that makes three of the required behaviours fall out for
 * free instead of each needing its own machinery:
 *
 *   - Unlimited undo is `ops.pop()` plus a rebuild. There are no inverse
 *     operations to write and therefore no inverse operations to get wrong.
 *   - Resume (PRD 7.10) is a rebuild from the persisted log. A reload mid-bracket
 *     lands on exactly the pairing the user was looking at.
 *   - The persisted record stays tiny: at 500 photos the log is a few hundred
 *     two-field objects, not a serialised bracket tree.
 *
 * Rebuild cost is O(field + ops), measured at well under a millisecond for a
 * 500-photo field, so doing it on every single click is not a compromise.
 *
 * SEEDING IS DETERMINISTIC (required for resume)
 * ----------------------------------------------
 * `seed` is stored once. The draw is `PT.session.seededShuffle(pool, seed)`, so
 * a resumed bracket is the SAME bracket. A Math.random() draw would reshuffle on
 * reload and silently invalidate every comparison already made.
 *
 * Entrants are then placed by the standard seeding pattern (1v16, 8v9, 4v13 …)
 * rather than pairing the shuffled list off in order. With a random draw the
 * pattern does not change who plays whom in any meaningful sense, but it is what
 * distributes BYES correctly for fields that are not a power of two: the byes go
 * to slots that are spread across the bracket instead of clumping in one corner.
 *
 * THE REPECHAGE (the point of the whole stage)
 * --------------------------------------------
 * A single-elimination bracket is only trustworthy about ONE thing: the winner.
 * Everything below first place is an artefact of the draw. The finalist who lost
 * the last match is not the second-best photo, it is the best photo in the other
 * half of the bracket. If the two strongest photos are drawn against each other
 * in round one, the second-strongest finishes in the bottom half of the results.
 * That is exactly the failure PRD success criterion 4 forbids.
 *
 * The fix is the classic tournament-selection argument. Under any consistent
 * judgement, the true second-best photo can only ever have lost to ONE photo:
 * the champion. So:
 *
 *   place 1  the champion of the main bracket.
 *   pool     every photo the champion personally eliminated.
 *   place 2  run a fresh mini single-elimination over that pool. Its winner is
 *            second. This is the second-chance round: a photo knocked out in
 *            round one by the eventual champion is right back in contention for
 *            second place, which is precisely "not lost to an unlucky draw".
 *   place p  when a photo is placed, remove it from the pool and add every photo
 *            IT personally eliminated (in the main bracket; anyone it beat during
 *            a repechage round is already in the pool). Run the next mini
 *            bracket. Repeat until `target` places are filled.
 *
 * Only photos beaten by a deep finisher ever enter the pool, which is the PRD's
 * "photos eliminated by deep finishers". The ORDER they play in is not random:
 * the mini bracket is seeded by how deep each candidate got in the main bracket,
 * so the two candidates with the strongest résumés are placed on opposite sides
 * and meet in the mini final rather than in its first round.
 *
 * Two things keep the cost down, both in closeSub/knownWinner below: the pool is
 * held in fixed slots so consecutive mini brackets differ only along the path
 * that changed, and a pairing the user has already judged is never asked twice.
 *
 * MEASURED, driving the built artifact in Chromium (Playwright, file:// origin):
 *
 *   field  target  comparisons   info floor   all pairs   textbook n-1+(k-1)lg n
 *      16       8           37           28         120                      43
 *      32       8           53           39         496                      66
 *      64       5           87           28        2016                      87
 *     500      20          712          170      124750                     670
 *
 * Randomised sweep, 200 fields of 4-48 photos with deferrals injected: every run
 * produced the exactly-correct ranking, and the worst run cost 1.03x textbook.
 *
 * DEFERRAL, UNDO, EARLY-STOP
 * --------------------------
 * "Too close to call" rotates the pairing to the BACK of the current round's
 * queue. It is never resolved by a coin flip and never dropped; it comes back
 * once the rest of the round has been judged, by which time the user has usually
 * recalibrated. Deferral is itself an op, so it survives reload and is undoable.
 *
 * Early-stop must yield a usable ranked result (PRD success criterion 9), so
 * `unit.winners` is rewritten after EVERY comparison, not at the end. Decided
 * places come first in true order; anything not yet placed is appended ranked by
 * how deep it got and how many comparisons it won. Stopping is also reversible —
 * it sets a flag rather than tearing the bracket down.
 *
 * ============================================================================
 * PRD 7.4 — Stage C: burst runoff
 * ============================================================================
 * A finalist that belongs to a near-duplicate group can be expanded into a
 * Keep-1 pass over that group. The group includes members cut back in Stage A,
 * which is the point: the burst cost one decision at ranking time (PRD success
 * criterion 3) and this is where the user gets to pick the best frame of it.
 * Optional, per-photo, and reversible. A unit with no near-duplicate groups
 * among its winners says so and offers to move on.
 */

(function () {
  'use strict';

  var PT = (window.PT = window.PT || {});
  var el = PT.dom.el;

  /* ======================================================================
   * 1. The engine — pure, no DOM, no store. Exported as PT.bracket.
   * ==================================================================== */

  function nextPow2(n) { var s = 1; while (s < n) s *= 2; return s; }

  /**
   * Slot order for a standard seeded bracket of `size` entrants, 1-based.
   * size 8 -> [1,8,4,5,2,7,3,6], i.e. pairs (1v8)(4v5)(2v7)(3v6).
   *
   * Two properties matter here. Every pair sums to size+1, so the lower seed is
   * always in the `a` slot and a bye (a seed number above the entrant count) is
   * therefore always in `b`. And top seeds land in different halves, which is
   * what spreads byes evenly across a non-power-of-two field.
   */
  function seedSlots(size) {
    var s = [1], i, n, t;
    while (s.length < size) {
      n = s.length * 2 + 1;
      t = [];
      for (i = 0; i < s.length; i++) { t.push(s[i]); t.push(n - s[i]); }
      s = t;
    }
    return s;
  }

  /**
   * First-round pairs for a field of any size. `entrants` is in seed order:
   * index 0 is seed 1. Entrants beyond the field size become nulls, which
   * resolveRound() turns into byes.
   */
  function firstRoundPairs(entrants) {
    var count = entrants.length;
    var size = nextPow2(count);
    var so = seedSlots(size);
    var pairs = [], i, sa, sb;
    for (i = 0; i < size / 2; i++) {
      sa = so[2 * i];
      sb = so[2 * i + 1];
      pairs.push({
        a: sa <= count ? entrants[sa - 1] : null,
        b: sb <= count ? entrants[sb - 1] : null,
        winner: null,
        mid: null,
        bye: false
      });
    }
    return pairs;
  }

  function createEngine(pool, target, seed) {
    var E = {
      seed: seed >>> 0,
      pool: pool.slice(),
      target: Math.max(0, Math.min(target, pool.length)),
      order: PT.session.seededShuffle(pool, seed >>> 0),

      matches: {},      // mid -> {mid, tag, round, pair, a, b, place}
      victims: {},      // winner id -> ids it personally eliminated
      elimBy: {},       // loser id -> the id that knocked it out of the MAIN bracket
      depth: {},        // id -> deepest MAIN round reached (0-based)
      wins: {},         // id -> comparisons won, all stages
      won: {},          // 'winner|loser' -> 1, so a pairing is never asked twice
      derived: 0,       // pairings resolved from a result the user already gave
      deferCount: {},   // mid -> times deferred

      placements: [],   // ordered, best first, fully decided
      candidates: [],   // live repechage pool for the next place
      repSlots: null,   // fixed-length slot array behind it; see closeSub
      history: [],      // [{mid,w,l,tag,round,place}] newest last

      comparisons: 0,
      defers: 0,
      place: 1,
      sub: null,        // the sub-bracket currently being played
      done: false,
      broke: null       // set if an ops log did not match the rebuilt bracket
    };
    if (!E.order.length || E.target === 0) { E.done = true; return E; }
    startSub(E, E.order, 'main', 1);
    return E;
  }

  /**
   * Begin a sub-bracket: the main draw, or one repechage mini bracket.
   * `entrants` may contain nulls — repechage slots are held open so the bracket
   * keeps its shape between places (see closeSub) — and a null is simply a bye.
   */
  function startSub(E, entrants, tag, place) {
    var live = entrants.filter(Boolean);
    if (!live.length) { closeSub(E, null); return; }
    if (live.length === 1) { closeSub(E, live[0]); return; }
    E.sub = {
      tag: tag,
      place: place,
      entrants: live.length,
      decided: 0,
      derived: 0,
      rounds: [firstRoundPairs(entrants)],
      ri: 0,
      queue: []
    };
    markDepth(E);
    resolveRound(E);
  }

  /**
   * Depth is recorded only for the main draw. It is the repechage seeding key
   * and the tiebreak for early-stop ranking, and both want "how far did this
   * photo get in the real bracket", not "how far in a consolation round".
   */
  function markDepth(E) {
    var sub = E.sub, i, p;
    if (sub.tag !== 'main') return;
    for (i = 0; i < sub.rounds[sub.ri].length; i++) {
      p = sub.rounds[sub.ri][i];
      if (p.a) E.depth[p.a] = Math.max(E.depth[p.a] || 0, sub.ri);
      if (p.b) E.depth[p.b] = Math.max(E.depth[p.b] || 0, sub.ri);
    }
  }

  /**
   * Auto-advance byes, mint match ids for the real pairings, and build the
   * queue the user works through. An empty queue means the round needs no
   * human input at all, so advance immediately.
   */
  /**
   * A pairing this exact user already judged. The repechage re-pools photos
   * across successive places, so without this the same two photos come back up
   * repeatedly — which reads as the tool not listening, and inflates the
   * comparison count for no information. Only DIRECT results are reused, never
   * a transitive chain: the tool must not invent an answer the user never gave.
   */
  function knownWinner(E, a, b) {
    if (E.won[a + '|' + b]) return a;
    if (E.won[b + '|' + a]) return b;
    return null;
  }

  function recordEdge(E, sub, w, l) {
    E.won[w + '|' + l] = 1;
    var v = E.victims[w] || (E.victims[w] = []);
    if (v.indexOf(l) < 0) v.push(l);
    // Only main-bracket edges answer "who eliminated whom" for the repechage;
    // a repechage loss does not remove a photo from the candidate pool.
    if (sub.tag === 'main' && !E.elimBy[l]) E.elimBy[l] = w;
  }

  function resolveRound(E) {
    var sub = E.sub, round = sub.rounds[sub.ri], q = [], i, p, k;
    for (i = 0; i < round.length; i++) {
      p = round[i];
      if (p.winner) continue;
      if (p.a && !p.b) { p.winner = p.a; p.bye = true; continue; }
      if (!p.a && p.b) { p.winner = p.b; p.bye = true; continue; }
      if (!p.a && !p.b) continue;
      k = knownWinner(E, p.a, p.b);
      if (k) {
        p.winner = k;
        p.derived = true;
        E.derived++;
        sub.derived++;
        recordEdge(E, sub, k, k === p.a ? p.b : p.a);
        continue;
      }
      if (!p.mid) {
        p.mid = sub.tag + ':r' + sub.ri + ':p' + i;
        E.matches[p.mid] = {
          mid: p.mid, tag: sub.tag, round: sub.ri, pair: i,
          a: p.a, b: p.b, place: sub.place
        };

      q.push(i);
    }

    if (!q.length) advanceRound(E);
  }

  function advanceRound(E) {
    var sub = E.sub, round = sub.rounds[sub.ri], winners = [], next = [], live, i;
    // Nulls are kept in place: dropping them would renumber the slots and turn
    // an unchanged half of the bracket into a set of unfamiliar pairings.
    for (i = 0; i < round.length; i++) winners.push(round[i].winner || null);
    live = winners.filter(Boolean);
    if (live.length <= 1) { closeSub(E, live[0] || null); return; }
    for (i = 0; i < winners.length; i += 2) {
      next.push({ a: winners[i], b: winners[i + 1] || null, winner: null, mid: null, bye: false });
    }
    sub.rounds.push(next);
    sub.ri++;
    markDepth(E);
    resolveRound(E);
  }

  /**
   * A sub-bracket produced its winner. Award the place, roll the candidate pool
   * forward, and start the next repechage.
   *
   * The pool is held as a FIXED-LENGTH SLOT ARRAY (a power of two, padded with
   * nulls) rather than a list, and the photo just placed is replaced IN ITS OWN
   * SLOT by a newcomer or by a hole. That single decision is what makes the
   * repechage cheap: every sub-bracket that did not contain the extracted photo
   * is pairing-for-pairing identical to the one just played, so knownWinner()
   * replays it for free and the user is only asked about the path that actually
   * changed. Rebuilding the pool as a fresh list instead re-seeds everything and
   * asks a pile of questions whose answers are already on record: measured at 98
   * comparisons for a 64-photo top 5, against 87 with the slots held, and 1389
   * against 712 for a 500-photo top 20.
   */
  function closeSub(E, winnerId) {
    E.sub = null;
    if (winnerId) E.placements.push(winnerId);
    E.place = E.placements.length + 1;
    if (!winnerId || E.placements.length >= E.target) { E.done = true; return; }

    var placed = {};
    E.placements.forEach(function (id) { placed[id] = 1; });
    var fresh = (E.victims[winnerId] || []).filter(function (id) { return !placed[id]; });

    if (!E.repSlots) {
      E.repSlots = padToPow2(byResume(E, fresh));
    } else {
      var newcomers = byResume(E, fresh.filter(function (id) { return E.repSlots.indexOf(id) < 0; }));
      var at = E.repSlots.indexOf(winnerId);
      if (at >= 0) E.repSlots[at] = newcomers.shift() || null;
      var i;
      for (i = 0; i < E.repSlots.length && newcomers.length; i++) {
        if (E.repSlots[i] == null) E.repSlots[i] = newcomers.shift();
      }
      while (newcomers.length) {                 // rare: the pool outgrew its bracket
        var grown = E.repSlots.length * 2;
        while (E.repSlots.length < grown) E.repSlots.push(null);
        for (i = 0; i < E.repSlots.length && newcomers.length; i++) {
          if (E.repSlots[i] == null) E.repSlots[i] = newcomers.shift();
        }
      }
    }

    E.candidates = E.repSlots.filter(Boolean);
    if (!E.candidates.length) { E.done = true; return; }
    startSub(E, E.repSlots.slice(), 'rep' + E.place, E.place);
  }

  function padToPow2(arr) {
    var size = nextPow2(Math.max(1, arr.length));
    while (arr.length < size) arr.push(null);
    return arr;
  }

  /**
   * Order candidates by the strength of their résumé — how deep they got in the
   * main draw, then how many comparisons they have won — so the standard seed
   * slots put the two best-credentialled photos in opposite halves and they
   * meet in the mini final rather than its first round. Ids are sorted before
   * the deterministic shuffle so the tiebreak never depends on ingest order.
   */
  function byResume(E, ids) {
    var sorted = ids.slice().sort();
    var shuffled = PT.session.seededShuffle(sorted, (E.seed ^ (E.place * 2654435761)) >>> 0);
    var rank = {};
    shuffled.forEach(function (id, i) { rank[id] = i; });
    return shuffled.slice().sort(function (x, y) {
      var d = (E.depth[y] || 0) - (E.depth[x] || 0);
      if (d) return d;
      var w = (E.wins[y] || 0) - (E.wins[x] || 0);
      if (w) return w;
      return rank[x] - rank[y];
    });
  }

  /** The pairing the user is being asked about right now, or null. */
  function currentMatch(E) {
    if (!E.sub || !E.sub.queue.length) return null;
    return E.matches[E.sub.rounds[E.sub.ri][E.sub.queue[0]].mid];
  }

  function applyPick(E, winnerId) {
    var m = currentMatch(E);
    if (!m) return false;
    var loser = winnerId === m.a ? m.b : (winnerId === m.b ? m.a : null);
    if (!loser) return false;
    var sub = E.sub, p = sub.rounds[sub.ri][sub.queue[0]];
    p.winner = winnerId;
    sub.queue.shift();
    sub.decided++;
    E.comparisons++;
    E.wins[winnerId] = (E.wins[winnerId] || 0) + 1;
    recordEdge(E, sub, winnerId, loser);
    E.history.push({ mid: m.mid, w: winnerId, l: loser, tag: sub.tag, round: sub.ri, place: sub.place });
    if (!sub.queue.length) advanceRound(E);
    return true;
  }

  /** Rotate to the back of this round's queue. Never resolved, never dropped. */
  function applyDefer(E) {
    var sub = E.sub;
    if (!sub || !sub.queue.length) return false;
    var mid = sub.rounds[sub.ri][sub.queue[0]].mid;
    E.deferCount[mid] = (E.deferCount[mid] || 0) + 1;
    E.defers++;
    sub.queue.push(sub.queue.shift());
    return true;
  }

  /**
   * Rebuild the whole bracket from the persisted log. This is the only way a
   * bracket is ever constructed — mount, undo and resume all go through here,
   * so there is exactly one code path and it is the one the tests exercise.
   */
  function build(pool, target, seed, ops) {
    var E = createEngine(pool, target, seed);
    var list = ops || [], i, op, m;
    for (i = 0; i < list.length; i++) {
      op = list[i];
      if (E.done || !E.sub) { E.broke = E.broke || 'op ' + i + ' past completion'; break; }
      m = currentMatch(E);
      if (!m) { E.broke = 'op ' + i + ' with no pending match'; break; }
      if (op.m && op.m !== m.mid) { E.broke = 'op ' + i + ' expected ' + op.m + ', bracket is at ' + m.mid; break; }
      if (op.t === 'defer') applyDefer(E);
      else if (!applyPick(E, op.w)) { E.broke = 'op ' + i + ' picked ' + op.w + ', not in ' + m.mid; break; }
    }
    return E;
  }

  /**
   * PRD success criterion 9. Decided places first, in true order. Anything not
   * yet placed is appended by main-bracket depth, then wins, then draw order —
   * so a bracket stopped after two comparisons still hands back a defensible
   * ranked list rather than an empty one.
   */
  function results(E) {
    var placed = {}, out = E.placements.slice(), idx = {};
    out.forEach(function (id) { placed[id] = 1; });
    if (out.length < E.target) {
      E.order.forEach(function (id, i) { idx[id] = i; });
      var rest = E.order.filter(function (id) { return !placed[id]; });
      rest.sort(function (a, b) {
        var d = (E.depth[b] || 0) - (E.depth[a] || 0);
        if (d) return d;
        var w = (E.wins[b] || 0) - (E.wins[a] || 0);
        if (w) return w;
        return idx[a] - idx[b];
      });
      out = out.concat(rest);
    }
    return out.slice(0, E.target);
  }

  /**
   * Comparisons still to come. Near-exact for the sub-bracket in progress — a
   * k-entrant single elimination is k-1 matches, byes included, less the ones
   * already answered by an earlier identical pairing — and modelled for the
   * places after it, where a finisher's victim list runs to about one photo per
   * round it played.
   */
  function estimate(E) {
    if (E.done) return 0;
    var rem = 0;
    if (E.sub) rem += (E.sub.entrants - 1) - E.sub.derived - E.sub.decided;
    var placesLeft = E.target - E.placements.length - (E.sub ? 1 : 0);
    if (placesLeft > 0) {
      rem += placesLeft * Math.max(1, Math.ceil(Math.log2(Math.max(2, E.order.length))) - 1);
    }
    return Math.max(0, rem);
  }

  /**
   * Unlimited undo. Drops the most recent comparison and any deferrals made
   * after it, because a user who undoes after deferring twice means "give me
   * back the choice I actually made", not "give me back a deferral".
   */
  function undoOps(ops) {
    for (var i = ops.length - 1; i >= 0; i--) {
      if (ops[i].t !== 'defer') return ops.slice(0, i);
    }
    return ops.slice(0, Math.max(0, ops.length - 1));
  }

  PT.bracket = {
    build: build,
    results: results,
    estimate: estimate,
    undoOps: undoOps,
    currentMatch: currentMatch,
    seedSlots: seedSlots,
    firstRoundPairs: firstRoundPairs,
    nextPow2: nextPow2
