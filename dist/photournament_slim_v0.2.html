  /* ======================================================================
   * 2. Styles — injected once, since src/css is owned elsewhere.
   * ==================================================================== */


  /* ======================================================================
   * 3. Shared helpers
   * ==================================================================== */

  function photoOf(id) {
    var st = PT.store.get();
    return (st && st.photos && st.photos[id]) || { id: id, name: id };
  }

  function nameOf(id) { return photoOf(id).name || id; }

  /**
   * PRD 7.9 caches a ~1600px preview and a ~320px thumb. The cache is
   * evictable (see 00_core.js), so falling back to the thumb is normal
   * operation, not an error path.
   */
  function blobFor(id, wantPreview) {
    var st = PT.store.get();
    var d = (st && st.derivatives && st.derivatives[id]) || null;
    if (!d) return null;
    return (wantPreview ? (d.preview || d.thumb) : (d.thumb || d.preview)) || null;
  }

  /** Async second chance: the record may still be in IndexedDB but not in memory. */
  function hydrate(id) {
    var st = PT.store.get();
    if (!st) return Promise.resolve(null);
    if (st.derivatives && st.derivatives[id]) return Promise.resolve(st.derivatives[id]);
    return PT.db.get('derivatives', id).then(function (rec) {
      if (!rec) return null;
      var s2 = PT.store.get();
      if (s2) { s2.derivatives = s2.derivatives || {}; s2.derivatives[id] = rec; }
      return rec;
    }).catch(function () { return null; });
  }

  function setTopbar(context, counters, stopHandler, stopLabel) {
    var bar = document.getElementById('topbar');
    if (bar) bar.hidden = false;
    var c = document.getElementById('topbar-context');
    if (c) c.textContent = context || '';
    var n = document.getElementById('topbar-counters');
    if (n) {
      PT.dom.clear(n);
      (counters || []).forEach(function (pair) {
        n.appendChild(el('span', {}, [pair[0] + ' ', el('b', { text: String(pair[1]) })]));
      });
    }
    var stop = document.getElementById('topbar-stop');
    if (stop) {
      if (stop._ptHandler) stop.removeEventListener('click', stop._ptHandler);
      stop._ptHandler = null;
      if (stopHandler) {
        stop.hidden = false;
        stop.textContent = stopLabel || 'Stop early';
        stop._ptHandler = stopHandler;
        stop.addEventListener('click', stopHandler);
      } else {
        stop.hidden = true;
      }
    }
  }

  function clearTopbar() { setTopbar('', [], null); }

  /** Router.go throws on an unregistered screen; the next screen may not exist yet. */
  function tryGo(name, params) {
    try { PT.router.go(name, params); return true; }
    catch (e) { PT.warn('bracket', 'cannot navigate to "' + name + '": ' + e.message); return false; }
  }

  /* ======================================================================
   * 4. Screen: 'bracket'  (PRD 7.3)
   * ==================================================================== */

  var S = null;   // live screen state; null when unmounted

  function unitOf(unitId) {
    var st = PT.store.get();
    if (!st || !st.session || !st.session.units) return null;
    return st.session.units[unitId] || null;
  }

  function ensureBracket(unitId) {
    var u = unitOf(unitId);
    if (!u) return null;
    if (!u.bracket || !u.bracket.ops) {
      PT.store.dispatch('bracket:init', function (s) {
        var unit = s.session.units[unitId];
        var target = unit.target == null ? unit.pool.length : Math.min(unit.target, unit.pool.length);
        var seed = (Date.now() ^ 0x9e3779b9) >>> 0;
        unit.bracket = {
          seed: seed,
          pool: unit.pool.slice(),
          target: target,
          uncapped: unit.target == null,
          order: PT.session.seededShuffle(unit.pool, seed),
          ops: [],
          stopped: false,
          complete: false,
          startedAt: Date.now()
        };
        if (unit.phase !== 'runoff' && unit.phase !== 'done') unit.phase = 'bracket';
      });
    }
    return unitOf(unitId);
  }

  /**
   * One dispatch per user action: mutate the log, rebuild, and rewrite the
   * unit's ranked output. Keeping winners current after every comparison is
   * what makes early-stop free (PRD success criterion 9).
   */
  function commit(name, mutate) {
    if (!S) return;
    var unitId = S.unitId;
    PT.store.dispatch(name, function (s) {
      var u = s.session.units[unitId];
      if (!u || !u.bracket) return;
      if (mutate) mutate(u.bracket, u);
      var E = build(u.bracket.pool, u.bracket.target, u.bracket.seed, u.bracket.ops);
      u.bracket.complete = E.done;
      u.winners = results(E);
      u.winnersDecided = E.placements.length;
      u.comparisons = E.comparisons;
      if (S) S.engine = E;
    });
    paint();
  }

  function mountBracket(root, params) {
    var unitId = params && params.unitId;
    var u = ensureBracket(unitId);

    if (!u) {
      root.appendChild(el('div', { class: 'error-box', text: 'No tournament unit "' + unitId + '" in this session.' }));
      return;
    }

    S = {
      unitId: unitId,
      root: root,
      engine: null,
      lastMid: null,
      // Shared view state. cx/cy are normalised image coordinates, so the two
      // panes show the SAME REGION even when the photos differ in aspect.
      view: { z: 1, cx: 0.5, cy: 0.5 },
      panes: [],
      onKey: null,
      onResize: null,
      token: Date.now()
    };

    S.head = el('div', { class: 'bk-sub' });
    S.stage = el('div', { class: 'bk-stage' });
    S.bar = el('div', { class: 'bk-bar' });
    S.body = el('div', { class: 'bk' }, [S.head, S.stage, S.bar]);
    root.appendChild(S.body);

    S.panes = [buildPane(0), buildPane(1)];

    S.onKey = function (e) {
      if (!S) return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      var m = S.engine && currentMatch(S.engine);
      switch (e.key) {
        case 'ArrowLeft':  if (m) { e.preventDefault(); choose(m.a); } break;
        case 'ArrowRight': if (m) { e.preventDefault(); choose(m.b); } break;
        case 'd': case 'D': if (m) { e.preventDefault(); defer(); } break;
        case 'u': case 'U': e.preventDefault(); undo(); break;
        case '0': e.preventDefault(); setZoom(1, null); break;
        case '1': e.preventDefault(); zoomOneToOne(); break;
        case '+': case '=': e.preventDefault(); setZoom(S.view.z * 1.35, null); break;
        case '-': case '_': e.preventDefault(); setZoom(S.view.z / 1.35, null); break;
      }
    };
    window.addEventListener('keydown', S.onKey);

    S.onResize = function () { if (S) applyView(); };
    window.addEventListener('resize', S.onResize);

    // The shell's own Stop-early button emits this; honour it either way.
    S.offStop = PT.bus.on('stage:stop-early', function () { setStopped(true); });

    commit('bracket:open', null);
  }

  function buildPane(side) {
    var img = el('img', { alt: '' });
    var vp = el('div', { class: 'bk-vp' }, [img]);
    var cap = el('div', { class: 'bk-cap' }, [
      el('kbd', { text: side === 0 ? '←' : '→' }),
      el('span', { class: 'nm' }),
      el('span', { class: 'spacer' }),
      el('span', { class: 'dim px' })
    ]);
    var pane = el('div', { class: 'bk-pane' }, [vp, cap]);
    var P = { side: side, pane: pane, vp: vp, img: img, cap: cap, id: null, nat: { w: 0, h: 0 } };

    img.addEventListener('load', function () {
      P.nat.w = img.naturalWidth || 0;
      P.nat.h = img.naturalHeight || 0;
      applyView();
    });

    // Drag to pan. A drag longer than a few pixels suppresses the click, so
    // panning never fires a choice by accident.
    var drag = null;
    vp.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      drag = { x: e.clientX, y: e.clientY, moved: 0, cx: S.view.cx, cy: S.view.cy };
      vp.classList.add('grab');
      try { vp.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
    });
    vp.addEventListener('pointermove', function (e) {
      if (!drag || !S) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
      var g = geom(P);
      if (!g) return;
      S.view.cx = drag.cx - dx / (g.natW * g.S);
      S.view.cy = drag.cy - dy / (g.natH * g.S);
      applyView();
    });
    function endDrag() { if (drag) { vp.classList.remove('grab'); } }
    vp.addEventListener('pointerup', function (e) {
      var wasDrag = drag && drag.moved > 5;
      endDrag();
      drag = null;
      if (wasDrag || !S) return;
      var m = S.engine && currentMatch(S.engine);
      if (m) choose(side === 0 ? m.a : m.b);
    });
    vp.addEventListener('pointercancel', function () { endDrag(); drag = null; });

    // Wheel zoom about the cursor, applied to BOTH panes.
    vp.addEventListener('wheel', function (e) {
      if (!S) return;
      e.preventDefault();
      var r = vp.getBoundingClientRect();
      // Proportional to the wheel delta so a trackpad glides and a mouse notch
      // steps, capped per event so one violent flick cannot jump to 16x.
      var f = Math.max(0.5, Math.min(2, Math.exp(-e.deltaY * 0.0015)));
      setZoom(S.view.z * f, { P: P, x: e.clientX - r.left, y: e.clientY - r.top });
    }, { passive: false });

    return P;
  }

  /* ------------------------------------------------------------ zoom model */

  /**
   * Layout for one pane at the current shared view. `fit` is the scale at which
   * the whole photo is visible; z multiplies it, so z is a shared, aspect-
   * independent quantity and both panes always frame the same relative region.
   */
  function geom(P) {
    if (!P.nat.w || !P.nat.h) return null;
    var w = P.vp.clientWidth, h = P.vp.clientHeight;
    if (!w || !h) return null;
    var fit = Math.min(w / P.nat.w, h / P.nat.h);
    var Sc = fit * S.view.z;
    return { vpW: w, vpH: h, natW: P.nat.w, natH: P.nat.h, fit: fit, S: Sc };
  }

  function halfExtents(g) {
    return [(g.vpW / 2) / (g.natW * g.S), (g.vpH / 2) / (g.natH * g.S)];
  }

  function clampCenter(g, cx, cy) {
    var h = halfExtents(g);
    return [
      h[0] >= 0.5 ? 0.5 : Math.min(1 - h[0], Math.max(h[0], cx)),
      h[1] >= 0.5 ? 0.5 : Math.min(1 - h[1], Math.max(h[1], cy))
    ];
  }

  /**
   * Getting this wrong is what makes a dual-zoom feel broken, so it is written
   * out rather than inlined. Two photos of DIFFERENT ORIENTATION overflow the
   * viewport on different axes, and both naive rules fail:
   *
   *   - clamp the shared centre against every pane: the pane that does not
   *     overflow reports a half-extent above 0.5, which pins that axis to dead
   *     centre and kills panning entirely. (Measured; it was the first attempt.)
   *   - clamp each pane independently and write nothing back: near an edge the
   *     narrower photo clamps first and the two panes silently drift onto
   *     different regions, which is exactly the comparability the PRD asks for.
   *
   * The rule that works: clamp the shared centre by the TIGHTEST pane that can
   * actually pan on that axis, ignoring panes that cannot. Every pane that can
   * pan then lands on the identical normalised centre, and a pane that cannot
   * pan shows that whole axis — which contains the other's view anyway.
   */
  function clampShared() {
    var hx = 0, hy = 0;
    S.panes.forEach(function (P) {
      var g = geom(P);
      if (!g) return;
      var h = halfExtents(g);
      if (h[0] < 0.5) hx = Math.max(hx, h[0]);
      if (h[1] < 0.5) hy = Math.max(hy, h[1]);
    });
    S.view.cx = hx > 0 ? Math.min(1 - hx, Math.max(hx, S.view.cx)) : 0.5;
    S.view.cy = hy > 0 ? Math.min(1 - hy, Math.max(hy, S.view.cy)) : 0.5;
  }

  function applyView() {
    if (!S) return;
    S.view.cx = Math.min(1, Math.max(0, S.view.cx));
    S.view.cy = Math.min(1, Math.max(0, S.view.cy));
    clampShared();
    S.panes.forEach(function (P) {
      var g = geom(P);
      if (!g) { P.img.style.transform = ''; return; }
      var c = clampCenter(g, S.view.cx, S.view.cy);
      var left = g.vpW / 2 - c[0] * g.natW * g.S;
      var top = g.vpH / 2 - c[1] * g.natH * g.S;
      P.img.style.width = g.natW + 'px';
      P.img.style.height = g.natH + 'px';
      P.img.style.transform = 'translate(' + left.toFixed(2) + 'px,' + top.toFixed(2) + 'px) scale(' + g.S.toFixed(5) + ')';
      var px = P.cap.querySelector('.px');
      if (px) px.textContent = g.natW ? g.natW + '×' + g.natH : '';
    });
    if (S.zoomLabel) S.zoomLabel.textContent = Math.round(S.view.z * 100) + '%';
  }

  /**
   * z is relative to fit, so z=1 shows both photos whole. The floor drops below
   * 1 only when a preview is smaller than its pane: there 1:1 means zooming
   * OUT, and refusing to go there would make the 1:1 button a no-op.
   */
  function minZoom() {
    var g = geom(S.panes[0]) || geom(S.panes[1]);
    return g ? Math.min(1, 1 / g.fit) : 1;
  }

  /** anchor: {P, x, y} keeps the point under the cursor fixed while zooming. */
  function setZoom(z, anchor) {
    if (!S) return;
    z = Math.max(minZoom(), Math.min(16, z));
    if (anchor && anchor.P) {
      var g = geom(anchor.P);
      if (g) {
        var left = g.vpW / 2 - S.view.cx * g.natW * g.S;
        var top = g.vpH / 2 - S.view.cy * g.natH * g.S;
        var u = (anchor.x - left) / (g.natW * g.S);
        var v = (anchor.y - top) / (g.natH * g.S);
        var S2 = g.fit * z;
        S.view.cx = u - (anchor.x - g.vpW / 2) / (g.natW * S2);
        S.view.cy = v - (anchor.y - g.vpH / 2) / (g.natH * S2);
      }
    }
    S.view.z = z;
    applyView();
  }

  /**
   * 1:1 means one preview pixel per screen pixel. Two photos of different
   * aspect cannot both be at 1:1 while framing the same region, so the LEFT
   * pane is the reference and the right stays locked to the same region.
   */
  function zoomOneToOne() {
    var g = geom(S.panes[0]) || geom(S.panes[1]);
    if (!g) return;
    setZoom(1 / g.fit, null);
  }

  /* ------------------------------------------------------------- actions */

  function choose(winnerId) {
    if (!S || !winnerId) return;
    var m = S.engine && currentMatch(S.engine);
    if (!m) return;
    commit('bracket:pick', function (b) { b.ops.push({ t: 'pick', m: m.mid, w: winnerId }); });
  }

  function defer() {
    if (!S) return;
    var m = S.engine && currentMatch(S.engine);
    if (!m) return;
    commit('bracket:defer', function (b) { b.ops.push({ t: 'defer', m: m.mid }); });
  }

  function undo() {
    if (!S) return;
    commit('bracket:undo', function (b) { b.ops = undoOps(b.ops); b.stopped = false; });
  }

  /**
   * Early-stop is a flag, not a teardown: `unit.winners` is already current
   * after every comparison, so stopping costs nothing and resuming is one
   * click. Guarded so the shell's own #topbar-stop handler and this screen's
   * cannot double-dispatch.
   */
  function setStopped(v) {
    if (!S) return;
    var u = unitOf(S.unitId);
    if (!u || !u.bracket || !!u.bracket.stopped === !!v) return;
    commit(v ? 'bracket:stop' : 'bracket:resume', function (b) { b.stopped = !!v; });
  }

  function continueToRunoff() {
    if (!S) return;
    var unitId = S.unitId;
    commit('bracket:handoff', function (b, u) { if (u.phase === 'bracket') u.phase = 'runoff'; });
    PT.bus.emit('bracket:complete', { unitId: unitId });
    if (PT.router.current() === 'bracket') tryGo('runoff', { unitId: unitId });
  }

  /* --------------------------------------------------------------- paint */

  function paint() {
    if (!S) return;
    var u = unitOf(S.unitId);
    if (!u) return;
    var E = S.engine || build(u.bracket.pool, u.bracket.target, u.bracket.seed, u.bracket.ops);
    S.engine = E;
    var m = currentMatch(E);
    var finished = E.done || u.bracket.stopped || !m;

    setTopbar(
      (u.label || 'unit') + ' · Stage B bracket',
      [
        ['target', u.bracket.uncapped ? 'uncapped' : E.target],
        ['remaining', Math.max(0, E.target - E.placements.length)],
        ['comparisons', E.comparisons],
        ['est. left', finished && E.done ? 0 : '~' + estimate(E)]
      ],
      finished ? null : function () { setStopped(true); },
      'Stop early'
    );

    if (finished) paintDone(u, E);
    else paintMatch(u, E, m);
  }

  function paintMatch(u, E, m) {
    S.stage.style.display = '';
    PT.dom.clear(S.head);
    PT.dom.clear(S.bar);

    var isRep = m.tag !== 'main';
    S.head.appendChild(el('span', {
      class: 'bk-tag' + (isRep ? ' bk-tag-rep' : ''),
      text: isRep ? 'Second chance · place ' + m.place : 'Main bracket · round ' + (m.round + 1)
    }));
    var roundTotal = E.sub.rounds[E.sub.ri].filter(function (p) { return p.mid; }).length;
    S.head.appendChild(el('span', {
      text: E.sub.queue.length + ' pairing' + (E.sub.queue.length === 1 ? '' : 's') +
            ' still to judge of ' + roundTotal + ' this round'
    }));
    if (isRep) {
      S.head.appendChild(el('span', {
        class: 'small dim',
        text: 'These lost to ' + nameOf(E.placements[E.placements.length - 1]) + ' or to a photo already placed.'
      }));
    }
    if (E.deferCount[m.mid]) {
      S.head.appendChild(el('span', {
        class: 'bk-tag bk-tag-warn',
        text: E.sub.queue.length === 1
          ? 'Deferred · last pairing in this round'
          : 'Deferred, back again'
      }));
    }
    if (E.broke) S.head.appendChild(el('span', { class: 'bk-tag bk-tag-warn', text: 'log/bracket mismatch: ' + E.broke }));

    // Attach before loading so the panes have a measurable size by the time an
    // image fires its load event.
    if (!S.stage.firstChild) {
      S.stage.appendChild(S.panes[0].pane);
      S.stage.appendChild(S.panes[1].pane);
    }
    // Only reload the photos when the pairing actually changes; repainting the
    // header after a defer must not flash the images or reset the zoom.
    if (S.lastMid !== m.mid) {
      S.lastMid = m.mid;
      S.view = { z: 1, cx: 0.5, cy: 0.5 };
      loadPane(S.panes[0], m.a);
      loadPane(S.panes[1], m.b);
    }

    S.zoomLabel = el('span', { class: 'bk-zoom', text: Math.round(S.view.z * 100) + '%' });
    S.bar.appendChild(el('button', {
      class: 'btn', id: 'bk-defer', onclick: defer,
      title: 'Sends this pairing to the back of the round. It comes back.'
    }, ['Too close to call ', el('kbd', { text: 'D' })]));
    S.bar.appendChild(el('button', {
      class: 'btn', id: 'bk-undo', onclick: undo,
      disabled: !u.bracket.ops.length
    }, ['Undo ', el('kbd', { text: 'U' })]));
    S.bar.appendChild(el('span', { class: 'spacer' }));
    S.bar.appendChild(el('button', { class: 'btn btn-sm', id: 'bk-zoomout', text: '−', onclick: function () { setZoom(S.view.z / 1.35, null); } }));
    S.bar.appendChild(S.zoomLabel);
    S.bar.appendChild(el('button', { class: 'btn btn-sm', id: 'bk-zoomin', text: '+', onclick: function () { setZoom(S.view.z * 1.35, null); } }));
    S.bar.appendChild(el('button', { class: 'btn btn-sm', id: 'bk-fit', text: 'Fit', onclick: function () { setZoom(1, null); } }));
    S.bar.appendChild(el('button', {
      class: 'btn btn-sm', id: 'bk-1to1', text: '1:1', onclick: zoomOneToOne,
      title: 'Both panes zoom together to the same region; the left pane sets the pixel scale.'
    }));
    S.bar.appendChild(el('span', { class: 'small dim', text: 'scroll to zoom · drag to pan · both photos move together' }));

    applyView();
  }

  function loadPane(P, id) {
    P.id = id;
    P.nat.w = 0; P.nat.h = 0;
    var nm = P.cap.querySelector('.nm');
    if (nm) nm.textContent = nameOf(id);
    var blob = blobFor(id, true);
    if (blob) { PT.dom.setImg(P.img, blob); return; }
    PT.dom.setImg(P.img, null);
    var token = S.token;
    hydrate(id).then(function (rec) {
      if (!S || S.token !== token || P.id !== id) return;
      var b2 = rec && (rec.preview || rec.thumb);
      if (b2) PT.dom.setImg(P.img, b2);
      else {
        var miss = P.vp.querySelector('.bk-miss');
        if (!miss) P.vp.appendChild(el('div', { class: 'bk-miss', text: nameOf(id) + ' — no cached preview' }));
      }
    });
  }

  /**
   * Completion, whether the bracket ran out of comparisons or the user stopped
   * early. Either way the ranked list is real and usable; the only difference
   * is how many places were decided head-to-head versus inferred from depth.
   */
  function paintDone(u, E) {
    PT.dom.clear(S.head);
    PT.dom.clear(S.bar);
    PT.dom.clear(S.stage);
    S.stage.style.display = 'block';
    S.lastMid = null;
    PT.dom.releaseImg(S.panes[0].img);
    PT.dom.releaseImg(S.panes[1].img);

    var stopped = !!u.bracket.stopped && !E.done;
    var decided = E.placements.length;
    var list = u.winners || [];

    S.head.appendChild(el('span', {
      class: 'bk-tag' + (stopped ? ' bk-tag-warn' : ''),
      text: stopped ? 'Stopped early' : 'Bracket complete'
    }));
    S.head.appendChild(el('span', {
      text: decided + ' of ' + list.length + ' place' + (list.length === 1 ? '' : 's') +
            ' decided head-to-head in ' + E.comparisons + ' comparison' + (E.comparisons === 1 ? '' : 's') + '.'
    }));
    if (decided < list.length) {
      S.head.appendChild(el('span', {
        class: 'small dim',
        text: 'The rest are ranked by how far they got and how many comparisons they won.'
      }));
    }
    if (E.derived) {
      S.head.appendChild(el('span', {
        class: 'small dim',
        text: E.derived + ' further pairing' + (E.derived === 1 ? '' : 's') + ' answered by a choice you had already made.'
      }));
    }

    var box = el('div', { class: 'bk-results', id: 'bk-results' });
    list.forEach(function (id, i) {
      var img = el('img', { alt: '' });
      var b = blobFor(id, false);
      if (b) PT.dom.setImg(img, b);
      var row = el('div', { class: 'bk-row', dataset: { id: id, rank: String(i + 1) } }, [
        el('span', { class: 'bk-rank', text: String(i + 1) }),
        img,
        el('span', { class: 'bk-name', text: nameOf(id) }),
        el('span', {
          class: 'small ' + (i < decided ? 'muted' : 'dim'),
          text: i < decided ? 'decided' : 'inferred'
        })
      ]);
      box.appendChild(row);
      if (!b) hydrate(id).then(function (rec) {
        if (S && rec && (rec.thumb || rec.preview)) PT.dom.setImg(img, rec.thumb || rec.preview);
      });
    });
    if (!list.length) box.appendChild(el('div', { class: 'notice notice-note', text: 'This unit has no photos to rank.' }));
    S.stage.appendChild(box);

    if (stopped) {
      S.bar.appendChild(el('button', { class: 'btn', id: 'bk-resume', text: 'Resume ranking', onclick: function () { setStopped(false); } }));
    }
    S.bar.appendChild(el('button', { class: 'btn', id: 'bk-undo', text: 'Undo last comparison', onclick: undo, disabled: !u.bracket.ops.length }));
    S.bar.appendChild(el('span', { class: 'spacer' }));
    S.bar.appendChild(el('button', { class: 'btn btn-primary', id: 'bk-continue', text: 'Next: check for duplicates', onclick: continueToRunoff }));
  }

  function unmountBracket(root) {
    if (S) {
      if (S.onKey) window.removeEventListener('keydown', S.onKey);
      if (S.onResize) window.removeEventListener('resize', S.onResize);
      if (S.offStop) S.offStop();
      S.panes.forEach(function (P) { PT.dom.releaseImg(P.img); });
    }
    PT.dom.$$('img', root).forEach(function (img) { PT.dom.releaseImg(img); });
    clearTopbar();
    S = null;
  }

  PT.router.register('bracket', { mount: mountBracket, unmount: unmountBracket });

  /* ======================================================================
   * 5. Screen: 'runoff'  (PRD 7.4, Stage C)
   * ==================================================================== */

  var R = null;

  /**
   * Groups come from the reviewed grouping (PRD 7.7) when there is one, and
   * otherwise from a fresh clustering. Either way it is computed over the
   * unit's WHOLE field, not just the winners: the frames a burst lost to
   * Stage A are exactly the ones the user now gets to reconsider.
   */
  function runoffGroups(unit) {
    var st = PT.store.get();
    var settings = (st.session && st.session.settings) || PT.session.DEFAULTS;
    var raw = null;

    if (unit.groups && unit.groups.length) {
      raw = unit.groups.map(function (g) {
        return Array.isArray(g) ? g.slice() : ((g && g.ids) || []).slice();
      });
    } else {
      var items = [];
      (unit.allIds || []).forEach(function (id) {
        var p = st.photos && st.photos[id];
        if (p && typeof p.phash === 'string' && p.phash.length === 16) {
          items.push({ id: id, hash: p.phash, w: p.w, h: p.h, sharp: p.sharp });
        }
      });
      if (items.length < 2) return [];
      try {
        raw = PT.phash.cluster(items, { threshold: settings.dupeThreshold, mode: settings.dupeMode });
      } catch (e) {
        PT.warn('runoff', 'cluster failed', e);
        return [];
      }
    }
    return raw.filter(function (g) { return g && g.length > 1; });
  }

  function membersMeta(ids) {
    var st = PT.store.get();
    return ids.map(function (id) {
      var p = (st.photos && st.photos[id]) || {};
      return { id: id, w: p.w, h: p.h, sharp: p.sharp };
    });
  }

  function mountRunoff(root, params) {
    var unitId = params && params.unitId;
    var u = unitOf(unitId);
    if (!u) {
      root.appendChild(el('div', { class: 'error-box', text: 'No tournament unit "' + unitId + '" in this session.' }));
      return;
    }

    // The entry ranking is frozen once, so every swap stays reversible and a
    // reload reproduces exactly the same list.
    if (!u.runoff) {
      PT.store.dispatch('runoff:init', function (s) {
        var unit = s.session.units[unitId];
        // keeps[origId] is an ARRAY. Its first entry holds the original rank; any
      // further entries are extra photos kept out of the same group, which is
      // what makes a mis-grouped set recoverable without leaving this screen.
      unit.runoff = { orig: (unit.winners || []).slice(), picks: {}, keeps: {}, done: false };
      });
      u = unitOf(unitId);
    }

    R = { unitId: unitId, root: root, groups: runoffGroups(u), open: {} };
    R.body = el('div', { class: 'bk' });
    root.appendChild(R.body);
    paintRunoff();
  }

  function runoffRows(u) {
    var orig = (u.runoff && u.runoff.orig) || u.winners || [];
    var byId = {};
    R.groups.forEach(function (g) { g.forEach(function (id) { byId[id] = g; }); });
    var rows = [];
    orig.forEach(function (id, i) {
      var g = byId[id];
      if (g && g.length > 1) rows.push({ rank: i + 1, orig: id, group: g });
    });
    return rows;
  }

  function keepsFor(ro, id) {
    var k = ro.keeps && ro.keeps[id];
    if (k && k.length) return k.slice();
    // Falls back to the older single-pick shape so a session saved before
    // multi-keep existed still resolves.
    return [(ro.picks && ro.picks[id]) || id];
  }

  function currentWinners(u) {
    var ro = u.runoff || { orig: u.winners || [], picks: {}, keeps: {} };
    var out = [];
    (ro.orig || []).forEach(function (id) {
      keepsFor(ro, id).forEach(function (k) {
        if (out.indexOf(k) < 0) out.push(k);
      });
    });
    return out;
  }

  /** How far the extra keeps have pushed this unit past the number it asked for. */
  function overTarget(u) {
    if (!u || u.target == null) return 0;
    return Math.max(0, currentWinners(u).length - u.target);
  }

  function commitRunoff(name, mutate) {
    if (!R) return;
    var unitId = R.unitId;
    PT.store.dispatch(name, function (s) {
      var u = s.session.units[unitId];
      if (!u) return;
      mutate(u);
      u.winners = currentWinners(u);
    });
    paintRunoff();
  }

  function paintRunoff() {
    if (!R) return;
    var u = unitOf(R.unitId);
    if (!u) return;
    var rows = runoffRows(u);
    var winners = currentWinners(u);
    var swapped = Object.keys(u.runoff.picks).filter(function (k) { return u.runoff.picks[k] !== k; }).length;

    setTopbar(
      (u.label || 'unit') + ' · choose the best of duplicates',
      (function () {
        var over = overTarget(u);
        var c = [
          ['keeping', winners.length + (u.target != null ? ' / ' + u.target : '')],
          ['with duplicates', rows.length],
          ['swapped', swapped]
        ];
        // PRD 2 treats the quota as a commitment device, so going past it must be
        // a visible, deliberate act rather than something that quietly drifts.
        if (over) c.push(['over target', '+' + over]);
        return c;
      })(),
      null
    );

    PT.dom.$$('img', R.body).forEach(function (img) { PT.dom.releaseImg(img); });
    PT.dom.clear(R.body);

    var head = el('div', { class: 'bk-sub' });
    R.body.appendChild(head);

    if (!rows.length) {
      // PRD 7.4: say so and move on rather than presenting an empty UI.
      R.body.appendChild(el('div', { class: 'notice notice-note', id: 'ro-none' }, [
        'None of these ' + winners.length + ' finalist' + (winners.length === 1 ? '' : 's') +
        ' looks like a duplicate of anything else. Nothing to choose between here.'
      ]));
      var bar0 = el('div', { class: 'bk-bar' }, [
        el('span', { class: 'spacer' }),
        el('button', { class: 'btn btn-primary', id: 'ro-continue', text: 'Continue', onclick: finishRunoff })
      ]);
      R.body.appendChild(bar0);
      return;
    }

    head.appendChild(el('span', {
      text: rows.length + ' of your keepers ' + (rows.length === 1 ? 'has' : 'have') +
            ' near-identical shots alongside it. Open one to compare them side by side, including ' +
            'frames that were cut earlier, and pick whichever you actually want. Keep more than one ' +
            'if they turn out not to be duplicates after all.'
    }));

    var list = el('div', { class: 'bk-results', id: 'ro-list' });
    rows.forEach(function (row) { list.appendChild(runoffGroupEl(u, row, winners)); });
    R.body.appendChild(list);

    R.body.appendChild(el('div', { class: 'bk-bar' }, [
      el('span', { class: 'small dim', text: 'Every choice here is reversible until you continue.' }),
      el('span', { class: 'spacer' }),
      el('button', { class: 'btn btn-primary', id: 'ro-continue', text: 'Continue', onclick: finishRunoff })
    ]));
  }

  function runoffGroupEl(u, row, winners) {
    var kept = keepsFor(u.runoff, row.orig);
    var picked = kept[0];
    var extra = kept.length - 1;
    var open = !!R.open[row.orig];
    var meta = membersMeta(row.group);
    var nominee = PT.phash.nominate(meta);

    var thumb = el('img', { alt: '' });
    var b = blobFor(picked, false);
    if (b) PT.dom.setImg(thumb, b);
    else hydrate(picked).then(function (rec) {
      if (R && rec && (rec.thumb || rec.preview)) PT.dom.setImg(thumb, rec.thumb || rec.preview);
    });

    var head = el('div', { class: 'ro-head' }, [
      el('span', { class: 'bk-rank', text: '#' + row.rank }),
      thumb,
      el('span', { class: 'bk-name' }, [
        el('div', { text: nameOf(picked) }),
        el('div', {
          class: 'small dim',
          text: row.group.length + ' look like duplicates of this' +
                (picked !== row.orig ? ' · swapped in for ' + nameOf(row.orig) : '') +
                (extra ? ' · keeping ' + kept.length + ' of them' : '')
        })
      ]),
      el('button', {
        class: 'btn btn-sm', dataset: { expand: row.orig },
        text: open ? 'Close' : 'Show duplicates',
        onclick: function () { R.open[row.orig] = !open; paintRunoff(); }
      }),
      picked !== row.orig ? el('button', {
        class: 'btn btn-sm btn-quiet', dataset: { revert: row.orig }, text: 'Revert',
        onclick: function () {
          commitRunoff('runoff:revert', function (uu) {
            delete uu.runoff.picks[row.orig];
            delete uu.runoff.keeps[row.orig];
          });
        }
      }) : null
    ]);

    var wrap = el('div', { class: 'ro-group', dataset: { group: row.orig } }, [head]);
    if (!open) return wrap;

    var grid = el('div', { class: 'grid grid-' + (row.group.length <= 6 ? '6' : (row.group.length <= 12 ? '12' : '16')) });
    row.group.forEach(function (id) {
      var isKept = kept.indexOf(id) >= 0;
      var taken = !isKept && winners.indexOf(id) >= 0;
      var cell = el('div', {
        class: 'photo-cell ro-cell' + (isKept ? ' kept' : '') + (taken ? ' dead' : ''),
        dataset: { member: id, group: row.orig },
        title: taken ? 'Already a finalist in its own right' : nameOf(id),
        onclick: taken ? null : function () {
          commitRunoff('runoff:keep', function (uu) {
            var list = keepsFor(uu.runoff, row.orig);
            var at = list.indexOf(id);
            if (at >= 0) {
              // Never empty a group: something has to hold the original rank.
              if (list.length === 1) return;
              list.splice(at, 1);
            } else {
              list.push(id);
            }
            uu.runoff.keeps[row.orig] = list;
            // Keep the legacy single-pick field consistent for anything still
            // reading it, including an older saved session.
            if (list[0] === row.orig) delete uu.runoff.picks[row.orig];
            else uu.runoff.picks[row.orig] = list[0];
          });
        }
      });
      var img = el('img', { class: 'thumb', alt: '' });
      cell.appendChild(img);
      var tags = [];
      if (id === picked) tags.push('keeping');
      else if (isKept) tags.push('also keeping');
      if (id === row.orig && id !== picked) tags.push('was #' + row.rank);
      if (id === nominee) tags.push('sharpest');
      if (taken) tags.push('already a finalist');
      if (tags.length) cell.appendChild(el('span', { class: 'tag', text: tags.join(' · ') }));
      grid.appendChild(cell);

      var bb = blobFor(id, false);
      if (bb) PT.dom.setImg(img, bb);
      else hydrate(id).then(function (rec) {
        if (R && rec && (rec.thumb || rec.preview)) PT.dom.setImg(img, rec.thumb || rec.preview);
      });
    });

    wrap.appendChild(el('div', { class: 'ro-body' }, [
      el('div', { class: 'small dim', text:
        'Click the ones worth keeping. Usually that is just the sharpest, marked below — ' +
        'but if these are not really duplicates, keep as many as you want. Each extra one ' +
        'adds to your final count.' }),
      grid
    ]));
    return wrap;
  }

  function finishRunoff() {
    if (!R) return;
    var unitId = R.unitId;
    commitRunoff('runoff:done', function (u) {
      u.runoff.done = true;
      u.phase = 'done';
    });
    PT.bus.emit('runoff:complete', { unitId: unitId });
    PT.bus.emit('unit:complete', { unitId: unitId });
    if (PT.router.current() !== 'runoff') return;
    // PT.advance() owns the next-unit / Stage D / export decision (PRD 7.6).
    if (typeof PT.advance === 'function') PT.advance();
    else if (!tryGo('export', { unitId: unitId })) tryGo('tree', {});
  }

  function unmountRunoff(root) {
    PT.dom.$$('img', root).forEach(function (img) { PT.dom.releaseImg(img); });
    clearTopbar();
    R = null;
  }

  PT.router.register('runoff', { mount: mountRunoff, unmount: unmountRunoff });

  PT.log('bracket', 'screens registered: bracket, runoff');
})();

/** CHANGELOG
 * v1.0 (2026-07-28): Initial release. Pure PT.bracket engine: deterministic
 *   seeded draw, standard seed slots so byes spread across non-power-of-two
 *   fields, elimination edges recorded, and the repechage as iterative
 *   candidate-pool mini brackets seeded by main-bracket depth. State is an ops
 *   log replayed on every change, which is what gives unlimited undo, mid-
 *   bracket resume and a tiny persisted record from one mechanism. The
 *   repechage pool is held in fixed slots and already-judged pairings are
 *   reused, so successive places replay only the path that changed. Matchup
 *   screen with viewport-filling previews, thumb fallback, click and arrow-key
 *   choice, deferral by queue rotation, and shared normalised-coordinate zoom so
 *   both photos frame the same region. Early-stop writes a ranked list from
 *   decided places plus depth-inferred order. Stage C runoff expands any
 *   finalist's burst into a reversible Keep-1 pass, and says so plainly when a
 *   unit has no near-duplicate groups.
  * v1.1 (2026-07-28): Held the repechage candidate pool in fixed slots so mini
 *   brackets that did not contain the placed photo replay unchanged, and stopped
 *   re-asking any pairing the user had already judged. 712 comparisons for a
 *   500-photo top 20 against 1389 before, and 53 for a 32-photo top 8.
 * v1.2 (2026-07-28): Stage C can now keep MORE THAN ONE photo out of a group,
 *   because perceptual hashing sometimes groups shots that are not actually
 *   duplicates and the user only discovers that while looking at them. keeps[] is
 *   a per-group array whose first entry holds the original rank; extras append to
 *   the winners and are reported as "over target" so passing the quota stays a
 *   visible, deliberate act. Replaced the "burst runoff" jargon throughout with
 *   plain language about choosing the best of duplicates.
 * v1.3 (2026-07-28): Adopted photournament_ui_v2.0.css; removed the injected
 *   style block.
*/

</script>
<script>
/* ===== 80_screen_export.js ===== */
/**
 * @file 80_screen_export.js
 * @version 1.3
 * @author Samuel Cao
 * @created 2026-07-28
 * @lastUpdated 2026-07-28
 * @description PRD 7.8 export review and output: per-finalist intent labels, ordered prefixes, per-source folder naming, mirrored or flat structure, disk writing with collision handling, download bundles, and the decision JSON.
 * @aiUpdate Update @lastUpdated and @version. Append changelog at bottom.
 *
 * Nothing is written until the user has seen exactly what will be written. The
 * review screen lists every finalist with its rank, source folder and final
 * destination filename, and the label field feeds directly into that filename so
 * the reasoning survives the export (PRD success criterion 8).
 */

(function () {
  'use strict';

  var PT = (window.PT = window.PT || {});
  var el = PT.dom.el;


  /** PRD 7.8: labels are optional, and become part of the filename. */
  function slugLabel(s) {
    return String(s || '').trim().toLowerCase()
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '')
      .slice(0, 48);
  }

  /**
   * Destination filename. The original name is always the final component so
   * provenance survives renaming (PRD 7.8), and the ordered prefix keeps
   * sequence through alphabetical sorting in slideshow tools.
   */
  function destName(photo, rank, total, settings, label) {
    var parts = [];
    if (settings.prefixes) parts.push(PT.fmt.ordinal(rank, total));
    var lab = slugLabel(label);
    if (lab) parts.push(lab);
    parts.push(photo.name);
    return parts.join('_');
  }

  /** Each result set writes to its own folder named for its source (PRD 7.8). */
  function folderFor(unit) {
    if (unit.id === 'stageD') return '_finalists_overall';
    if (unit.kind === 'pooled') return '_finalists_pooled';
    var leaf = String(unit.label || 'unit').split('/').pop();
    return '_finalists_' + leaf.replace(/[^A-Za-z0-9._-]+/g, '_');
  }

  function resultSets(session) {
    return Object.keys(session.units)
      .map(function (k) { return session.units[k]; })
      .filter(function (u) { return u.winners && u.winners.length; })
      .map(function (u) { return { unit: u, folder: folderFor(u), ids: u.winners.slice() }; });
  }

  PT.router.register('export', {
    mount: function (root) {
      var st = PT.store.get();
      var session = st.session;
      PT.dom.$('#topbar').hidden = false;
      PT.dom.$('#topbar-context').textContent = session.rootName;
      PT.dom.$('#topbar-counters').textContent = '';

      var sets = resultSets(session);

      root.appendChild(el('h1', { text: 'Export review' }));

      if (!sets.length) {
        root.appendChild(el('div', { class: 'card' }, [
          el('p', { text: 'No finalists yet. Finish at least one tournament first.' }),
          el('button', { class: 'btn', text: 'Back to the folder tree',
            onclick: function () { PT.router.go('tree'); } })
        ]));
        return;
      }

      var opts = el('div', { class: 'card row' });
      var listHost = el('div');
      var actions = el('div', { class: 'card row' });
      root.appendChild(opts);
      root.appendChild(listHost);
      root.appendChild(actions);

      session.labels = session.labels || {};

      /* --------------------------------------------------------- options -- */

      function toggle(labelText, key, title) {
        var cb = el('input', { type: 'checkbox' });
        cb.checked = !!session.settings[key];
        cb.addEventListener('change', function () {
          PT.store.dispatch('export:opt', function (s) { s.session.settings[key] = cb.checked; });
          renderList();
        });
        return el('label', { class: 'check small', title: title || '' }, [cb, el('span', { text: labelText })]);
      }

      opts.appendChild(toggle('Numbered prefixes', 'prefixes',
        'Keeps rank order when a slideshow tool sorts alphabetically'));

      var structSel = el('select', {});
      [['mirror', 'Mirror the source folders'], ['flat', 'Flatten into one folder']].forEach(function (o) {
        var op = el('option', { value: o[0], text: o[1] });
        if (session.settings.outputStructure === o[0]) op.selected = true;
        structSel.appendChild(op);
      });
      structSel.addEventListener('change', function () {
        PT.store.dispatch('export:struct', function (s) { s.session.outputStructure = structSel.value; s.session.settings.outputStructure = structSel.value; });
        renderList();
      });
      opts.appendChild(structSel);
      opts.appendChild(el('span', { class: 'spacer' }));
      opts.appendChild(el('span', { class: 'small dim', id: 'exp-total' }));

      /* ------------------------------------------------------------ list -- */

      function renderList() {
        var s = PT.store.get();
        PT.dom.clear(listHost);
        var totalFiles = 0, totalBytes = 0;

        sets.forEach(function (set) {
          var card = el('div', { class: 'card exp-set' });
          card.appendChild(el('div', { class: 'row' }, [
            el('h2', { text: set.unit.label }),
            el('span', { class: 'muted small mono', text:
              (s.session.settings.outputStructure === 'flat' ? '_finalists' : set.folder) + '/' }),
            el('span', { class: 'spacer' }),
            el('span', { class: 'muted small', text: set.ids.length + ' finalists' })
          ]));

          set.ids.forEach(function (id, i) {
            var photo = s.photos[id];
            if (!photo) return;
            totalFiles++;
            totalBytes += photo.size || 0;

            var img = el('img', { class: 'exp-thumb', alt: '' });
            var d = s.derivatives[id];
            if (d && d.thumb) PT.dom.setImg(img, d.thumb);

            var dest = el('div', { class: 'exp-dest' });
            var labelInput = el('input', {
              type: 'text', placeholder: 'why this one won, or how it will be used',
              value: s.session.labels[id] || ''
            });
            // Built as three children rather than one string so the stylesheet can
            // brighten the part the user typed, making it visible that what they
            // write becomes part of what gets written to disk.
            var refresh = function () {
              PT.dom.clear(dest);
              var slug = slugLabel(labelInput.value);
              if (s.session.settings.prefixes) {
                dest.appendChild(document.createTextNode(
                  PT.fmt.ordinal(i + 1, set.ids.length) + '_'));
              }
              if (slug) dest.appendChild(el('span', { class: 'exp-slug', text: slug + '_' }));
              dest.appendChild(document.createTextNode(photo.name));
            };
            labelInput.addEventListener('input', function () {
              PT.store.dispatch('export:label', function (ss) { ss.session.labels[id] = labelInput.value; });
              refresh();
            });
            refresh();

            card.appendChild(el('div', { class: 'exp-row' }, [
              el('span', { class: 'exp-rank', text: String(i + 1) }),
              img,
              el('div', {}, [
                el('div', { class: 'exp-name', text: photo.name }),
                el('div', { class: 'small dim', text: photo.dir || '/' })
              ]),
              el('div', {}, [labelInput, dest])
            ]));
          });

          listHost.appendChild(card);
        });

        // PRD 8: duplication across sets is deliberate, so report the real total.
        PT.dom.$('#exp-total').textContent =
          totalFiles + ' files, about ' + PT.fmt.bytes(totalBytes) + ' to write';
      }

      renderList();

      /* --------------------------------------------------------- actions -- */

      var canWrite = session.sourceKind === 'handle' && PT.env.hasFSA;

      var writeBtn = el('button', {
        class: 'btn btn-primary',
        text: canWrite ? 'Write finalists to disk' : 'Writing to disk needs a folder handle',
        onclick: function () { doWrite(sets); }
      });
      writeBtn.disabled = !canWrite;
      if (!canWrite) {
        writeBtn.title = 'This session was started from dropped files, so there is no folder to write into. ' +
          'Download the bundle instead.';
      }

      actions.appendChild(writeBtn);
      actions.appendChild(el('button', {
        class: 'btn', text: 'Save all to a folder…',
        title: 'Pick one destination folder. Everything is written there in one go, with no ' +
               'download prompts.',
        onclick: function () { doSaveToFolder(sets); }
      }));
      actions.appendChild(el('button', {
        class: 'btn', text: 'Download as one .zip',
        title: 'A single download containing every finalist, foldered. Works in any browser.',
        onclick: function () { doDownloadZip(sets); }
      }));
      actions.appendChild(el('button', {
        class: 'btn', text: 'Contact sheet',
        title: 'One PNG showing every finalist in rank order, grouped by source folder',
        onclick: function () { doContactSheet(sets); }
      }));
      actions.appendChild(el('button', { class: 'btn', text: 'Copy filename list',
        onclick: function () { copyList(sets); } }));
      actions.appendChild(el('button', { class: 'btn btn-quiet', text: 'Decision JSON',
        onclick: function () { downloadJson(sets); } }));
      actions.appendChild(el('span', { class: 'spacer' }));
      actions.appendChild(el('span', { class: 'small dim', id: 'exp-status' }));
    },

    unmount: function (root) {
      PT.dom.$$('.exp-thumb', root).forEach(function (img) { PT.dom.releaseImg(img); });
    }
  });

  function status(msg) {
    var n = PT.dom.$('#exp-status');
    if (n) n.textContent = msg;
  }

  /** Reads the original bytes back for export. */
  function originalBlob(id) {
    var src = PT.sources[id];
    if (!src) return Promise.reject(new Error('the original file is no longer available in this session'));
    if (typeof src.getFile === 'function') return src.getFile();
    return Promise.resolve(src);
  }

  function plan(sets) {
    var s = PT.store.get();
    var flat = s.session.settings.outputStructure === 'flat';
    var out = [];
    sets.forEach(function (set) {
      set.ids.forEach(function (id, i) {
        var photo = s.photos[id];
        if (!photo) return;
        out.push({
          id: id,
          photo: photo,
          folder: flat ? '_finalists' : set.folder,
          name: destName(photo, i + 1, set.ids.length, s.session.settings, s.session.labels[id]),
          rank: i + 1,
          unit: set.unit.label
        });
      });
    });
    return out;
  }

  /**
   * PRD 7.8: collision handling applies to disk writes only. When a target folder
   * already exists with contents, ask — never silently overwrite.
   */
  function resolveCollision(dirHandle, folder) {
    return dirHandle.getDirectoryHandle(folder, { create: false })
      .then(function (existing) {
        return (async function () {
          for await (var _ of existing.values()) return true;
          return false;
        })();
      })
      .then(function (hasContents) {
        if (!hasContents) return { mode: 'add', folder: folder };
        return ask(folder);
      })
      .catch(function () { return { mode: 'add', folder: folder }; });
  }

  function ask(folder) {
    return new Promise(function (resolve) {
      var body = PT.dom.$('#modal-body');
      PT.dom.clear(body);
      body.appendChild(el('h2', { text: folder + ' already has files in it' }));
      body.appendChild(el('p', { class: 'muted small', text:
        'Nothing is overwritten unless you choose to replace.' }));
      var pick = function (mode) {
        return function () {
          PT.dom.$('#modal').close();
          resolve({
            mode: mode,
            folder: mode === 'sibling'
              ? folder + '_' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '')
              : folder
          });
        };
      };
      body.appendChild(el('div', { class: 'row' }, [
        el('button', { class: 'btn', text: 'Add alongside', onclick: pick('add') }),
        el('button', { class: 'btn btn-danger', text: 'Replace contents', onclick: pick('replace') }),
        el('button', { class: 'btn btn-primary', text: 'New timestamped folder', onclick: pick('sibling') })
      ]));
      PT.dom.$('#modal').showModal();
    });
  }

  function doWrite(sets) {
    var items = plan(sets);
    status('Preparing…');

    PT.db.get('handles', 'root').then(function (rec) {
      if (!rec || !rec.handle) throw new Error('no folder handle stored for this session');
      var dir = rec.handle;

      return dir.queryPermission({ mode: 'readwrite' }).then(function (p) {
        // A stored handle comes back as "prompt" after a browser restart, and
        // re-granting requires a user gesture — which this click is.
        if (p === 'granted') return 'granted';
        return dir.requestPermission({ mode: 'readwrite' });
      }).then(function (p) {
        if (p !== 'granted') throw new Error('permission to write was not granted');

        var folders = {};
        items.forEach(function (it) { folders[it.folder] = 1; });

        var chain = Promise.resolve();
        var mapping = {};
        Object.keys(folders).forEach(function (f) {
          chain = chain.then(function () {
            return resolveCollision(dir, f).then(function (choice) { mapping[f] = choice; });
          });
        });

        return chain.then(function () {
          var written = 0;
          var seq = Promise.resolve();
          items.forEach(function (it) {
            seq = seq.then(function () {
              var choice = mapping[it.folder];
              return dir.getDirectoryHandle(choice.folder, { create: true })
                .then(function (fh) {
                  if (choice.mode === 'replace' && !choice._cleared) {
                    choice._cleared = true;
                    return (async function () {
                      var names = [];
                      for await (var e of fh.values()) names.push(e.name);
                      for (var i = 0; i < names.length; i++) {
                        await fh.removeEntry(names[i], { recursive: true });
                      }
                      return fh;
                    })();
                  }
                  return fh;
                })
                .then(function (fh) {
                  return originalBlob(it.id).then(function (blob) {
                    return fh.getFileHandle(it.name, { create: true })
                      .then(function (file) { return file.createWritable(); })
                      .then(function (w) {
                        return w.write(blob).then(function () { return w.close(); });
                      });
                  });
                })
                .then(function () {
                  written++;
                  if (written % 5 === 0) status('Writing… ' + written + ' / ' + items.length);
                });
            });
          });
          return seq.then(function () { return written; });
        });
      });
    }).then(function (written) {
      status(written + ' files written.');
      PT.toast('Wrote ' + written + ' finalists into ' + PT.store.get().session.rootName + '.');
      PT.store.dispatch('export:done', function (s) { s.session.finished = true; });
    }).catch(function (e) {
      PT.warn('export', e);
      status('');
      PT.toast('Could not write: ' + e.message);
    });
  }

  function saveBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ------------------------------------------------------------- zip out -- */

  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    var c = 0xffffffff;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function u32(v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
  function u16(v) { return [v & 255, (v >>> 8) & 255]; }

  /**
   * Builds a STORED (uncompressed) zip. Photographs are already compressed, so
   * deflating them would cost CPU and save almost nothing — which is what makes
   * a dependency-free zip writer worth having here. One download instead of N
   * is the whole point: browsers prompt on multi-file downloads and some ask for
   * a location per file.
   *
   * Bytes are read one file at a time, but every file ends up in the finished
   * Blob, so peak memory is roughly the total export size.
   */
  function buildZip(items, onProgress) {
    var parts = [];
    var central = [];
    var offset = 0;
    var enc = new TextEncoder();
    var done = 0;

    var chain = Promise.resolve();
    items.forEach(function (it) {
      chain = chain.then(function () {
        return originalBlob(it.id).then(function (blob) {
          return blob.arrayBuffer();
        }).then(function (ab) {
          var bytes = new Uint8Array(ab);
          var name = enc.encode(it.folder + '/' + it.name);
          var crc = crc32(bytes);

          var local = new Uint8Array([].concat(
            u32(0x04034b50), u16(20), u16(0), u16(0),
            u16(0), u16(0),                       // fixed timestamp: keeps output deterministic
            u32(crc), u32(bytes.length), u32(bytes.length),
            u16(name.length), u16(0)
          ));
          parts.push(local, name, bytes);
          central.push({ name: name, crc: crc, size: bytes.length, offset: offset });
          offset += local.length + name.length + bytes.length;

          done++;
          if (onProgress) onProgress(done, items.length);
        }).catch(function (e) {
          PT.warn('export', 'skipping ' + it.name + ': ' + e.message);
        });
      });
    });

    return chain.then(function () {
      var dirStart = offset;
      var dirSize = 0;
      central.forEach(function (c) {
        var head = new Uint8Array([].concat(
          u32(0x02014b50), u16(20), u16(20), u16(0), u16(0),
          u16(0), u16(0),
          u32(c.crc), u32(c.size), u32(c.size),
          u16(c.name.length), u16(0), u16(0), u16(0), u16(0),
          u32(0), u32(c.offset)
        ));
        parts.push(head, c.name);
        dirSize += head.length + c.name.length;
      });
      parts.push(new Uint8Array([].concat(
        u32(0x06054b50), u16(0), u16(0),
        u16(central.length), u16(central.length),
        u32(dirSize), u32(dirStart), u16(0)
      )));
      return new Blob(parts, { type: 'application/zip' });
    });
  }

  function doDownloadZip(sets) {
    var items = plan(sets);
    if (!items.length) return;
    status('Building the zip…');
    buildZip(items, function (n, total) { status('Packing ' + n + ' / ' + total + '…'); })
      .then(function (blob) {
        var s = PT.store.get();
        var stamp = new Date().toISOString().slice(0, 10);
        saveBlob(blob, slugLabel(s.session.rootName || 'photournament') + '_finalists_' + stamp + '.zip');
        status(items.length + ' files in one zip, ' + PT.fmt.bytes(blob.size) + '.');
      })
      .catch(function (e) {
        PT.warn('export', e);
        status('');
        PT.toast('Could not build the zip: ' + e.message);
      });
  }

  /* --------------------------------------------------------- folder save -- */

  /**
   * Writes every finalist into ONE folder the user picks, creating the per-source
   * subfolders inside it. This is the answer to a browser asking where to put
   * each file: one dialog, one destination, no download prompts at all. It works
   * even when the session came from dropped files, because the destination handle
   * is independent of the source.
   */
  function doSaveToFolder(sets) {
    if (typeof window.showDirectoryPicker !== 'function') {
      PT.toast('This browser cannot pick an output folder. Use the zip instead.');
      return;
    }
    var items = plan(sets);
    var dir;
    Promise.resolve(window.showDirectoryPicker({ mode: 'readwrite' }))
      .then(function (d) {
        dir = d;
        return d.requestPermission ? d.requestPermission({ mode: 'readwrite' }) : 'granted';
      })
      .then(function (p) {
        if (p !== 'granted') throw new Error('permission to write was not granted');
        var written = 0;
        var seq = Promise.resolve();
        items.forEach(function (it) {
          seq = seq.then(function () {
            return dir.getDirectoryHandle(it.folder, { create: true })
              .then(function (fh) {
                return originalBlob(it.id).then(function (blob) {
                  return fh.getFileHandle(it.name, { create: true })
                    .then(function (f) { return f.createWritable(); })
                    .then(function (w) { return w.write(blob).then(function () { return w.close(); }); });
                });
              })
              .then(function () {
                written++;
                status('Saving… ' + written + ' / ' + items.length);
              });
          });
        });
        return seq.then(function () { return written; });
      })
      .then(function (written) {
        status(written + ' files saved into ' + dir.name + '.');
        PT.toast('Saved ' + written + ' finalists into ' + dir.name + '.');
      })
      .catch(function (e) {
        if (e && e.name === 'AbortError') { status(''); return; }
        PT.warn('export', e);
        status('');
        PT.toast('Could not save: ' + e.message);
      });
  }

  /* --------------------------------------------------------- contact sheet -- */

  /**
   * PRD 7.8: "ranked finalists as a thumbnail grid, grouped by source."
   *
   * Composed onto a canvas and saved as one PNG rather than rendered as a web
   * view, because the useful artifact for a portfolio is a single image you can
   * open, print or send — not another screen inside the tool. Thumbnails are
   * already cached, so this costs no decoding.
   */
  function buildContactSheet(sets) {
    var s = PT.store.get();
    var COLS = 5, CELL = 260, PAD = 18, HEAD = 46, LABEL = 26, TITLE = 64;

    var blocks = sets.map(function (set) {
      var ids = set.ids.filter(function (id) { return s.derivatives[id] && s.derivatives[id].thumb; });
      return { set: set, ids: ids, rows: Math.ceil(ids.length / COLS) || 0 };
    }).filter(function (b) { return b.ids.length; });

    if (!blocks.length) return Promise.reject(new Error('no cached thumbnails to build a sheet from'));

    var width = PAD * 2 + COLS * CELL + (COLS - 1) * PAD;
    var height = TITLE + blocks.reduce(function (h, b) {
      return h + HEAD + b.rows * (CELL + LABEL + PAD);
    }, 0) + PAD;

    var canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    var ctx = canvas.getContext('2d');

    // Neutral grey, no cast — the same rule that governs the app's own chrome
    // applies to a sheet whose whole purpose is comparing photographs.
    ctx.fillStyle = '#0d0d0e';
    ctx.fillRect(0, 0, width, height);
    ctx.textBaseline = 'top';

    ctx.fillStyle = '#e8e8ea';
    ctx.font = '600 26px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(s.session.rootName + ' — finalists', PAD, PAD);

    var y = TITLE;
    var jobs = [];

    blocks.forEach(function (b) {
      var headY = y;
      jobs.push(function () {
        ctx.fillStyle = '#9a9aa2';
        ctx.font = '600 17px ui-sans-serif, system-ui, sans-serif';
        ctx.fillText(b.set.unit.label + '  ·  ' + b.ids.length, PAD, headY + 12);
        return Promise.resolve();
      });
      y += HEAD;

      b.ids.forEach(function (id, i) {
        var col = i % COLS, row = Math.floor(i / COLS);
        var x = PAD + col * (CELL + PAD);
        var cy = y + row * (CELL + LABEL + PAD);
        var photo = s.photos[id];
        var blob = s.derivatives[id].thumb;
        var rank = i + 1;

        jobs.push(function () {
          return createImageBitmap(blob).then(function (bmp) {
            ctx.fillStyle = '#000';
            ctx.fillRect(x, cy, CELL, CELL);
            // contain, never crop: a cropped contact sheet misrepresents the frame
            var sc = Math.min(CELL / bmp.width, CELL / bmp.height);
            var w = bmp.width * sc, h = bmp.height * sc;
            ctx.drawImage(bmp, x + (CELL - w) / 2, cy + (CELL - h) / 2, w, h);
            bmp.close();

            ctx.fillStyle = '#6b6b73';
            ctx.font = '13px ui-monospace, SFMono-Regular, Menlo, monospace';
            var name = photo ? photo.name : id;
            if (name.length > 30) name = name.slice(0, 29) + '…';
            ctx.fillText(rank + '. ' + name, x, cy + CELL + 6);
          }).catch(function () { /* one unreadable thumbnail must not kill the sheet */ });
        });
      });

      y += b.rows * (CELL + LABEL + PAD);
    });

    var chain = Promise.resolve();
    jobs.forEach(function (j) { chain = chain.then(j); });
    return chain.then(function () {
      return new Promise(function (res) { canvas.toBlob(res, 'image/png'); });
    });
  }

  function doContactSheet(sets) {
    status('Building the contact sheet…');
    buildContactSheet(sets).then(function (blob) {
      var s = PT.store.get();
      saveBlob(blob, slugLabel(s.session.rootName || 'photournament') + '_contact_sheet.png');
      status('Contact sheet saved, ' + PT.fmt.bytes(blob.size) + '.');
    }).catch(function (e) {
      PT.warn('export', e);
      status('');
      PT.toast('Could not build the contact sheet: ' + e.message);
    });
  }

  function copyList(sets) {
    var text = plan(sets).map(function (it) { return it.folder + '/' + it.name; }).join('\n');
    navigator.clipboard.writeText(text)
      .then(function () { PT.toast('Filename list copied.'); })
      .catch(function () { PT.toast('Could not reach the clipboard.'); });
  }

  /** PRD 7.8: decision history including labels and the full filename mapping. */
  function downloadJson(sets) {
    var s = PT.store.get();
    var items = plan(sets);
    var doc = {
      _metadata: {
        file: 'photournament_decisions.json',
        version: '1.0',
        app: 'Photournament v' + PT.VERSION,
        exported: new Date().toISOString(),
        source: s.session.rootName
      },
      settings: s.session.settings,
      allocations: s.session.allocs,
      units: Object.keys(s.session.units).map(function (k) {
        var u = s.session.units[k];
        return {
          id: u.id, label: u.label, kind: u.kind, target: u.target,
          field: u.allIds.length, comparisons: u.comparisons,
          passes: u.passes, rescued: u.rescued.length,
          winners: u.winners
        };
      }),
      mapping: items.map(function (it) {
        return {
          id: it.id, rank: it.rank, unit: it.unit,
          original: it.photo.path,
          label: s.session.labels[it.id] || '',
          exported: it.folder + '/' + it.name
        };
      }),
      actionLog: PT.store.actionLog()
    };
    saveBlob(new Blob([JSON.stringify(doc, null, 2)], { type: 'application/json' }),
      'photournament_decisions_v1.0.json');
    PT.toast('Decision JSON downloaded.');
  }
})();

/** CHANGELOG
 * v1.0 (2026-07-28): Initial release. Review list with rank, source and
 *   destination filename, per-finalist intent labels feeding the filename,
 *   toggleable ordered prefixes, mirrored or flat output, per-source folder
 *   naming, disk writing with permission re-grant and collision prompts,
 *   individual downloads, clipboard list, and the decision JSON.
  * v1.1 (2026-07-28): Replaced the one-download-per-file export, which made
 *   browsers ask for a location per photo, with two options that each need one
 *   interaction: "Save all to a folder", which writes everything into a single
 *   picked destination even when the session came from dropped files, and
 *   "Download as one .zip", a dependency-free STORED zip (photographs are already
 *   compressed, so deflating them would buy nothing).
 * v1.2 (2026-07-28): Adopted photournament_ui_v2.0.css. Removed the injected
 *   style block and split the destination filename into three nodes so the part
 *   the user typed can be highlighted as it becomes part of the written name.
 * v1.3 (2026-07-28): Added the PRD 7.8 ranked thumbnail grid as a downloadable
 *   contact sheet — one PNG, grouped by source, rank-ordered. Composed on a canvas
 *   rather than rendered as another screen, because the useful artifact for a
 *   portfolio is a single image you can open, print or send.
*/

</script>
<script>
/* ===== 99_app.js ===== */
/**
 * @file 99_app.js
 * @version 1.1
 * @author Samuel Cao
 * @created 2026-07-28
 * @lastUpdated 2026-07-28
 * @description Application boot: environment checks, session resume, stage routing, toasts, and the global keyboard layer.
 * @aiUpdate Update @lastUpdated and @version. Append changelog at bottom.
 *
 * Loads last. Every screen module has registered itself by the time this runs.
 */

(function () {
  'use strict';

  var PT = (window.PT = window.PT || {});
  var el = PT.dom.el;

  /* ------------------------------------------------------------- toasts --- */

  PT.bus.on('toast', function (msg) {
    var host = PT.dom.$('#toasts');
    if (!host) return;
    var t = el('div', { class: 'toast', text: String(msg) });
    host.appendChild(t);
    setTimeout(function () {
      t.style.opacity = '0';
      t.style.transition = 'opacity 250ms';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 260);
    }, 3200);
  });

  PT.toast = function (msg) { PT.bus.emit('toast', msg); };

  /* -------------------------------------------------------------- modal --- */

  var modal = null;
  PT.ready(function () {
    modal = PT.dom.$('#modal');
    if (modal) {
      modal.addEventListener('click', function (e) {
        // Click outside the panel closes; clicks inside must not.
        if (e.target === modal) modal.close();
      });
    }
  });

  /* ------------------------------------------------------------ routing --- */

  /**
   * Where a restored session should land. Screens own their own internal
   * position (a half-finished Stage A pass resumes from unit.currentPass), so
   * this only has to pick the right screen.
   */
  function screenForSession(session) {
    if (!session) return { name: 'welcome' };
    // PRD 7.7: a review that was open when the tab closed reopens, so a hand
    // edit is never stranded behind a reload.
    if (session.groups && session.groups.status === 'review') return { name: 'dupes' };
    switch (session.stage) {
      case 'tree':   return { name: 'tree' };
      case 'export': return { name: 'export' };
      case 'unit': {
        var u = session.units[session.activeUnitId];
        if (!u) {
          var pending = PT.session.pendingUnits(session);
          if (!pending.length) return { name: 'export' };
          return { name: 'grid', params: { unitId: pending[0].id } };
        }
        var byPhase = {
          gridA: 'grid', rescue: 'rescue', dupes: 'grid',
          bracket: 'bracket', runoff: 'runoff', done: 'grid'
        };
        return { name: byPhase[u.phase] || 'grid', params: { unitId: u.id } };
      }
      default: return { name: 'welcome' };
    }
  }

  /**
   * Called by stage screens when a unit finishes. Advances to the next pending
   * unit, then Stage D if enabled (PRD 7.6), then export.
   */
  PT.advance = function () {
    var s = PT.store.get();
    var session = s.session;
    var pending = PT.session.pendingUnits(session);

    if (pending.length) {
      PT.store.dispatch('unit:next', function (ss) { ss.session.activeUnitId = pending[0].id; });
      PT.router.go('grid', { unitId: pending[0].id });
      return;
    }

    if (session.settings.stageD && !session.stageDUnit) {
      var field = PT.session.allWinners(session);
      if (field.length > 1) {
        PT.store.dispatch('stageD:create', function (ss) {
          var u = PT.session.newUnit({
            id: 'stageD',
            kind: 'fixed',
            label: 'best of the best',
            target: Math.min(ss.session.settings.stageDTarget, field.length),
            photoIds: field
          });
          ss.session.units.stageD = u;
          ss.session.stageDUnit = 'stageD';
          ss.session.activeUnitId = 'stageD';
        });
        PT.router.go('grid', { unitId: 'stageD' });
        return;
      }
    }

    PT.store.dispatch('stage:export', function (ss) {
      ss.session.stage = 'export';
      ss.session.activeUnitId = null;
    });
    PT.router.go('export');
  };

  /* ------------------------------------------------------------- resume --- */

  /**
   * PRD 7.10. Decisions live in the sessions store and survive independently of
   * the derivative cache, which the browser may evict at any time (probe 01
   * measured storage.persist() returning false even on localhost).
   */
  function tryResume() {
    return PT.db.all('sessions').then(function (rows) {
      if (!rows || !rows.length) return null;
      rows.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      var session = rows[0];
      if (!session || session.finished) return null;
      if (session.stage === 'ingest') return null;
      return session;
    }).catch(function () { return null; });
  }

  function offerResume(session) {
    var root = PT.dom.$('#screen');
    PT.dom.clear(root);
    var wrap = el('div', { class: 'screen screen-narrow' });
    root.appendChild(wrap);

    var when = new Date(session.createdAt).toLocaleString();
    var units = Object.keys(session.units || {});
    var done = units.filter(function (k) { return session.units[k].phase === 'done'; }).length;

    wrap.appendChild(el('div', { class: 'card' }, [
      el('h1', { text: 'Pick up where you left off?' }),
      el('p', { class: 'muted', text:
        session.rootName + ' — started ' + when + '. ' +
        (units.length ? done + ' of ' + units.length + ' tournaments finished.' : '') }),
      el('div', { class: 'row', style: 'margin-top:14px' }, [
        el('button', { class: 'btn btn-primary', text: 'Resume', onclick: function () { doResume(session); } }),
        el('button', { class: 'btn', text: 'Start fresh', onclick: function () {
          PT.db.clear('sessions');
          PT.router.go('welcome');
        } })
      ])
    ]));
  }

  function doResume(session) {
    Promise.all([PT.db.all('photos'), PT.db.all('derivatives')]).then(function (r) {
      var photos = {}, derivatives = {};
      (r[0] || []).forEach(function (p) { photos[p.id] = p; });
      (r[1] || []).forEach(function (d) { derivatives[d.id] = d; });

      var live = Object.keys(photos).map(function (k) { return photos[k]; })
        .filter(function (p) { return !p.err; });

      PT.store.init({
        session: session,
        photos: photos,
        derivatives: derivatives,
        tree: live.length ? PT.tree.build(live) : null,
        resolution: null
      });

      if (!Object.keys(derivatives).length && live.length) {
        PT.toast('The thumbnail cache was cleared by the browser. Your decisions are intact.');
      }

      var target = screenForSession(session);
      PT.router.go(target.name, target.params);
    }).catch(function (e) {
      PT.warn('resume', e);
      PT.router.go('welcome');
    });
  }

  /* -------------------------------------------------------------- boot ---- */

  PT.ready(function () {
    // Chromium-only is a deliberate PRD 8 decision, but it must be stated rather
    // than surfacing as a mysteriously broken button.
    if (!PT.env.hasFSA) {
      PT.log('app', 'File System Access API unavailable: resume and disk output are off');
    }

    var stop = PT.dom.$('#topbar-stop');
    if (stop) {
      stop.addEventListener('click', function () { PT.bus.emit('stage:stop-early'); });
    }

    tryResume().then(function (session) {
      if (session) offerResume(session);
      else PT.router.go('welcome');
    });
  });

  /* --------------------------------------------------------- diagnostics -- */

  /** Handy from the console; also what the smoke tests drive. */
  PT.debug = {
    state: function () { return PT.store.get(); },
    resetAll: function () {
      return Promise.all([
        PT.db.clear('sessions'), PT.db.clear('photos'),
        PT.db.clear('derivatives'), PT.db.clear('handles')
      ]).then(function () { location.reload(); });
    },
    screens: function () { return Object.keys(PT.router._screens || {}); }
  };
})();

/** CHANGELOG
 * v1.0 (2026-07-28): Initial release. Toasts, modal dismissal, stage routing
 *   with per-phase screen selection, unit advance including the optional Stage D,
 *   session resume with an evicted-cache notice, and console diagnostics.
  * v1.1 (2026-07-28): Reopens an in-progress duplicate review on resume, so a
 *   hand edit is never stranded behind a reload.
*/

</script>
