<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Photournament recursive favicon</title>
  <desc id="desc">A simplified recursive top-left grid and one white center winner, optimized for small sizes.</desc>
  <rect width="64" height="64" fill="#171717"/>

  <!-- One explicit nested level is the scalable small-icon fallback. -->
  <g fill="#474747">
    <rect x="8" y="8" width="4" height="4"/>
    <rect x="13" y="8" width="4" height="4"/>
    <rect x="18" y="8" width="4" height="4"/>
    <rect x="8" y="13" width="4" height="4"/>
    <rect x="18" y="13" width="4" height="4"/>
    <rect x="8" y="18" width="4" height="4"/>
    <rect x="13" y="18" width="4" height="4"/>
    <rect x="18" y="18" width="4" height="4"/>
    <rect x="25" y="8" width="14" height="14"/>
    <rect x="42" y="8" width="14" height="14"/>
    <rect x="8" y="25" width="14" height="14"/>
    <rect x="42" y="25" width="14" height="14"/>
    <rect x="8" y="42" width="14" height="14"/>
    <rect x="25" y="42" width="14" height="14"/>
    <rect x="42" y="42" width="14" height="14"/>
  </g>
  <rect x="13" y="13" width="4" height="4" fill="#F3F3F3"/>
  <rect x="25" y="25" width="14" height="14" fill="#F3F3F3"/>
</svg>
