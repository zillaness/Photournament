  version: 1.3
  author: Samuel Cao
  created: 2026-07-28
  last_updated: 2026-07-28
  description: Application shell for Photournament. Build tokens are replaced by tools/build.mjs to produce the single-file dist artifact.
  ai_update: Update last_updated and version. Append changelog comment at bottom.

  Two ways to run this file:
    dev   - served over http (npm run serve), loading css/js as separate files
    dist  - node tools/build.mjs, producing one self-contained HTML file

  The dist build is the one that matters. Measured constraint: from a file://
  origin Chromium blocks fetch, XHR, module scripts with src, and relative-URL
  workers, so a multi-file app cannot run from a double-clicked HTML file.
  See tools/probes/01_capability_matrix/FINDINGS.md.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The design system's --bg, which resolves to #0d0d0d. The identity package
  shipped #171717, but that is this stylesheet's --surface, not its page
  background — the browser chrome would not have matched the page.
-->
<meta name="theme-color" content="#0d0d0d">
<title>Photournament</title>
<!--
  The favicon is embedded because the distributable must remain one file and
  file:// Chromium cannot load a sibling asset. Repository-ready source and
  raster variants live in src/assets/icons/.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23171717'/%3E%3Cg fill='%23474747'%3E%3Crect x='8' y='8' width='4' height='4'/%3E%3Crect x='13' y='8' width='4' height='4'/%3E%3Crect x='18' y='8' width='4' height='4'/%3E%3Crect x='8' y='13' width='4' height='4'/%3E%3Crect x='18' y='13' width='4' height='4'/%3E%3Crect x='8' y='18' width='4' height='4'/%3E%3Crect x='13' y='18' width='4' height='4'/%3E%3Crect x='18' y='18' width='4' height='4'/%3E%3Crect x='25' y='8' width='14' height='14'/%3E%3Crect x='42' y='8' width='14' height='14'/%3E%3Crect x='8' y='25' width='14' height='14'/%3E%3Crect x='42' y='25' width='14' height='14'/%3E%3Crect x='8' y='42' width='14' height='14'/%3E%3Crect x='25' y='42' width='14' height='14'/%3E%3Crect x='42' y='42' width='14' height='14'/%3E%3C/g%3E%3Crect x='13' y='13' width='4' height='4' fill='%23F3F3F3'/%3E%3Crect x='25' y='25' width='14' height='14' fill='%23F3F3F3'/%3E%3C/svg%3E">

<!--
  Applied BEFORE the stylesheet so the first paint is already the right theme.
  A photographer who chose the light surround should never see a dark frame
  flash past on load; the whole reason the switch exists is that the surround
  changes how a photograph reads.
-->
<script>
  try {
    var t = localStorage.getItem('photournament.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* storage can be blocked; dark is the default anyway */ }
</script>

<!--BUILD:CSS-->
<link rel="stylesheet" href="css/00_base.css">
<!--/BUILD:CSS-->


<!--
  The recursive brand mark, defined once. It uses <symbol>/<use> recursion, so
  inlining the whole file at each call site would collide on ids; screens
  reference #ptm-mark instead. Inline rather than an <img src>, because a
  sibling asset cannot load from a file:// origin.
-->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
      <symbol id="ptm-r0" viewBox="0 0 100 100">
        <g fill="var(--line-2)">
          <rect x="0" y="0" width="30" height="30" rx="3"/><rect x="35" y="0" width="30" height="30" rx="3"/><rect x="70" y="0" width="30" height="30" rx="3"/>
          <rect x="0" y="35" width="30" height="30" rx="3"/><rect x="70" y="35" width="30" height="30" rx="3"/>
          <rect x="0" y="70" width="30" height="30" rx="3"/><rect x="35" y="70" width="30" height="30" rx="3"/><rect x="70" y="70" width="30" height="30" rx="3"/>
        </g>
        <rect x="35" y="35" width="30" height="30" rx="3" fill="var(--text)"/>
      </symbol>
      <symbol id="ptm-r1" viewBox="0 0 100 100">
        <use href="#ptm-r0" x="0" y="0" width="30" height="30"/>
        <g fill="var(--line-2)">
          <rect x="35" y="0" width="30" height="30" rx="3"/><rect x="70" y="0" width="30" height="30" rx="3"/>
          <rect x="0" y="35" width="30" height="30" rx="3"/><rect x="70" y="35" width="30" height="30" rx="3"/>
          <rect x="0" y="70" width="30" height="30" rx="3"/><rect x="35" y="70" width="30" height="30" rx="3"/><rect x="70" y="70" width="30" height="30" rx="3"/>
        </g>
        <rect x="35" y="35" width="30" height="30" rx="3" fill="var(--text)"/>
      </symbol>
      <symbol id="ptm-r2" viewBox="0 0 100 100">
        <use href="#ptm-r1" x="0" y="0" width="30" height="30"/>
        <g fill="var(--line-2)">
          <rect x="35" y="0" width="30" height="30" rx="3"/><rect x="70" y="0" width="30" height="30" rx="3"/>
          <rect x="0" y="35" width="30" height="30" rx="3"/><rect x="70" y="35" width="30" height="30" rx="3"/>
          <rect x="0" y="70" width="30" height="30" rx="3"/><rect x="35" y="70" width="30" height="30" rx="3"/><rect x="70" y="70" width="30" height="30" rx="3"/>
        </g>
        <rect x="35" y="35" width="30" height="30" rx="3" fill="var(--text)"/>
      </symbol>
      <symbol id="ptm-r3" viewBox="0 0 100 100">
        <use href="#ptm-r2" x="0" y="0" width="30" height="30"/>
        <g fill="var(--line-2)">
          <rect x="35" y="0" width="30" height="30" rx="3"/><rect x="70" y="0" width="30" height="30" rx="3"/>
          <rect x="0" y="35" width="30" height="30" rx="3"/><rect x="70" y="35" width="30" height="30" rx="3"/>
          <rect x="0" y="70" width="30" height="30" rx="3"/><rect x="35" y="70" width="30" height="30" rx="3"/><rect x="70" y="70" width="30" height="30" rx="3"/>
        </g>
        <rect x="35" y="35" width="30" height="30" rx="3" fill="var(--text)"/>
      </symbol>
      <symbol id="ptm-r4" viewBox="0 0 100 100">
        <use href="#ptm-r3" x="0" y="0" width="30" height="30"/>
        <g fill="var(--line-2)">
          <rect x="35" y="0" width="30" height="30" rx="3"/><rect x="70" y="0" width="30" height="30" rx="3"/>
          <rect x="0" y="35" width="30" height="30" rx="3"/><rect x="70" y="35" width="30" height="30" rx="3"/>
          <rect x="0" y="70" width="30" height="30" rx="3"/><rect x="35" y="70" width="30" height="30" rx="3"/><rect x="70" y="70" width="30" height="30" rx="3"/>
        </g>
        <rect x="35" y="35" width="30" height="30" rx="3" fill="var(--text)"/>
      </symbol>
    </defs>
  <symbol id="ptm-mark" viewBox="0 0 100 100">
    <use href="#ptm-r4" x="0" y="0" width="32" height="32"/>
      <g fill="var(--line-2)">
        <rect x="34" y="0" width="32" height="32" rx="3"/>
        <rect x="68" y="0" width="32" height="32" rx="3"/>
        <rect x="0" y="34" width="32" height="32" rx="3"/>
        <rect x="68" y="34" width="32" height="32" rx="3"/>
        <rect x="0" y="68" width="32" height="32" rx="3"/>
        <rect x="34" y="68" width="32" height="32" rx="3"/>
        <rect x="68" y="68" width="32" height="32" rx="3"/>
      </g>
      <rect x="34" y="34" width="32" height="32" rx="3" fill="var(--text)"/>
  </symbol>
  <!--
    The plate is whatever the mark is sitting ON, not one fixed colour. The entry
    screen's card is transparent so the mark meets --bg there, but the ingest card
    and the topbar are --surface, and a --bg plate on top of those reads as a
    slightly darker square floating over the panel. --mark-plate is declared per
    context in the stylesheet; --bg is the fallback for anywhere that has not.
  -->
  <symbol id="ptm-mark-plate" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="21.9" fill="var(--mark-plate, var(--bg))"/>
    <use href="#ptm-mark" x="12.5" y="12.5" width="75" height="75"/>
  </symbol>
</svg>

<div id="app">
  <header id="topbar" hidden>
    <div class="topbar-left">
      <svg class="pt-brandmark pt-brandmark-bar" viewBox="0 0 100 100" role="img" aria-label="Photournament">
        <use href="#ptm-mark-plate"></use>
      </svg>
      <span id="topbar-title">Photournament</span>
      <span id="topbar-context" class="muted"></span>
    </div>
    <div class="topbar-right">
      <span id="topbar-counters" class="counters"></span>
      <button id="topbar-theme" class="btn btn-quiet" type="button"></button>
      <button id="topbar-stop" class="btn btn-quiet" hidden>Stop early</button>
    </div>
  </header>

  <!-- The router mounts exactly one screen here at a time. -->
  <main id="screen"></main>

  <div id="toasts" aria-live="polite"></div>

  <dialog id="modal">
    <div id="modal-body"></div>
  </dialog>
</div>

<noscript>
  <p class="error-box">Photournament needs JavaScript. Nothing is uploaded anywhere; it all runs in this tab.</p>
</noscript>

<!--
  libheif is parked here as inert text rather than a script. It is only turned
  into a worker when the first HEIC is actually encountered, so a folder of
  JPEGs never pays its parse cost. The build replaces this element's contents.
-->
<script type="text/plain" id="libheif-src"><!--BUILD:LIBHEIF--></script>

<!--
  The same trick for the perceptual hash. A Worker has no `window`, so
  20_phash.js cannot simply be importScripts'd; the ingest pool prepends a
  `window = self` shim and this source, so the worker computes a real pHash
  rather than falling back to its own inlined dHash.
-->
<script type="text/plain" id="phash-src"><!--BUILD:PHASH--></script>

<!--BUILD:JS-->
<script src="js/00_core.js"></script>
<script src="js/10_ingest_worker.js"></script>
<script src="js/20_phash.js"></script>
<script src="js/30_tree.js"></script>
<!--/BUILD:JS-->
