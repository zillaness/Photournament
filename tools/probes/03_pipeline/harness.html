<h1>Photournament ingest harness</h1>

<pre id="out">idle</pre>
<script>
  // Minimal stand-ins so the module's optional hooks are exercised. The real
  // 00_core.js is owned by the orchestrator and is not pulled in here.
  window.PT = window.PT || {};
  PT.__logs = [];
  PT.log = function () { PT.__logs.push(Array.prototype.slice.call(arguments).join(' ')); };
  PT.__events = [];
  PT.bus = {
    emit: function (n, d) { if (n !== 'ingest:progress') PT.__events.push(n); void d; },
    on: function () {}
  };
</script>
